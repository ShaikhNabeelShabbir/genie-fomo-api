  /v1/traders/{handle}/pnl:
    get:
      operationId: getTraderPnl
      tags:
      - Scorecard
      summary: Banked versus on-paper profit for one trader
      description: Answers "how much has this trader actually cashed out, versus what is only on paper?"
        from stored trade records, plus an independent `chainDerived` block computed from the wallet's
        own resolved Solana swaps. `bankedUsd` / `onPaperUsd` are null (not 0) when there are no trades
        on record. `realizedShare` is only emitted when BOTH sides are positive (sign discipline); otherwise
        `realizedShareReason` says why it is null. `openPositions` counts trade records; `openPositionsHeld`
        counts those whose token the wallet still holds on chain. `asOf` dates the fomo trade load; `chainDerived.lastSwapAt`
        dates the chain figures. `chainDerived` is null when no swap has been resolved for the wallet.
      parameters:
      - name: handle
        in: path
        required: true
        description: Directory handle, display handle (case-insensitive), `@handle`, or the trader's stable
          id as a UUID with or without the `trd_` prefix. Resolved in that order.
        schema:
          type: string
          example: '397397'
      responses:
        '200':
          description: The P&L summary.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlResponse'
              example:
                handle: '397397'
                name: null
                source: d1 · trades
                bankedUsd: 5231.05
                closedTrades: 26
                onPaperUsd: 6875
                openPositions: 5
                openPositionsHeld: 3
                openPositionsBasis:
                  openPositions: trade_records
                  openPositionsHeld: trade_records_still_held_on_chain
                realizedShare: 0.4321
                realizedShareReason: null
                asOf: '2026-09-16T06:04:12.000Z'
                capturedAt: '2026-09-16T06:04:12.000Z'
                plain: Cashed out $5,231 across 26 closed trades. $6,875 is still on paper in 5 open positions
                  — 43% of the total is actually banked.
                chainDerived:
                  realizedUsd: 4870.2
                  closedPositions: 12
                  winners: 8
                  netCashUsd: -3120.4
                  swapsResolved: 54
                  tokensTraded: 19
                  firstSwapAt: '2026-07-27T08:12:00.000Z'
                  lastSwapAt: '2026-09-16T09:41:07.000Z'
                  tier: verified
                  source: d1 · wallet_swaps (helius rpc pre/post balances)
                  basis: both sides of each swap resolved from the wallet's net balance change, so a buy
                    and its matching sell reconcile on quantity. Solana only.
                  coverage:
                    of: 54
                    total: 190
                    share: 0.2842
                  note: 'coverage is low BY CONSTRUCTION: most rows tagged SWAP are inbound transfers
                    inside someone else''s transaction, not trades the wallet made. Only two-sided swaps
                    are counted, and this figure is independent of the fomo numbers above.'
        '400':
          description: Malformed request (non-JSON body on a POST to this path family, or a bad path).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: body must be JSON
                  requestId: req_3f9c2a71b0e44d1a
        '401':
          description: '`GENIE_API_KEY` is set on the deployment and `X-API-Key` did not match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: invalid or missing X-API-Key
                  requestId: req_3f9c2a71b0e44d1a
        '404':
          description: No such trader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  detail: no trader 'nobody' in the directory
