  /v1/traders/{handle}/aum/now:
    get:
      operationId: getTraderAumNow
      tags:
      - AUM
      summary: The trader's live value, without the series
      description: The `now` block of `GET /v1/traders/{handle}/aum/history` on its own, for callers that
        only want the current figure. Read from `aum_live`, which is refreshed when a watched wallet transacts
        (Solana push), when a balance slice reads the wallet, and when prices land; the hourly series'
        last point is refreshed with it. `now` is `null` when the trader has no live figure yet; `now.totalUsd`
        is `null` when not valued (`reason` says why), never 0. `ageSeconds` is how old the figure was
        when answered.
      parameters:
      - name: handle
