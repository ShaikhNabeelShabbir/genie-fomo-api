      description: The running high since sampling began (17 Sep 2026), not the token's lifetime high.
      required:
      - usd
      - at
      properties:
        usd:
          type: number
          nullable: true
        at:
          type: string
          format: date-time
    TokenPricesResponse:
      type: object
      required:
      - address
      - chain
      - symbol
      - step
      - window
      - from
      - to
      - points
      - count
      - limit
      - truncated
      - latest
      - ath
      - asOf
      - links
      properties:
        address:
          type: string
          description: The address as stored (case preserved).
        chain:
          type: string
        symbol:
          type: string
          nullable: true
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
          description: '`tokenPrices.step` (vocabulary v9).'
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
        from:
          type: string
          format: date-time
          nullable: true
          description: Lower bound actually read; `null` only for `all` with no explicit `from`.
        to:
          type: string
          format: date-time
        points:
          type: array
          description: Ascending by `at`.
          items:
            $ref: '#/components/schemas/TokenPricePoint'
        count:
          type: integer
        limit:
          type: integer
          description: The point cap applied (`?limit=`, at most 2000).
        truncated:
          type: boolean
          description: True when the span held more than `limit` points and the OLDEST were dropped.
        latest:
          anyOf:
          - $ref: '#/components/schemas/TokenPriceLatest'
          - type: object
            nullable: true
            enum:
            - null
        ath:
          anyOf:
          - $ref: '#/components/schemas/TokenPriceAth'
          - type: object
            nullable: true
            enum:
            - null
        asOf:
          type: string
          format: date-time
          nullable: true
          description: When the newest sample was taken (`latest.at`); `null` before the first sample.
        links:
          type: object
          properties:
            token:
              type: string
            activity:
              type: string
    TokenPricesBatchRequest:
      type: object
      required:
      - addresses
      properties:
        addresses:
          type: array
          minItems: 1
          maxItems: 50
          description: Token addresses, case-insensitive. Over 50 is a 400 refusal; a duplicate is 400
            `duplicate_identifier`.
          items:
            type: string
        chain:
          type: string
          description: 'Restrict every address to one chain. Without it an address on several chains answers
            `ok:false` with `error: ambiguous_chain`.'
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
          default: 1w
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    TokenPricesBatchToken:
      type: object
      required:
      - ok
      - requested
      properties:
        ok:
          type: boolean
        requested:
          type: string
          description: The address exactly as sent.
        address:
          type: string
        chain:
          type: string
        symbol:
          type: string
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/TokenPricePoint'
        count:
          type: integer
        latest:
          anyOf:
          - $ref: '#/components/schemas/TokenPriceLatest'
          - type: object
            nullable: true
            enum:
            - null
        error:
          type: string
          enum:
          - not_found
          - ambiguous_chain
          description: Only when `ok` is false.
        detail:
          type: string
        chains:
          type: array
          description: With `ambiguous_chain`, the chains the address exists on.
          items:
            type: string
    TokenPricesBatchResponse:
      type: object
      required:
      - limit
      - asked
      - step
      - window
      - from
      - to
      - pointsLimit
      - tokens
      - asOf
      properties:
        limit:
          type: integer
          description: Addresses per call (50). The cap refuses rather than trims.
        asked:
          type: integer
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
        pointsLimit:
          type: integer
          description: Newest points kept per token (2000).
        tokens:
          type: array
          description: One entry per requested address, in the order sent.
          items:
            $ref: '#/components/schemas/TokenPricesBatchToken'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The newest sample across the answered tokens; `null` when none is sampled.
paths:
  /v1/chains:
    get:
      operationId: listChains
      tags:
      - Reference
      summary: Every indexed chain, with position, trader, price-coverage and realized-profit figures
      description: 'One entry per chain that carries at least one current holding, ordered by positions

        descending. `vocabulary.words` is the closed set of chain names to use verbatim in

        `?chain=` elsewhere. `totalValueUsd` is `null` when no position on the chain is priced;

        `realized` comes from fomo''s REPORTED trade records and is independent of price coverage.

        Closed trades whose chain could not be established are reported once under

        `unattributedRealized`, never folded into a row.

        '
      responses:
        '200':
          description: The chain board.
          headers: &id007
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-cost-units:
              description: 'How many budget units this call cost: 1 for every route in this fragment (the
                batch POST routes report the number of ids asked for, capped at 50).'
              schema:
                type: integer
                minimum: 1
                maximum: 50
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainsList'
              example:
                board: chains
                asOf: '2026-09-17T02:10:00.000Z'
                vocabulary:
                  closed: true
                  version: 1
                  words:
                  - base
                  - bsc
                  - ethereum
                  - robinhood
                  - solana
                  note: one word per network id, one network id per word. Ask with these verbatim; a word
                    not in this list is not a chain this service indexes
                traders: 448
                totalPositions: 6120
                count: 5
                unattributedRealized: null
                plain: 312 of 448 leaders trade solana, which carries 4210 of 6120 positions on the board.
                entries:
                - networkId: 1399811149
                  chain: solana
                  traders: 312
                  traderShare: 0.6964
                  positions: 4210
                  tokens: 2870
                  totalValueUsd: 35989769.12
                  coverage:
                    pricedPositions: 3901
                    unpricedPositions: 309
                    pricedShare: 0.9266
                  plain: 312 of 448 leaders trade solana, across 4210 positions.
                  realized:
                    closedTrades: 8120
                    pnlUsd: -1103437.4
                    basis: sum of realized_pnl_usd over closed trades recorded on this chain
                    tier: reported
                    source: fomoapi trade records
                    note: independent of this chain's price coverage — see coverage.pricedShare, which
                      describes the holdings snapshot, not these trades
                  historyCoverage:
                    available: true
                    via: helius
                    note: null
                  balanceVerifiable: true
        '401': &id008
          description: Only when the deployment sets GENIE_API_KEY and the X-API-Key header does not match.
            The public deployment is keyless, so this cannot occur there.
          headers: &id001
            x-request-id: &id002
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit: &id003
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining: &id004
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset: &id005
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope: &id006
              $ref: '#/components/headers/RateLimitScope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: invalid or missing X-API-Key
                  requestId: req_3f9c2a1b7d4e8f01
        '404': &id012
          description: Unknown route (URL shape). The body lists every valid route and a `hint`.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  detail: no route for GET /v1/chainz
                  requestId: req_3f9c2a1b7d4e8f01
                  hint: 'the handle is a parameter, not the first segment: /traders/<handle>/wallets'
                  routes:
                  - GET /health
                  - GET /traders
                  - GET /chains
                  - GET /fields
        '429': &id009
          description: The shared 240/min window is exhausted (or the Postgres pool is saturated, which
            is also answered as 429). Back off for `Retry-After` seconds; the RateLimit-* headers are
            reconstructed so this response still carries the budget.
          headers:
            x-request-id: *id002
            RateLimit-Limit: *id003
            RateLimit-Remaining: *id004
            RateLimit-Reset: *id005
            RateLimit-Scope: *id006
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  detail: too many requests — retry after the stated delay
                  requestId: req_3f9c2a1b7d4e8f01
                  retryAfterSeconds: 57
        '500': &id010
          description: An unclassified failure. Driver text is never returned; quote `requestId` when
            reporting it.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: internal_error
                  detail: the service failed to answer this request
                  requestId: req_3f9c2a1b7d4e8f01
        '503': &id011
          description: 'Retry, keeping your last good copy. `timeout` when the route did not answer within
            15 s (ROUTE_TIMEOUT_MS); `unavailable` when the database is unreachable or timing out. Both
            carry Retry-After: 5.'
          headers:
            x-request-id: *id002
            RateLimit-Limit: *id003
            RateLimit-Remaining: *id004
            RateLimit-Reset: *id005
            RateLimit-Scope: *id006
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                timeout:
                  value:
                    error:
                      code: timeout
                      detail: this route did not answer within 15s — retry
                      requestId: req_3f9c2a1b7d4e8f01
                      retryAfterSeconds: 5
                unavailable:
                  value:
                    error:
                      code: unavailable
                      detail: the database is not answering — retry shortly
                      requestId: req_3f9c2a1b7d4e8f01
                      retryAfterSeconds: 5
  /v1/creators/{address}:
    get:
      operationId: getCreator
      tags:
      - Reference
      summary: The dev ledger for a token-creator address, across the tokens tracked leaders hold
      description: 'Rebuilt nightly from GMGN (`tier: third_party`, `source: gmgn`). Without `?chain=`
        an EVM

        address sums across every EVM chain (network/token pairs are distinct, so launches do not

        double). `launches` counts tokens a tracked leader holds, not everything the address ever

        minted; `lastLaunchAt` is when we first saw the newest of them. 404 for an address the

        ledger has never seen. The address is matched case-insensitively and is not shape-checked.

        '
      parameters:
      - name: address
        in: path
        required: true
        description: The creator address (0x… or base58), matched case-insensitively.
        schema:
          type: string
      - name: chain
        in: query
        description: Restrict to one chain, by its `/v1/chains` vocabulary word. Unknown is a 400.
        schema:
          type: string
          enum:
          - base
          - bsc
          - ethereum
          - robinhood
          - solana
      responses:
        '200':
          description: The ledger and the tokens behind it.
          headers: *id007
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorLedger'
              example:
                creator: '0x1c9ebbc3231645d283e88e50988d0202c15ecadc'
                asOf: '2026-09-17T05:30:11.000Z'
                ledger:
                  launches: 3
                  bestPeakMcapUsd: 4120000.5
                  bestToken: '0x9d5e7f6a3b2c1d0e4f8a7b6c5d4e3f2a1b0c9d8e'
                  stillHoldingCount: 1
                  soldCount: 2
                  honeypotCount: 0
                  lastLaunchAt: '2026-09-12T14:03:27.000Z'
                tokens:
                - chain: bsc
                  tokenAddress: '0x9d5e7f6a3b2c1d0e4f8a7b6c5d4e3f2a1b0c9d8e'
                  symbol: PEPE2
                  status: creator_close
                  isHoneypot: false
                  marketCapUsd: 1830500.25
                - chain: bsc
                  tokenAddress: '0x4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b'
                  symbol: null
                  status: null
                  isHoneypot: null
                  marketCapUsd: null
                tier: third_party
                source: gmgn
        '400':
          description: '`chain` is not one of the indexed chain names.'
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: unknown chain 'polygon'
                  requestId: req_3f9c2a1b7d4e8f01
        '401': *id008
        '404':
          description: The ledger has no row for this address (on this chain, when `chain` was sent).
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  detail: no creator '0x000000000000000000000000000000000000dead' on record on bsc
                  requestId: req_3f9c2a1b7d4e8f01
        '429': *id009
        '500': *id010
        '503': *id011
  /v1/events:
    get:
      operationId: getEvents
      tags:
      - Events
      summary: Cohort event feed, oldest first, keyset-paged
      description: 'One feed over three stores: transfers (`transactions`), the wallets'' own swaps (`wallet_swaps`)
        and the sampler''s balance readings (`aum_samples`, basis `sampled`), unioned and ordered `(at,
        kind, txHash | handle)` ascending, so a poller reads forward with the cursor it was last handed.
        Nothing is pushed. `since` defaults to now − 24 h. Solana transfers and swaps arrive in real time
        from the Helius webhook; EVM transfers are backfilled nightly, so an EVM event can appear up to
        a day after its `at` — poll with the cursor, not with `since = last poll`. `?chain=` excludes
        readings, which are not per chain. `gates` is `null` when `token_info` holds no row for the token
        (unassessed, not safe). A reading''s `totalUsd: null` means refused, never zero. `nextCursor`
        is `null` on the last page; a full page only hints that more exist.'
      parameters:
      - name: since
        in: query
        required: false
        description: 'ISO-8601 lower bound on `at` (inclusive), normalised to UTC in the response. Unparseable
          answers 400 `bad_request` with `parameter: "since"`. Default: now − 24 h.'
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        required: false
        description: 'Opaque keyset cursor from this route''s `nextCursor`, unmodified. A cursor that
          does not decode, or whose shape is not `(at, kind, id)` (for example one issued by `/transactions`
          or `/trades`), answers 400 `bad_request` with `parameter: "cursor"`.'
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size. Non-integer or below 1 answers 400; above 500 is clamped to 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: kind
        in: query
        required: false
        description: Keep one kind. Case-insensitive. Any other word answers 400 with `valid` listing
          the three.
        schema:
          type: string
          enum:
          - transfer
          - swap
          - reading
      - name: chain
        in: query
        required: false
        description: A `/v1/chains` name (case-insensitive). Excludes readings. A name not in the directory
          answers 400 `bad_request` ("unknown chain").
        schema:
          type: string
      - name: handle
        in: query
        required: false
        description: 'Keep one trader, by handle, display handle, `@handle` or `trd_` id. An unknown handle
          is not an error: the feed answers 200 with zero events.'
        schema:
          type: string
      responses:
        '200':
          description: The page of events
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
              example:
                asOf: '2026-09-17T12:00:03.120Z'
                since: '2026-09-16T12:00:03.000Z'
                count: 3
                limit: 3
                filters:
                  kind: null
                  chain: null
                  handle: null
                nextCursor: WyIyMDI2LTA5LTE2VDEyOjA1OjAwLjAwMFoiLCJyZWFkaW5nIiwiMzk3Mzk3Il0
                events:
                - kind: transfer
                  at: '2026-09-16T12:04:11.000Z'
                  handle: '397397'
                  traderSource: fomoapi.io
                  chain: solana
                  tokenAddress: auzrzyaejps4zqgq7xpprsz9qs2rq4whvtkanxvawupt
                  txHash: 2Rzxy4RvkGf6KEz7aKYVA8gfzMJb5JzwFM5XAGQMkuRLiaTY1b64DS2WSshAp8NhEAZSuePSjVBNzrwM3gASfWzh
                  gates:
                    isHoneypot: false
                    canSell: true
                    priceSuspect: null
                  direction: in
                  amount: 1250000
                  counterparty: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
                  source: PUMP_FUN
                  txType: SWAP
                - kind: swap
                  at: '2026-09-16T12:04:11.000Z'
                  handle: '397397'
                  traderSource: fomoapi.io
                  chain: solana
                  tokenAddress: auzrzyaejps4zqgq7xpprsz9qs2rq4whvtkanxvawupt
                  txHash: 2Rzxy4RvkGf6KEz7aKYVA8gfzMJb5JzwFM5XAGQMkuRLiaTY1b64DS2WSshAp8NhEAZSuePSjVBNzrwM3gASfWzh
                  gates: null
                  tokenDelta: 1250000
                  quoteDelta: -1.5
                  quoteUsd: -210.46
                - kind: reading
                  at: '2026-09-16T12:05:00.000Z'
                  handle: '397397'
                  traderSource: fomoapi.io
                  totalUsd: 48211.9
                  refusedReason: null
                note: Solana transfers and swaps arrive in real time from the Helius webhook; EVM transfers
                  are backfilled nightly, so an EVM event can appear up to a day after its `at`. Readings
                  are the sampler's balance readings (basis sampled). `since` defaults to the last 24
                  hours; page forward with `nextCursor`. `?chain=` excludes readings, which are not per
                  chain.
                source: d1 · transactions, wallet_swaps, aum_samples, token_info
        '400':
          description: A parameter was refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: cursor does not belong to this route
                  requestId: req_5f1c9a3d2b7e4a10
                  parameter: cursor
        '401':
          description: X-API-Key missing or wrong (only when the deployment sets GENIE_API_KEY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: invalid or missing X-API-Key
                  requestId: req_5f1c9a3d2b7e4a10
        '429':
          description: Rate limit exceeded; `Retry-After` header is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  detail: too many requests — retry after the stated delay
                  requestId: req_5f1c9a3d2b7e4a10
                  retryAfterSeconds: 57
        '500':
          description: Unclassified failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: internal_error
                  detail: the service failed to answer this request
                  requestId: req_5f1c9a3d2b7e4a10
        '503':
          description: Database unreachable (`unavailable`) or the 15 s route budget elapsed (`timeout`);
            the `Retry-After` header is 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: timeout
                  detail: this route did not answer within 15s — retry
                  requestId: req_5f1c9a3d2b7e4a10
                  retryAfterSeconds: 5
  /v1/fields:
    get:
      operationId: getFields
      tags:
      - Reference
      summary: The published vocabulary, the unit of every quantity, the rule thresholds and live fill
        rates
      description: '`vocabulary` is the closed word list every enumerated field draws from (bump `version`
        on

        every addition). `units` states the unit by name suffix. `constants` publishes the

        thresholds the /aum rules apply. `fillRates` is counted over every trader on every call,

        not sampled; `share` is `null` only when the directory is empty.

        '
      responses:
        '200':
          description: The vocabulary report.
          headers: *id007
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldsVocabulary'
              example:
                board: fields
                asOf: '2026-09-17T12:00:00.000Z'
                traders: 448
                vocabulary:
                  closed: true
                  version: 7
                  fields:
                    aum.status:
                    - ready
                    - warming
                    - stale
                    - no_reading
                    wallets.walletState:
                    - on_record
                    - unresolved_upstream
                    health.dataState:
                    - current
                    - degraded
                units:
                  '*Usd': United States dollars, as a number. Never cents, never a string
                  '*Share': a ratio from 0 to 1 inclusive. Never a percentage
                  note: absence is always null. Zero is a claim and null is an absence — no string ever
                    stands in for a missing number, and no number for a missing fact
                constants:
                  pricedFloor: 0.25
                  partialServeFloorUsd: 100
                  drawableMinPoints: 2
                fillRates:
                  wallets.evmAddress or solanaAddress:
                    of: 445
                    total: 448
                    share: 0.9933
                    commonestAbsence: no wallet has been resolved for this trader
                  pnl.onPaperUsd:
                    of: 301
                    total: 448
                    share: 0.6719
                    commonestAbsence: no open position carries an unrealized figure
                plain: 'Every enumerated field with its complete set, every quantity with its unit, and
                  how much of the directory carries each field. Counted live, not sampled. POST /v1/traders/aum
                  accepts and ignores `live`; its rows carry liveRead: skipped. RateLimit-Remaining is
                  per X-API-Key; RateLimit-Scope says whether the counter is global.'
        '401': *id008
        '404': *id012
        '429': *id009
        '500': *id010
        '503': *id011
  /v1/health:
    get:
      operationId: getHealth
      tags:
      - Health
      summary: Liveness, per-feed freshness, per-trader staleness and which capabilities still deliver
      description: '`status` is `ok` whenever the service answers (liveness). Whether the DATA is still

        arriving is `dataState` (`current` | `degraded`) with `staleFeeds` naming the feeds that

        stopped (`scorecards` is added when any trader''s scorecard is past 72 h). Each feed

        carries its own `staleAfterHours` and a `state` of `current`, `stale` or `never`.

        The body is computed at most every 30 s per isolate (`cached`, `cacheAgeSeconds`); its

        four queries run sequentially on purpose. `rows.transactions` is a planner estimate

        (`estimatedRows`). `apiVersion` says which deployment answered.

        '
      responses:
