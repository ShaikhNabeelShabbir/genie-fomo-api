    ScorecardBuy:
      type: object
      required:
      - at
      - txHash
      - amount
      - costUsd
      - priceUsd
      - marketCapUsd
      properties:
        at:
          type: string
          format: date-time
          nullable: true
        txHash:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
        costUsd:
          type: number
          nullable: true
        priceUsd:
          type: number
          nullable: true
        marketCapUsd:
          type: number
          nullable: true
    ScorecardByToken:
      type: object
      description: One coin the trader has traded. Null means the input is missing; `fieldReasons` names
        which word applies.
      required:
      - symbol
      - address
      - trades
      - closed
      - realizedPnlUsd
      - unrealizedPnlUsd
      - totalSupply
      - supplySource
      - supplyReadAt
      - currentPriceUsd
      - currentMcapUsd
      - isHoneypotNow
      - honeypotSince
      - coHolders
      - avgEntryPrice
      - avgExitPrice
      - entryPriceSource
      - entryMethod
      - entryPositions
      - entryPositionsWeighted
      - exitMethod
      - firstEntryPrice
      - tokenCreatedAt
      - tokenAgeAtEntryDays
      - firstClosedAt
      - lastClosedAt
      - exitedBeforeFlag
      - avgEntryMarketCapUsd
      - avgExitMarketCapUsd
      - costUsd
      - proceedsUsd
      - exitMcapUsd
      - peakMcapSinceEntryUsd
      - multipleRealized
      - multipleCurrent
      - multiplePeak
      - realizedShare
      - betUsd
      - closedMonth
      - entryHoursAfterLaunch
      - costQuantity
      - proceedsQuantity
      - costCoverage
      - proceedsCoverage
      - whyNoCostUsd
      - whyNoProceedsUsd
      - buys
      - buysTotal
      - fieldReasons
      properties:
        symbol:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        trades:
          type: integer
          minimum: 0
          description: Positions on record in this coin.
        closed:
          type: integer
          minimum: 0
        realizedPnlUsd:
          type: number
        unrealizedPnlUsd:
          type: number
        totalSupply:
          type: number
          nullable: true
        supplySource:
          type: string
          nullable: true
        supplyReadAt:
          type: string
          format: date-time
          nullable: true
        currentPriceUsd:
          type: number
          nullable: true
          description: '`token_info.price_usd` at the last token-info load.'
        currentMcapUsd:
          type: number
          nullable: true
        isHoneypotNow:
          type: boolean
          nullable: true
          description: Latest security read; null when the chain is not assessed or the token never checked.
        honeypotSince:
          type: string
          format: date-time
          nullable: true
          description: First nightly read where the coin became honeypot / sell-blocked; never cleared.
        coHolders:
          type: integer
          nullable: true
          minimum: 0
          description: Distinct OTHER tracked traders with a trade in this coin on this chain; 0 when
            alone.
        avgEntryPrice:
          type: number
          nullable: true
          description: Quantity-weighted across every position, chain-derived when fomo gave none.
        avgExitPrice:
          type: number
          nullable: true
        entryPriceSource:
          type: string
          nullable: true
          enum:
          - reported
          - chain
          - null
        entryMethod:
          type: string
          nullable: true
          enum:
          - single_position
          - weighted
          - weighted_partial
          - first_only
          - null
        entryPositions:
          type: integer
          minimum: 0
        entryPositionsWeighted:
          type: integer
          minimum: 0
        exitMethod:
          type: string
          nullable: true
          enum:
          - single_position
          - weighted
          - weighted_partial
          - first_only
          - null
        firstEntryPrice:
          type: number
          nullable: true
          description: The first entry price seen, kept for comparison with the old field.
        tokenCreatedAt:
          type: string
          format: date-time
          nullable: true
        tokenAgeAtEntryDays:
          type: number
          nullable: true
        firstClosedAt:
          type: string
          format: date-time
          nullable: true
        lastClosedAt:
          type: string
          format: date-time
          nullable: true
        exitedBeforeFlag:
          type: boolean
          nullable: true
          description: True when `honeypotSince` is set and `lastClosedAt` precedes it; null when never
            flagged.
        avgEntryMarketCapUsd:
          type: number
          nullable: true
          description: '`avgEntryPrice x totalSupply`.'
        avgExitMarketCapUsd:
          type: number
          nullable: true
        costUsd:
          type: number
          nullable: true
        proceedsUsd:
          type: number
          nullable: true
        exitMcapUsd:
          type: number
          nullable: true
          description: Same value as `avgExitMarketCapUsd`.
        peakMcapSinceEntryUsd:
          type: number
          nullable: true
          description: Sampled ATH x supply, only when the ATH post-dates the first open.
        multipleRealized:
          type: number
          nullable: true
        multipleCurrent:
          type: number
          nullable: true
        multiplePeak:
          type: number
          nullable: true
        realizedShare:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Exit quantity over entry quantity, clamped; 0 = nothing sold.
        betUsd:
          type: number
          nullable: true
          description: Same value as `costUsd`.
        closedMonth:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}$
        entryHoursAfterLaunch:
          type: number
          nullable: true
        costQuantity:
          type: number
          nullable: true
        proceedsQuantity:
          type: number
          nullable: true
        costCoverage:
          $ref: '#/components/schemas/MoneyCoverage'
        proceedsCoverage:
          $ref: '#/components/schemas/MoneyCoverage'
        whyNoCostUsd:
          type: string
          nullable: true
        whyNoProceedsUsd:
          type: string
          nullable: true
        buys:
          type: array
          maxItems: 100
          description: Individual resolved buys, capped at 100; `buysTotal` is the uncapped count.
          items:
            $ref: '#/components/schemas/ScorecardBuy'
        buysTotal:
          type: integer
          minimum: 0
        fieldReasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - not_applicable
            - historical_input_missing
            - not_yet_calculated
            - no_realized_figure
            - no_winning_trade
            - sign_discipline_not_both_positive
            - source_unavailable
    PnlResponse:
      type: object
      required:
      - handle
      - name
      - source
      - bankedUsd
      - closedTrades
      - onPaperUsd
      - openPositions
      - openPositionsHeld
      - openPositionsBasis
      - realizedShare
      - realizedShareReason
      - asOf
      - capturedAt
      - plain
      - chainDerived
      properties:
        handle:
          type: string
        name:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - d1 · trades
        bankedUsd:
          type: number
          nullable: true
          description: Realised P&L over closed trades. Null with no trades on record.
        closedTrades:
          type: integer
          minimum: 0
        onPaperUsd:
          type: number
          nullable: true
          description: Unrealised P&L over open trade records. Null with no trades on record.
        openPositions:
          type: integer
          minimum: 0
          description: Open trade records (`closed_by_balance` never counts).
        openPositionsHeld:
          type: integer
          minimum: 0
          description: Open trade records whose token the wallet still holds on chain.
        openPositionsBasis:
          $ref: '#/components/schemas/PnlOpenPositionsBasis'
        realizedShare:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: '`banked / (banked + onPaper)`, only when both are positive.'
        realizedShareReason:
          type: string
          nullable: true
          enum:
          - no_trades_on_record
          - nothing_banked_or_on_paper
          - sign_discipline_not_both_positive
          - null
        asOf:
          type: string
          format: date-time
          nullable: true
          description: When the trades behind the fomo figures were loaded.
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: Older name for the trade snapshot time; kept for existing consumers.
        plain:
          type: string
        chainDerived:
          description: Independent figures from the wallet's own resolved Solana swaps; null when none
            resolved.
          anyOf:
          - $ref: '#/components/schemas/PnlChainDerived'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
    PnlOpenPositionsBasis:
      type: object
      required:
      - openPositions
      - openPositionsHeld
      properties:
        openPositions:
          type: string
          enum:
          - trade_records
        openPositionsHeld:
          type: string
          enum:
          - trade_records_still_held_on_chain
    PnlChainDerived:
      type: object
      required:
      - realizedUsd
      - closedPositions
      - winners
      - netCashUsd
      - swapsResolved
      - tokensTraded
      - firstSwapAt
      - lastSwapAt
      - tier
      - source
      - coverage
      - note
      properties:
        realizedUsd:
          type: number
          nullable: true
          description: Realised over positions opened AND fully closed on chain; null when none round-tripped.
        closedPositions:
          type: integer
          minimum: 0
        winners:
          type: integer
          minimum: 0
        netCashUsd:
          type: number
          nullable: true
          description: Dollars out minus dollars in across every resolved swap, open positions included;
            negative while still holding.
        swapsResolved:
          type: integer
          minimum: 1
        tokensTraded:
          type: integer
          minimum: 0
        firstSwapAt:
          type: string
          format: date-time
          nullable: true
        lastSwapAt:
          type: string
          format: date-time
          nullable: true
        tier:
          type: string
          enum:
          - verified
        source:
          type: string
        basis:
          type: string
        coverage:
          allOf:
          - $ref: '#/components/schemas/MoneyCoverage'
          description: Resolved two-sided swaps over rows tagged SWAP; low by construction.
        note:
          type: string
    TransactionsPage:
      type: object
      description: A page of the transfer feed. When the trader has no wallet on record only `handle`,
        `name`, `wallets`, `count`, `transfers` and `plain` are present.
      required:
      - handle
      - name
      - wallets
      - count
      - transfers
      - plain
      properties:
        handle:
          type: string
          description: The trader's display handle.
        name:
          type: string
          nullable: true
          description: The trader's name; `null` when the directory has none.
        wallets:
          $ref: '#/components/schemas/TransactionWallets'
        source:
          type: string
          description: Where the rows came from.
          example: d1 · transactions
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The newest stored transfer for these wallets; `null` when nothing is stored.
        feed:
          type: string
          enum:
          - transfers
          description: What this feed is, said plainly — transfers, not trades.
        caveats:
          $ref: '#/components/schemas/TransactionCaveats'
        stored:
          $ref: '#/components/schemas/TransactionStored'
        count:
          type: integer
          description: Rows on this page.
        limit:
          type: integer
          description: The page size applied (after clamping to 500).
        kindFilter:
          type: string
          enum:
          - all
          - swap
          - transfer
          description: The `?kind=` filter applied; `all` when none.
        money:
          $ref: '#/components/schemas/TransactionMoney'
        moneyOmitted:
          type: string
          description: Present instead of `money` while paging (a cursor was given and `?money=true` was
            not); says why.
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; `null` on the last page. A full page is only a
            hint that more exist.
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRow'
        plain:
          type: string
          description: One sentence a person can read.
    TransactionWallets:
      type: object
      required:
      - evm
      - solana
      properties:
        evm:
          type: string
          nullable: true
          description: The trader's Ethereum-style address (serves ethereum, bsc, base, robinhood); `null`
            when not on record.
        solana:
          type: string
          nullable: true
          description: The trader's Solana address; `null` when not on record.
    TransactionCaveats:
      type: object
      required:
      - notTrades
      - noUsdValue
      - limitIsTotal
      - forTrades
      properties:
        notTrades:
          type: string
        noUsdValue:
          type: string
        limitIsTotal:
          type: string
        forTrades:
          type: string
          description: Path of the trader's scorecard, where trades live.
    TransactionStored:
      type: object
      description: What the store holds for this trader in total, so an empty page can be told from an
        unfetched wallet.
      required:
      - total
      - newest
      - oldest
      properties:
        total:
          type: integer
          description: Stored transfers across all the trader's wallets and chains.
        newest:
          type: string
          format: date-time
          nullable: true
        oldest:
          type: string
          format: date-time
          nullable: true
    TransactionMoneyCoverage:
      type: object
      required:
      - of
      - total
      properties:
        of:
          type: integer
          description: Swap legs that carry a USD value.
        total:
          type: integer
          description: Swap legs stored.
        share:
          type: number
          nullable: true
          description: '`of / total` to 4 dp; `null` when `total` is 0.'
    TransactionMoney:
      type: object
      description: Whole-wallet USD totals, identical on every page, from the quote-asset legs of swaps.
      required:
      - spentUsd
      - receivedUsd
      - netUsd
      - coverage
      - note
      properties:
        spentUsd:
          type: number
          description: Sum of `value_usd` over outbound rows, 2 dp.
        receivedUsd:
          type: number
          description: Sum of `value_usd` over inbound rows, 2 dp.
        netUsd:
          type: number
          description: '`receivedUsd - spentUsd`, 2 dp.'
        basis:
          type: string
        coverage:
          $ref: '#/components/schemas/TransactionMoneyCoverage'
        note:
          type: string
    TransactionRow:
      type: object
      required:
      - chain
      - networkId
      - txHash
      - tx_hash
      - time
      - side
      - token
      - contract
      - amount
      - costUsd
      - counterparty
      - source
      - kind
      - protocol
      properties:
        chain:
          type: string
          description: Chain name as listed by `/v1/chains`.
        networkId:
          type: integer
          description: The chain's numeric network id (Solana is 1399811149).
        txHash:
          type: string
          description: The transaction hash (base58 on Solana, 0x-hex on EVM). The name to use.
        tx_hash:
          type: string
          deprecated: true
          description: Same value as `txHash`, kept under the snake_case name it was first published with.
        time:
          type: string
          format: date-time
          nullable: true
          description: Block time; `null` when the provider gave none.
        side:
          type: string
          nullable: true
          enum:
          - in
          - out
          - null
          description: Direction relative to the trader's wallet; `null` when unknown.
        token:
          type: string
          nullable: true
          description: Token symbol; `null` until a trade record has taught us the symbol.
        contract:
          type: string
          nullable: true
          description: The token's lowercased contract/mint key. Always present in practice; the thing
            to key on.
        amount:
          type: number
          nullable: true
          description: Token amount moved, always a magnitude (direction is in `side`); `null` when unknown.
        costUsd:
          type: number
          nullable: true
          description: USD size of this leg, 2 dp, a magnitude. `null` when the leg is the memecoin side
            of a swap — never 0.
        counterparty:
          type: string
          nullable: true
          description: The other address in the transfer; `null` when unknown.
        source:
          type: string
          description: The provider that ingested the row.
        kind:
          type: string
          nullable: true
          description: The provider's classification, e.g. `SWAP` or `TRANSFER`. A SWAP is a trade; a
            TRANSFER very often is not. `null` on rows ingested before this was captured.
        protocol:
          type: string
          nullable: true
          description: The provider's protocol/program label (`tx_source`), e.g. `PUMP_FUN`; `null` when
            none.
    TradesPage:
      type: object
      required:
      - handle
      - count
      - limit
      - capped
      - asOf
      - trades
      - nextCursor
      - complete
      - coverage
      - source
      properties:
        handle:
          type: string
          description: The trader's display handle.
        count:
          type: integer
          description: Rows on this page after `?status=` filtering. Can be 0 while `nextCursor` is non-null.
        limit:
          type: integer
          description: The page size applied (after clamping to 500).
        capped:
          type: boolean
          description: True when more rows exist beyond this page.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The newest trade on this page under the filters asked for; `null` when the page
            is empty.
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradeRow'
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; `null` on the last page.
        complete:
          type: boolean
          description: '`!capped` — true on the last page.'
        scanned:
          type: integer
          description: Only with `?status=`. Rows the page held before the status filter was applied.
        status:
          type: string
          enum:
          - open
          - closed
          description: Only with `?status=`. The filter applied.
        coverage:
          $ref: '#/components/schemas/TradeCoverage'
        source:
          type: string
          example: d1 · wallet_swaps (helius rpc pre/post balances)
    TradeTokenLeg:
      type: object
      required:
      - address
      - symbol
      - amount
      properties:
        address:
          type: string
          nullable: true
          description: The token's case-preserved address; `null` when the mint is not in the directory.
        symbol:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
          description: Magnitude of the token leg; `null` when unknown.
    TradeMoneyLeg:
      type: object
      description: The leg whose dollar value we know — what was paid with or received in.
      required:
      - symbol
      - tokenKey
      - amount
      properties:
        symbol:
          type: string
          nullable: true
        tokenKey:
          type: string
          nullable: true
          description: Lowercased key of the quote asset.
        amount:
          type: number
          nullable: true
          description: Magnitude of the money leg; `null` when unknown.
    TradeRow:
      type: object
      required:
      - chain
      - networkId
      - txHash
      - at
      - side
      - token
      - money
      - valueUsd
      - valueSource
      - priceUsd
      - tier
      - positionId
      - status
      - openedAt
      - closedAt
      - holdSeconds
      - whyNoPosition
      - source
      - confidence
      - feeNative
      - feeNativeSymbol
      - feeUsd
      - feeUsdBasis
      - whyNoFee
      properties:
        chain:
          type: string
        networkId:
          type: integer
        txHash:
          type: string
        at:
          type: string
          format: date-time
          nullable: true
        side:
          type: string
          nullable: true
          enum:
          - buy
          - sell
          - null
          description: Derived from the sign of the token leg, not from a label; `null` when the token
            delta is unknown.
        token:
          $ref: '#/components/schemas/TradeTokenLeg'
        money:
          $ref: '#/components/schemas/TradeMoneyLeg'
        valueUsd:
          type: number
          nullable: true
          description: USD value of the money leg, 2 dp, a magnitude; `null` when the money leg is unpriced.
        valueSource:
          type: string
          nullable: true
          enum:
          - money_side_pegged
          - money_side_daily_close
          - money_side_market
          - null
          description: 'Which arm priced the money leg when `valueUsd` is present: the quote asset''s
            peg, the daily close of the block day (up to 7 days back), or the portfolio''s market price;
            `null` when `valueUsd` is null.'
        priceUsd:
          type: number
          nullable: true
          description: '`valueUsd / token.amount`, implied by the two legs for cross-checking, not a quoted
            price; `null` when either is missing.'
        tier:
          type: string
          enum:
          - verified
          description: Every row here is chain-verified.
        positionId:
          type: string
          nullable: true
          description: The tx hash of the buy that opened this lot (FIFO); `null` on a sell with no matching
            buy.
        status:
          type: string
          nullable: true
          enum:
          - open
          - closed
          - null
          description: '`open` until a later sell finishes consuming the buy; `closed` after; `null` when
            no pairing exists.'
        openedAt:
          type: string
          format: date-time
          nullable: true
          description: On a sell, when the quantity it sold was bought.
        closedAt:
          type: string
          format: date-time
          nullable: true
        holdSeconds:
          type: integer
          nullable: true
          description: '`closedAt - openedAt` in seconds; `null` unless both are known.'
        whyNoPosition:
          type: string
          nullable: true
          description: Present when `positionId` is `null`; says why.
        source:
          type: string
          example: helius rpc pre/post balances
        confidence:
          type: string
          enum:
          - high
          - medium
          description: '`high` when the money leg is priced, else `medium`.'
        feeNative:
          type: number
          nullable: true
          description: The fee this transaction paid in the chain's own coin; `null` when no fee row has
            been read.
        feeNativeSymbol:
          type: string
          nullable: true
        feeUsd:
          type: number
          nullable: true
          description: '`feeNative` at the current native price, 6 dp; `null` when no fee or no price
            — never 0.'
        feeUsdBasis:
          type: string
          nullable: true
        whyNoFee:
          type: string
          nullable: true
          description: Why `feeUsd` is `null`; `null` when it is not.
    TradeCoverageChain:
      type: object
      required:
      - chain
      - state
      - from
      - to
      - swaps
      - why
      properties:
        chain:
          type: string
        state:
          type: string
          enum:
          - complete
          - unresolved
          description: '`unresolved` means we resolved none of this wallet''s own trades there, not that
            it made none.'
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        swaps:
          type: integer
          description: Resolved swaps held for this chain over the trader's whole record.
        why:
          type: string
          nullable: true
    TradeCoverage:
      type: object
      required:
      - chainsResolved
      - chainsTradedButUnresolved
      - byChain
      - why
      properties:
        chainsResolved:
          type: array
          items:
            type: string
          description: Chains with at least one row on this page.
        chainsTradedButUnresolved:
          type: array
          items:
            type: string
          description: Chains the trader is known to trade on that have no row on this page.
        byChain:
          type: array
          items:
            $ref: '#/components/schemas/TradeCoverageChain'
        why:
          type: string
    EventsPage:
      type: object
      required:
      - asOf
      - since
      - count
      - limit
      - filters
      - nextCursor
      - events
      - note
      - source
      properties:
        asOf:
          type: string
          format: date-time
          description: When this page was produced.
        since:
          type: string
          format: date-time
          description: The lower bound applied, normalised (default now − 24 h).
        count:
          type: integer
        limit:
          type: integer
        filters:
          $ref: '#/components/schemas/EventFilters'
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; `null` on the last page.
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'
        note:
          type: string
        source:
          type: string
          example: d1 · transactions, wallet_swaps, aum_samples, token_info
    EventFilters:
      type: object
      required:
      - kind
      - chain
      - handle
      properties:
        kind:
          type: string
          nullable: true
          enum:
          - transfer
          - swap
          - reading
          - null
        chain:
          type: string
          nullable: true
          description: The `?chain=` value as given; `null` when none.
        handle:
          type: string
          nullable: true
          description: The resolved directory handle; `null` when none.
    EventGates:
      type: object
      description: GMGN's security read for the token from `token_info`. The whole object is `null` when
        no row exists — unassessed, not safe.
      required:
      - isHoneypot
      - canSell
      - priceSuspect
      properties:
        isHoneypot:
          type: boolean
        canSell:
          type: boolean
          nullable: true
          description: '`null` when the security source never judged it; `false` when it said "cannot
            sell".'
        priceSuspect:
          type: boolean
          nullable: true
          description: Reserved; always `null` on this feed (the price check lives on `/positions`).
    EventItem:
      description: One event; the shape depends on `kind`.
      oneOf:
      - $ref: '#/components/schemas/EventTransfer'
      - $ref: '#/components/schemas/EventSwap'
      - $ref: '#/components/schemas/EventReading'
      discriminator:
        propertyName: kind
        mapping:
          transfer: '#/components/schemas/EventTransfer'
          swap: '#/components/schemas/EventSwap'
          reading: '#/components/schemas/EventReading'
    EventBase:
      type: object
      required:
      - kind
      - at
      - handle
      - traderSource
      properties:
        kind:
          type: string
          enum:
          - transfer
          - swap
          - reading
        at:
          type: string
          format: date-time
        handle:
          type: string
          description: The trader's display handle.
        traderSource:
          type: string
          enum:
          - fomoapi.io
          - gmgn
          description: Which directory the trader came from (`traders.source`).
    EventTransfer:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - chain
        - tokenAddress
        - txHash
        - gates
        - direction
        - amount
        - counterparty
        - source
        - txType
        properties:
          kind:
            type: string
            enum:
            - transfer
          chain:
            type: string
            nullable: true
          tokenAddress:
            type: string
            nullable: true
            description: The lowercased token key from the feed.
          txHash:
            type: string
          gates:
            anyOf:
            - $ref: '#/components/schemas/EventGates'
            - type: object
              nullable: true
              enum:
              - null
              description: absent
          direction:
            type: string
            nullable: true
            enum:
            - in
            - out
            - null
          amount:
            type: number
            nullable: true
          counterparty:
            type: string
            nullable: true
          source:
            type: string
            nullable: true
            description: The provider's protocol label (`tx_source`), e.g. `PUMP_FUN`.
          txType:
            type: string
            nullable: true
            description: The provider's classification, e.g. `SWAP` or `TRANSFER`.
    EventSwap:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - chain
        - tokenAddress
        - txHash
        - gates
        - tokenDelta
        - quoteDelta
        - quoteUsd
        properties:
          kind:
            type: string
            enum:
            - swap
          chain:
            type: string
            nullable: true
          tokenAddress:
            type: string
            nullable: true
          txHash:
            type: string
          gates:
            anyOf:
            - $ref: '#/components/schemas/EventGates'
            - type: object
              nullable: true
              enum:
              - null
              description: absent
          tokenDelta:
            type: number
            nullable: true
            description: Signed change in the token leg (positive = bought).
          quoteDelta:
            type: number
            nullable: true
            description: Signed change in the money leg.
          quoteUsd:
            type: number
            nullable: true
            description: USD value of the money leg, 2 dp, signed; `null` when unpriced.
    EventReading:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - totalUsd
        - refusedReason
        properties:
          kind:
            type: string
            enum:
            - reading
          totalUsd:
            type: number
            nullable: true
            description: The sampler's balance reading, 2 dp; `null` means refused, never 0.
          refusedReason:
            type: string
            nullable: true
            enum:
            - too_little_priced
            - nothing_answered
            - chains_unrebuildable
            - no_prices
            - wallet_unreadable
            - service_timeout
            - price_rejected
            - price_suspect
            - no_tokens_known
            - null
            description: Why the reading was refused; `null` when it was not.
    FlowRow:
      type: object
      required:
      - chain
      - tokenAddress
      - tokenKey
      - in
      - out
      - net
      - transfers
      - firstAt
      - lastAt
      properties:
        chain:
          type: string
          enum:
          - solana
        tokenAddress:
          type: string
          nullable: true
          description: Case-preserved mint address; `null` when the mint is not yet in the directory.
        tokenKey:
          type: string
          description: The feed's lowercased key. Always present; the thing to group by.
        in:
          type: number
          description: Sum of inbound amounts since `since` (0 when none).
        out:
          type: number
          description: Sum of outbound amounts since `since` (0 when none).
        net:
          type: number
          description: '`in - out`.'
        transfers:
          type: integer
          description: Transfer rows summed.
        firstAt:
          type: string
          format: date-time
          nullable: true
        lastAt:
          type: string
          format: date-time
          nullable: true
    FlowEnvelope:
      type: object
      required:
      - since
      - chains
      - note
      properties:
        since:
          type: string
          format: date-time
          description: The lower bound applied, normalised to UTC.
        basis:
          type: string
          enum:
          - transactions
        chains:
          type: array
          items:
            type: string
            enum:
            - solana
        note:
          type: string
    FlowPage:
      allOf:
      - $ref: '#/components/schemas/FlowEnvelope'
      - type: object
        required:
        - handle
        - count
        - rows
        properties:
          handle:
            type: string
            description: The trader's display handle.
          count:
            type: integer
            description: Tokens that moved.
          rows:
            type: array
            items:
              $ref: '#/components/schemas/FlowRow'
    FlowBatchRequest:
      type: object
      required:
      - ids
      - since
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
          description: Handles, display handles or `trd_` ids. Empty or absent is 400 `bad_request`; over
            50 is 400 `bad_request` (refused, not trimmed); a repeated id, or an id and its handle naming
            the same trader, is 400 `duplicate_identifier`.
        since:
          type: string
          format: date-time
          description: 'ISO-8601 lower bound. Absent or unparseable is 400 `bad_request` with `parameter:
            "since"`.'
    FlowBatchTraderError:
      type: object
      required:
      - code
      - detail
      properties:
        code:
          type: string
          enum:
          - not_found
        detail:
          type: string
    FlowBatchTrader:
      type: object
      description: One entry per requested id, in the order sent.
      required:
      - ok
      - requested
      - handle
      properties:
        ok:
          type: boolean
        requested:
          type: string
          description: The id exactly as the caller sent it.
        handle:
          type: string
          nullable: true
          description: The resolved display handle; `null` when `ok` is false.
        count:
          type: integer
          description: Only when `ok` is true.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FlowRow'
          description: Only when `ok` is true.
        error:
          allOf:
          - $ref: '#/components/schemas/FlowBatchTraderError'
          description: Only when `ok` is false.
    FlowBatch:
      allOf:
      - type: object
        required:
        - limit
        - asked
        - capped
        - asOf
        properties:
          limit:
            type: integer
            enum:
            - 50
            description: The batch cap.
          asked:
            type: integer
            description: How many ids were sent; this call's rate-limit cost.
          capped:
            type: boolean
            description: Always `false` here — over the cap is refused with 400, never trimmed.
          asOf:
            type: string
            format: date-time
            nullable: true
            description: Always `null` on this route.
      - $ref: '#/components/schemas/FlowEnvelope'
      - type: object
        required:
        - traders
        properties:
          traders:
            type: array
            items:
              $ref: '#/components/schemas/FlowBatchTrader'
    AumHistoryPoint:
      type: object
      description: 'One bucket. Hourly points (`step: 1h`) carry `basis`, `reason`, `pricedPositions`
        and `totalPositions`; rolled-up points (`1d`, `1w`, `1mo`) carry `highUsd`, `lowUsd` and `valuedHours`,
        with `totalUsd` the close (last valued hour in the bucket). `null` is absent, never 0.'
      required:
      - at
      - totalUsd
      properties:
        at:
          type: string
          format: date-time
          description: Bucket start, UTC.
        totalUsd:
          type: number
          nullable: true
          description: Value held, or `null` when the bucket was not valued.
        basis:
          type: string
          enum:
          - reading
          - priced
          description: Hourly only. `reading` when a sampled reading stood in that hour; `priced` when
            built from holdings and prices.
        reason:
          type: string
          nullable: true
          enum:
          - no_holdings
          - no_prices
          - too_little_priced
          - price_suspect
          - null
          description: Hourly only. Why `totalUsd` is `null`; `null` when it is valued.
        suspectUsd:
          type: number
          nullable: true
          description: Hourly only. Gross value of positions whose price failed the suspect rule, kept
            out of `totalUsd`; `null` when none (never 0).
        unsellableUsd:
          type: number
          nullable: true
          description: Hourly only. Gross value of honeypot / cannot-sell positions, kept out of `totalUsd`;
            `null` when none (never 0).
        pricedPositions:
          type: integer
          description: Hourly only.
        totalPositions:
          type: integer
          description: Hourly only.
        highUsd:
          type: number
          nullable: true
          description: Rolled-up only. Highest valued hour in the bucket.
        lowUsd:
          type: number
          nullable: true
          description: Rolled-up only. Lowest valued hour in the bucket.
        valuedHours:
          type: integer
          description: Rolled-up only. Hours in the bucket that carried a value.
    AumHistorySeries:
      type: object
      required:
      - handle
      - id
      - step
      - window
      - from
      - to
      - points
      - count
      - valued
      - latest
      - asOf
      - now
      properties:
        handle:
          type: string
          description: The trader's display handle.
        id:
          type: string
          nullable: true
          description: The trader's stable id.
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
        from:
          type: string
          format: date-time
          nullable: true
          description: The lower bound applied; `null` for `window=all` with no `from`.
        to:
          type: string
          format: date-time
          description: The upper bound applied.
        points:
          type: array
          description: Ascending, newest last; at most `limit` (the newest) points.
          items:
            $ref: '#/components/schemas/AumHistoryPoint'
        count:
          type: integer
          description: Points returned.
        valued:
          type: integer
          description: Points whose `totalUsd` is not `null`.
        latest:
          nullable: true
          description: The newest valued point, or `null` when none in range.
          type: object
          required:
          - at
          - totalUsd
          properties:
            at:
              type: string
              format: date-time
            totalUsd:
              type: number
        asOf:
          type: string
          format: date-time
          nullable: true
          description: When this trader's history was last built; `null` when never.
        now:
          description: The live figure from `aum_live`; `null` when the trader has none yet.
          anyOf:
          - $ref: '#/components/schemas/AumLiveNow'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
    AumLiveNow:
      type: object
      description: The trader's current value, refreshed when a watched wallet transacts (Solana push),
        when a balance slice reads the wallet, and when prices land. The hourly series' last point is
        refreshed with it. `totalUsd` is `null` when not valued (`reason` says why), never 0.
      required:
      - at
      - totalUsd
      - pricedPositions
      - totalPositions
      - reason
      - source
      - ageSeconds
      properties:
        at:
          type: string
          format: date-time
          description: When the figure was last refreshed.
        totalUsd:
          type: number
          nullable: true
          description: Value held in USD; `null` when not valued, never 0.
        pricedPositions:
          type: integer
        totalPositions:
          type: integer
        reason:
          type: string
          nullable: true
          enum:
          - no_holdings
          - no_prices
          - too_little_priced
          - price_suspect
          - null
          description: Why `totalUsd` is `null`; `null` when valued (`aumHistory.now.reason`).
        suspectUsd:
          type: number
          nullable: true
          description: Gross value of positions whose price failed the suspect rule, kept out of `totalUsd`;
            `null` when none (never 0).
        unsellableUsd:
          type: number
          nullable: true
          description: Gross value of honeypot / cannot-sell positions, kept out of `totalUsd`; `null`
            when none (never 0).
        source:
          type: string
          enum:
          - webhook
          - balances
          - prices
          - build
          description: What last refreshed the figure (`aumHistory.now.source`).
        ageSeconds:
          type: integer
          minimum: 0
          description: Whole seconds since `at`, at the time of the answer.
    AumNowResponse:
      type: object
      required:
      - handle
      - id
      - now
      - links
      properties:
        handle:
          type: string
          description: The trader's display handle.
        id:
          type: string
          nullable: true
          description: The trader's stable id.
        now:
          description: The live figure; `null` when the trader has none yet.
          anyOf:
          - $ref: '#/components/schemas/AumLiveNow'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        links:
          type: object
          required:
          - self
          - history
          - aum
          - trader
          properties:
            self:
              type: string
            history:
              type: string
            aum:
              type: string
            trader:
              type: string
    AumNowBatchTrader:
      type: object
      description: One entry per requested id, in the order sent. When `ok` is true the entry carries
        `handle`, `id` and `now`; when false only `error`.
      required:
      - ok
      - requested
      - handle
      properties:
        ok:
          type: boolean
        requested:
          type: string
          description: The id exactly as the caller sent it.
        handle:
          type: string
          nullable: true
          description: The resolved display handle; `null` when `ok` is false.
        id:
          type: string
          nullable: true
        now:
          description: The live figure; `null` when the trader has none yet.
          anyOf:
          - $ref: '#/components/schemas/AumLiveNow'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        error:
          allOf:
          - $ref: '#/components/schemas/FlowBatchTraderError'
          description: Only when `ok` is false.
    AumNowBatchRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Handles, display handles or `trd_` ids. Empty or absent is 400 `bad_request`; over
            50 is a 400 refusal; a duplicate (after resolution) is 400 `duplicate_identifier`.
          items:
            type: string
          example:
          - 0xAvast
          - trd_2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f
    AumNowBatchResponse:
      type: object
      required:
      - limit
      - asked
      - capped
      - asOf
      - traders
      properties:
        limit:
          type: integer
          enum:
          - 50
          description: The batch cap.
        asked:
          type: integer
          description: How many ids were sent; this call's rate-limit cost.
        capped:
          type: boolean
          description: Always `false` here — over the cap is refused with 400, never trimmed.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The newest `now.at` across the traders answered; `null` when none has a live figure.
        traders:
          type: array
          items:
            $ref: '#/components/schemas/AumNowBatchTrader'
    AumHistoryResponse:
      allOf:
      - $ref: '#/components/schemas/AumHistorySeries'
      - type: object
        required:
        - links
        properties:
          links:
            type: object
            required:
            - self
            - now
            - aum
            - trader
            properties:
              self:
                type: string
              now:
                type: string
              aum:
                type: string
              trader:
                type: string
    AumHistoryBatchRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
          description: Handles, display handles or `trd_` ids. Empty or absent is 400 `bad_request`; over
            50 is 400 `bad_request` (refused, not trimmed); a repeated id, or an id and its handle naming
            the same trader, is 400 `duplicate_identifier`.
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
          description: Defaults from `window`.
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
          default: 1w
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AumHistoryBatchTrader:
      type: object
      description: One entry per requested id, in the order sent. When `ok` is true the entry carries
        the whole `AumHistorySeries` shape; when false only `error`.
      required:
      - ok
      - requested
      - handle
      properties:
        ok:
          type: boolean
        requested:
          type: string
          description: The id exactly as the caller sent it.
        handle:
          type: string
          nullable: true
          description: The resolved display handle; `null` when `ok` is false.
        id:
          type: string
          nullable: true
        step:
          type: string
        window:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/AumHistoryPoint'
        count:
          type: integer
        valued:
          type: integer
        latest:
          nullable: true
          type: object
          properties:
            at:
              type: string
              format: date-time
            totalUsd:
              type: number
        asOf:
          type: string
          format: date-time
          nullable: true
        now:
          description: The live figure; `null` when the trader has none yet.
          anyOf:
          - $ref: '#/components/schemas/AumLiveNow'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        error:
          allOf:
          - $ref: '#/components/schemas/FlowBatchTraderError'
          description: Only when `ok` is false.
    AumHistoryBatchResponse:
      type: object
      required:
      - limit
      - asked
      - capped
      - asOf
      - step
      - window
      - from
      - to
      - traders
      properties:
        limit:
          type: integer
          enum:
          - 50
          description: The batch cap.
        asked:
          type: integer
          description: How many ids were sent; this call's rate-limit cost.
        capped:
          type: boolean
          description: Always `false` here — over the cap is refused with 400, never trimmed.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The newest build time across the traders answered; `null` when none has history.
        step:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
        traders:
          type: array
          items:
            $ref: '#/components/schemas/AumHistoryBatchTrader'
    MarketRule:
      type: object
      required:
      - closedBelow
      - cautionBelow
      - survivalDowngradeBelow
      properties:
        closedBelow:
          type: number
          enum:
          - 0.25
        cautionBelow:
          type: number
          enum:
          - 0.5
        survivalDowngradeBelow:
          type: number
          enum:
          - 0.1
        basis:
          type: string
    MarketLeaders:
      type: object
      required:
      - total
      - green7d
      - greenShare7d
      properties:
        total:
          type: integer
          description: Traders with at least one trade closed in the last 7 days.
        green7d:
          type: integer
          description: Of those, how many have `sum(realized_pnl_usd) > 0` over the week's closes.
        greenShare7d:
          type: number
          nullable: true
          description: '`green7d / total` to 4 dp; `null` when `total` is 0.'
        basis:
          type: string
    MarketLaunches:
      type: object
      required:
      - seen7d
      - graduated7d
      - survival7d
      - chains
      properties:
        seen7d:
          type: integer
          description: Solana tokens with `created_at` in the last 7 days (nightly launch metadata).
        graduated7d:
          type: integer
          description: Of those, how many completed the bonding curve.
        survival7d:
          type: number
          nullable: true
          description: '`graduated7d / seen7d` to 4 dp; `null` when `seen7d` is 0.'
        chains:
          type: array
          items:
            type: string
            enum:
            - solana
        basis:
          type: string
    MarketRotation:
      type: object
      required:
      - tokensMoved7d
      - topShare7d
      properties:
        tokensMoved7d:
          type: integer
          description: Distinct tokens with a transfer across tracked wallets in the last 7 days.
        topShare7d:
          type: number
          nullable: true
          description: Share of transfer count carried by the 10 most-moved tokens, 4 dp; `null` when
            nothing moved.
        basis:
          type: string
    MarketRegime:
      type: object
      required:
      - board
      - asOf
      - window
      - regime
      - rule
      - leaders
      - launches
      - rotation
      - plain
      - cachedForSeconds
      properties:
        board:
          type: string
          enum:
          - market
        asOf:
          type: string
          format: date-time
          description: When the reading was computed (served from a 60 s per-instance cache).
        window:
          type: string
          enum:
          - 7d
        regime:
          type: string
          nullable: true
          enum:
          - open
          - caution
          - closed
          - null
          description: '`null` when no tracked leader closed a trade in the window.'
        rule:
          $ref: '#/components/schemas/MarketRule'
        leaders:
          $ref: '#/components/schemas/MarketLeaders'
        launches:
          $ref: '#/components/schemas/MarketLaunches'
        rotation:
          $ref: '#/components/schemas/MarketRotation'
        plain:
          type: string
        cachedForSeconds:
          type: integer
          enum:
          - 60
    AumResponse:
      description: GET /v1/traders/{handle}/aum body — the envelope plus what this request did about freshness.
      allOf:
      - $ref: '#/components/schemas/AumEnvelope'
      - type: object
        required:
        - liveRead
        properties:
          liveRead:
            $ref: '#/components/schemas/AumLiveRead'
    AumEnvelope:
      type: object
      description: One trader's balance series. Built by the same code for the single and batch routes.
      required:
      - handle
      - chain
      - window
      - asOf
      - step
      - stepChosenFrom
      - stepMs
      - bucketMs
      - observedStepMs
      - stepUnderstated
      - from
      - to
      - trackedSince
      - now
      - count
      - reach
      - drawing
      - coverage
      - knownChains
      - status
      - sampler
      - progress
      - gaps
      - comparability
      - breaks
      - points
      - chains
      - refused
      - plain
      properties:
        handle:
          type: string
          description: The trader's display handle.
        chain:
          type: string
          nullable: true
          description: '`null` for the whole portfolio; a chain name when `chain` narrowed the series.'
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - all
          description: The canonical window served.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: When the newest reading was taken; null when there is none.
        step:
          type: string
          enum:
          - 1h
          - 6h
          - 1d
          description: The declared bucket.
        stepChosenFrom:
          type: string
          nullable: true
          enum:
          - window
          - tracked_span
          - fallback
          - null
          description: What decided `step`; `null` when the caller passed `step`.
        stepMs:
          type: integer
          description: '`step` in milliseconds.'
        bucketMs:
          type: integer
          description: The bucket the points were thinned into; may be finer than `step` after the fallback.
        observedStepMs:
          type: integer
          nullable: true
          description: Median spacing of the readings actually held, ms; null when fewer than two.
        stepUnderstated:
          type: boolean
          description: True when `step` understates the real spacing.
        from:
          type: string
          format: date-time
          nullable: true
          description: Window start; for `all`, the first point's time or null.
        to:
          type: string
          format: date-time
          description: The request time.
        trackedSince:
          type: string
          format: date-time
          nullable: true
          description: When real sampling began; everything before it is a marked rebuild. Null when sampling
            has not started.
        now:
          description: The newest reading; null when the sampler has never covered this trader.
          anyOf:
          - $ref: '#/components/schemas/AumNow'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        count:
          type: integer
          description: Points returned after thinning, not samples held.
        reach:
          $ref: '#/components/schemas/AumReach'
        drawing:
          $ref: '#/components/schemas/AumDrawing'
        coverage:
          $ref: '#/components/schemas/AumCoverage'
        knownChains:
          type: array
          items:
            $ref: '#/components/schemas/AumKnownChain'
          description: Every chain this trader uses; does not change with the window.
        status:
          type: string
          enum:
          - ready
          - warming
          - stale
          - no_reading
          description: '`ready` is what we have to offer; `warming` a backfill is filling; `stale` true
            but old (see `sampler`); `no_reading` nothing answered.'
        sampler:
          $ref: '#/components/schemas/AumSampler'
        progress:
          $ref: '#/components/schemas/AumProgress'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/AumGap'
          description: Refused readings inside the window, never smoothed over. Break the line at each.
        comparability:
          $ref: '#/components/schemas/AumComparability'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/AumBreak'
          description: Every seam between two valued points where what is counted changed.
        points:
          type: array
          items:
            $ref: '#/components/schemas/AumPoint'
          description: One entry per bucket, oldest first.
        chains:
          type: array
          items:
            $ref: '#/components/schemas/AumChain'
          description: Per-chain split of the NEWEST reading; `sum(chains[].totalUsd)` equals `now.totalUsd`.
        refused:
          type: string
          nullable: true
          enum:
          - too_little_priced
          - nothing_answered
          - chains_unrebuildable
          - no_prices
          - wallet_unreadable
          - service_timeout
          - price_rejected
          - price_suspect
          - no_tokens_known
          - null
          description: Non-null only when the newest reading was refused.
        plain:
          type: string
          description: The answer in a sentence.
    AumNow:
      type: object
      required:
      - at
      - totalUsd
      - partialUsd
      - ageSeconds
      - tier
      - partial
      - partialReason
      - chainsAnswered
      - chainsTotal
      - coverage
      properties:
        at:
          type: string
          format: date-time
        totalUsd:
          type: number
          nullable: true
          description: The newest figure; null when refused (`refused` names why), 0 only when every wallet
            answered and held nothing.
        partialUsd:
          type: number
          nullable: true
          description: What `totalUsd` would have been behind a refusal. Not a balance.
        ageSeconds:
          type: integer
          minimum: 0
          description: Age of this reading at request time.
        basis:
          type: string
          enum:
          - sampled
          - rebuilt
        tier:
          type: string
          enum:
          - verified
          - reported
        partial:
          type: boolean
          nullable: true
          description: True when the figure covers only part of the trader; null when nothing says either
            way.
        partialReason:
          type: string
          nullable: true
          enum:
          - chains_missing
          - unpriced_positions
          - chains_missing_and_unpriced_positions
          - null
        chainsAnswered:
          type: integer
          nullable: true
        chainsTotal:
          type: integer
          nullable: true
        coverage:
          $ref: '#/components/schemas/AumNowCoverage'
    AumNowCoverage:
      type: object
      required:
      - pricedPositions
      - totalPositions
      - pricedPositionShare
      - valueShare
      - chainsAnswered
      - chainsTotal
      properties:
        pricedPositions:
          type: integer
          nullable: true
        totalPositions:
          type: integer
          nullable: true
        pricedPositionShare:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: A COUNT ratio of priced to total positions, not a share of value.
        valueShare:
          type: number
          nullable: true
          deprecated: true
          description: Same value as `pricedPositionShare`; misnamed, kept for compatibility.
        chainsAnswered:
          type: integer
          nullable: true
        chainsTotal:
          type: integer
          nullable: true
    AumPointCoverage:
      allOf:
      - $ref: '#/components/schemas/AumNowCoverage'
      - type: object
        required:
        - partial
        - partialReason
        properties:
          partial:
            type: boolean
            nullable: true
            description: Incomplete by either route (a missing chain or unpriced positions); null when
              unknown.
          partialReason:
            type: string
            nullable: true
            enum:
            - chains_missing
            - unpriced_positions
            - chains_missing_and_unpriced_positions
    AumPoint:
      type: object
      required:
      - at
      - totalUsd
      - partialUsd
      - tier
      - coverage
      - chains
      - comparableWithPrevious
      properties:
        at:
          type: string
          format: date-time
        totalUsd:
          type: number
          nullable: true
          description: Null when refused; `refused` is then present.
        partialUsd:
          type: number
          nullable: true
          description: The figure behind a refusal. Not a balance.
        basis:
          type: string
          enum:
          - sampled
          - rebuilt
        reliability:
          type: string
          enum:
          - low
          description: 'Present only on `basis: rebuilt` points.'
        tier:
          type: string
          enum:
          - verified
          - reported
        coverage:
          $ref: '#/components/schemas/AumPointCoverage'
        refused:
          type: string
          enum:
          - too_little_priced
          - nothing_answered
          - chains_unrebuildable
          - no_prices
          - wallet_unreadable
          - service_timeout
          - price_rejected
          - price_suspect
          - no_tokens_known
          description: Present only when this reading was refused.
        outsideWindow:
          type: boolean
          description: Present (`true`) on a real reading borrowed from before the window as a baseline
            anchor.
        chains:
          type: array
          items:
            type: string
          description: The chains this point put a number on, sorted. Empty when no split is held.
        comparableWithPrevious:
          type: boolean
          nullable: true
          description: False when this and the previous figure count different things; null on the first
            point or a refused one.
    AumReach:
      type: object
      required:
      - requestedFrom
      - coveredFrom
      - coveredTo
      - requestedDays
      - coveredDays
      - anchorPoints
      - complete
      properties:
        requestedFrom:
          type: string
          format: date-time
          nullable: true
        coveredFrom:
          type: string
          format: date-time
          nullable: true
          description: First in-window point.
        coveredTo:
          type: string
          format: date-time
          nullable: true
        requestedDays:
          type: number
          nullable: true
          description: Null for `all`.
        coveredDays:
          type: number
        anchorPoints:
          type: integer
          description: Readings borrowed from before the window.
        complete:
          type: boolean
          description: True when the data reaches back to the window start.
    AumDrawing:
      type: object
      description: The service's own answer to "can this be drawn". Do not infer it from counts.
      required:
      - drawable
      - usablePoints
      - reason
      - partialPoints
      properties:
        drawable:
          type: boolean
        usablePoints:
          type: integer
          description: Points with a figure.
        reason:
          type: string
          nullable: true
          enum:
          - too_few_points
          - nothing_answered
          - warming
          - short_coverage
          - rebuilt_only
          - too_little_priced
          - chains_unrebuildable
          - no_prices
          - wallet_unreadable
          - service_timeout
          - price_rejected
          - price_suspect
          - no_tokens_known
          - null
          description: Why not drawable; the newest refusal word is used when it explains the shortfall.
            Null when drawable.
        partialPoints:
          type: integer
          description: Points whose figure was refused but carry `partialUsd`.
    AumCoverage:
      type: object
      description: Coverage of the newest point, in wallets and chains.
      required:
      - answeredWallets
      - totalWallets
      - answeredChains
      - totalChains
      properties:
        answeredWallets:
          type: integer
        totalWallets:
          type: integer
        answeredChains:
          type: integer
        totalChains:
          type: integer
    AumKnownChain:
      type: object
      required:
      - chain
      - networkId
      - wallets
      - hasPositions
      - historyState
      properties:
        chain:
          type: string
        networkId:
          type: integer
        wallets:
          type: integer
          enum:
          - 0
          - 1
          description: 1 when the address family that reaches this chain is on record.
        hasPositions:
          type: boolean
        historyState:
          type: string
          enum:
          - ready
          - warming
          - none
    AumSampler:
      type: object
      required:
      - state
      - lastAttemptAt
      - lastSuccessAt
      - ageSeconds
      - nextExpectedAt
      - staleAfterHours
      - reason
      - pipelineLastSuccessAt
      - pipelineAgeSeconds
      properties:
        state:
          type: string
          enum:
          - current
          - stale
          - warming
          - never_read
          description: This trader's state, not the pipeline's.
        lastAttemptAt:
          type: string
          nullable: true
          description: Always null today.
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          description: When this trader was last measured.
        ageSeconds:
          type: integer
          nullable: true
        nextExpectedAt:
          type: string
          format: date-time
          description: Next nightly slot (06:00 UTC).
        staleAfterHours:
          type: integer
          description: Always 36.
        reason:
          type: string
          nullable: true
        pipelineLastSuccessAt:
          type: string
          format: date-time
          nullable: true
          description: The sampler's own clock; fresh beside a stale `state` means it ran but did not
            reach this trader.
        pipelineAgeSeconds:
          type: integer
          nullable: true
    AumProgress:
      type: object
      required:
      - coveredDays
      - targetDays
      - historyStartsAt
      - boundedBy
      - nextRunAt
      - warming
      properties:
        coveredDays:
          type: number
        targetDays:
          type: number
        historyStartsAt:
          type: string
          format: date-time
          nullable: true
        boundedBy:
          type: string
          enum:
          - window
          - history
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: Only while `warming`.
        warming:
          type: boolean
    AumGap:
      type: object
      required:
      - at
      - from
      - to
      - reason
      properties:
        at:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: The next reading's moment, or this one's when last.
        reason:
          type: string
          enum:
          - too_little_priced
          - nothing_answered
          - chains_unrebuildable
          - no_prices
          - wallet_unreadable
          - service_timeout
          - price_rejected
          - price_suspect
          - no_tokens_known
    AumComparability:
      type: object
      required:
      - equalised
      - reason
      - detail
      properties:
        equalised:
          type: boolean
          description: Always false today.
        reason:
          type: string
          enum:
          - coverage_differs_by_method
        detail:
          type: string
    AumBreak:
      type: object
      required:
      - at
      - previousAt
      - reason
      - chainsAdded
      - chainsRemoved
      - pricedShareBefore
      - pricedShareAfter
      properties:
        at:
          type: string
          format: date-time
        previousAt:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - chains_changed
          - method_changed
          - priced_share_changed
          - method_and_chains_changed
          - method_and_priced_share_changed
          - chains_and_priced_share_changed
          - method_and_chains_and_priced_share_changed
        chainsAdded:
          type: array
          items:
            type: string
        chainsRemoved:
          type: array
          items:
            type: string
        pricedShareBefore:
          type: number
          nullable: true
        pricedShareAfter:
          type: number
          nullable: true
    AumChain:
      type: object
      description: One chain's share of the newest reading.
      required:
      - chain
      - networkId
      - totalUsd
      - pricedPositionShare
      - pricedShare
      - nativeSymbol
      - nativeUsd
      - nativePriceSource
      - nativeAmount
      - whyNoNative
      properties:
        chain:
          type: string
        networkId:
          type: integer
        totalUsd:
          type: number
          nullable: true
          description: Null with `reason` when the chain could not be priced.
        pricedPositionShare:
          type: number
          nullable: true
          description: A count ratio.
        pricedShare:
          type: number
          nullable: true
          deprecated: true
          description: Same as `pricedPositionShare`.
        nativeSymbol:
          type: string
          nullable: true
        nativeUsd:
          type: number
          nullable: true
        nativePriceSource:
          type: string
          nullable: true
        nativeAmount:
          type: number
          nullable: true
          description: '`totalUsd / nativeUsd`; null, never 0, without a native price.'
        whyNoNative:
          type: string
          nullable: true
        reason:
          type: string
          enum:
          - no_prices
          - wallet_unreadable
          - service_timeout
          - no_tokens_known
          - price_suspect
          description: Present only when this chain could not be priced.
    AumLiveRead:
      type: object
      description: What the single route did about freshness before answering.
      required:
      - state
      - freshnessFloorMinutes
      - waitedMs
      properties:
        state:
          type: string
          enum:
          - fetched
          - still_running
          - not_needed
          - skipped
          - unavailable
          description: '`fetched` a live sample landed in time; `still_running` the wait expired and the
            stored reading is served; `not_needed` fresh enough; `skipped` `live=false`; `unavailable`
            no sampler configured.'
        freshnessFloorMinutes:
          type: number
          description: '`AUM_LIVE_AFTER_MINUTES`, default 5.'
        waitedMs:
          type: integer
          nullable: true
          description: '`AUM_LIVE_WAIT_MS` when a live read was attempted, else null.'
    AumBatchLiveRead:
      type: object
      required:
      - state
      - note
      properties:
        state:
          type: string
          enum:
          - skipped
        note:
          type: string
          example: batch never reads live; use GET /v1/traders/:handle/aum
    AumBatchRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
          description: Handles, display handles, uuids or `trd_<uuid>` ids. Coerced to strings. Duplicates
            (after resolution too) are 400 `duplicate_identifier`; more than 50 is 400.
        window:
          type: string
          default: 1w
          enum:
          - 1d
          - 1w
          - 1m
          - all
          - 24h
          - 1day
          - 7d
          - 1week
          - 7day
          - 30d
          - 1month
          - 30day
          - 1mo
          - everything
          - lifetime
          - max
          description: Same words and aliases as the GET route. Must be a string.
        step:
          type: string
          enum:
          - 1h
          - 6h
          - 1d
          description: Case-insensitive. A non-string is treated as absent.
        chain:
          type: string
          description: One chain name, validated against the `chains` table. Must be a string.
        live:
          description: Accepted and ignored; the batch never reads live.
        contractVersion:
          type: integer
          enum:
          - 1
          - 2
          default: 2
          description: '`1` selects the legacy projection; anything else (or absent) the full v2 envelope.'
    AumBatchResponse:
      type: object
      description: contractVersion 2. Exactly one row per requested id, in order.
      required:
      - contractVersion
      - limit
      - asked
      - capped
      - asOf
      - window
      - chain
      - unreadableRows
      - traders
      properties:
        contractVersion:
          type: integer
          enum:
          - 2
        limit:
          type: integer
          enum:
          - 50
          description: The batch cap.
        asked:
          type: integer
          minimum: 1
          maximum: 50
          description: Ids sent; also the cost in `x-cost-units`.
        capped:
          type: boolean
          enum:
          - false
          description: Always false; over the cap is a refusal.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest reading anywhere in the batch.
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - all
        chain:
          type: string
          nullable: true
        unreadableRows:
          type: array
          items:
            $ref: '#/components/schemas/AumBatchUnreadableRow'
        traders:
          type: array
          items:
            $ref: '#/components/schemas/AumBatchRow'
    AumBatchRow:
      type: object
      required:
      - ok
      - requested
      - id
      - handle
      properties:
        ok:
          type: boolean
        requested:
          type: string
          description: The id exactly as sent.
        id:
          type: string
          format: uuid
          nullable: true
        handle:
          type: string
          nullable: true
        aum:
          description: Present when `ok` is true. The envelope with the batch `liveRead`.
          allOf:
          - $ref: '#/components/schemas/AumEnvelope'
          - type: object
            required:
            - liveRead
            properties:
              liveRead:
                $ref: '#/components/schemas/AumBatchLiveRead'
        error:
          allOf:
          - $ref: '#/components/schemas/AumBatchRowError'
          description: Present when `ok` is false.
    AumBatchRowError:
      type: object
      required:
      - code
      - detail
      properties:
        code:
          type: string
          enum:
          - not_found
        detail:
          type: string
    AumBatchUnreadableRow:
      type: object
      required:
      - requested
      - error
      properties:
        requested:
          type: string
        error:
          $ref: '#/components/schemas/AumBatchRowError'
    AumBatchLegacyResponse:
      type: object
      description: contractVersion 1 projection. `chain` appears only when one was named.
      required:
      - limit
      - asked
      - capped
      - asOf
      - window
      - traders
      properties:
        limit:
          type: integer
          enum:
          - 50
        asked:
          type: integer
        capped:
          type: boolean
          enum:
          - false
        asOf:
          type: string
          format: date-time
          nullable: true
        window:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - all
        chain:
          type: string
        traders:
          type: array
          items:
            $ref: '#/components/schemas/AumBatchLegacyTrader'
    AumBatchLegacyTrader:
      type: object
      required:
      - handle
      - liveRead
      - trackedSince
      - count
      - now
      - points
      properties:
        handle:
          type: string
          description: The resolved lower-case handle (not the display handle).
        liveRead:
          $ref: '#/components/schemas/AumBatchLiveRead'
        trackedSince:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
          description: 0 for an unknown trader (a coerced zero, see flags).
        now:
          type: object
          nullable: true
          required:
          - at
          - totalUsd
          - tier
          - coverage
          properties:
            at:
              type: string
              format: date-time
            totalUsd:
              type: number
              nullable: true
            tier:
              type: string
              enum:
              - verified
              - reported
            coverage:
              $ref: '#/components/schemas/AumNowCoverage'
        points:
          type: array
          items:
            $ref: '#/components/schemas/AumBatchLegacyPoint'
    AumBatchLegacyPoint:
      type: object
      required:
      - at
      - totalUsd
      properties:
        at:
          type: string
          format: date-time
        totalUsd:
          type: number
          nullable: true
        basis:
          type: string
          enum:
          - sampled
          - rebuilt
        refused:
          type: string
          enum:
          - too_little_priced
          - nothing_answered
          - chains_unrebuildable
          - no_prices
          - wallet_unreadable
          - service_timeout
          - price_rejected
          - price_suspect
          - no_tokens_known
    TokenBoardResponse:
      type: object
      required:
      - board
      - chain
      - asOf
      - traders
      - count
      - ranked
      - totalTokens
      - minHolders
      - excludedQuoteAssets
      - nextCursor
      - entries
      properties:
        board:
          type: string
          enum:
          - tokens
        chain:
          type: string
          description: The chain asked for, or `all`.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The holdings snapshot behind the figures.
        traders:
          type: integer
          description: Traders in the directory (the denominator of `holderShare`).
        count:
          type: integer
          description: Rows on this page.
        ranked:
          type: integer
          description: Rows on the whole board after filters.
        totalTokens:
          type: integer
          description: Every non-quote token, BEFORE `minHolders` trims it.
        minHolders:
          type: integer
        excludedQuoteAssets:
          type: object
          required:
          - tokens
          - positions
          properties:
            tokens:
              type: integer
            positions:
              type: integer
        nextCursor:
          type: string
          nullable: true
          description: Feed back as `cursor`; null on the last page.
        filters:
          allOf:
          - $ref: '#/components/schemas/TokenBoardFilters'
          description: Present only when a range filter was sent; carries just the ones sent.
        filtersNote:
          type: string
          description: Present with a market-cap or liquidity filter.
        orderBy:
          type: string
          enum:
          - holders
          - value
          - priced
          - marketCap
          - liquidity
          - chainHolders
          - smartWallets
          - renownedWallets
          description: Present only when `orderBy` or `direction` was sent.
        direction:
          type: string
          enum:
          - asc
          - desc
          description: Present only when `orderBy` or `direction` was sent.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TokenBoardEntry'
    TokenBoardFilters:
      type: object
