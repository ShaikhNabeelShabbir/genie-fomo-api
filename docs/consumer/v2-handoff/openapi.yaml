        carry the candle (`usd` is the close). A missing figure is `null`, never 0.
      required:
      - at
      - usd
      properties:
        at:
          type: string
          format: date-time
          description: Start of the bucket (the sampled hour for `1h`; UTC day, ISO week (Monday) or calendar
            month otherwise).
        usd:
          type: number
          nullable: true
          description: The hour's sample (`1h`), or the bucket's close (last sampled hour).
        openUsd:
          type: number
          nullable: true
          description: First sampled hour in the bucket. Absent on `1h`.
        highUsd:
          type: number
          nullable: true
          description: Absent on `1h`.
        lowUsd:
          type: number
          nullable: true
          description: Absent on `1h`.
        hours:
          type: integer
          nullable: true
          description: Hourly samples the bucket holds; a partial bucket has fewer than 24 / 168 / ~720.
            Absent on `1h`.
        liquidityUsd:
          type: number
          nullable: true
          description: DexScreener liquidity at that hour. Only on `1h`; `null` when the source gave none.
