      - meanExitUsd
      - medianExitUsd
      - clearsSpecBar
      properties:
        exits:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        meanToMedian:
          type: number
          nullable: true
        meanExitUsd:
          type: number
          nullable: true
        medianExitUsd:
          type: number
          nullable: true
        clearsSpecBar:
          type: boolean
          description: At least 20 resolved exits.
        basis:
          type: string
    ScorecardMoneyLeg:
      type: object
      required:
      - usd
      - coverage
      properties:
        usd:
          type: number
          nullable: true
          description: Null when no position carries the leg's price and quantity.
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
    ScorecardReturnPct:
      type: object
      required:
      - value
      - coverage
      properties:
        value:
          type: number
          nullable: true
          description: Closed P&L over recovered cost basis, in percent.
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
    ScorecardTypicalBet:
      type: object
      required:
      - value
      - method
      - coverage
      - perCoinUsd
      properties:
        value:
          type: number
          nullable: true
        method:
          type: string
          nullable: true
          enum:
          - entry_price
          - volume_per_trade
          - null
          description: Per-position median when at least 5 sized entries cover a third of the record,
            else lifetime volume per trade.
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
        perCoinUsd:
          type: number
          nullable: true
          description: Median of `byToken[].betUsd`; the composite floor.
    ScorecardRecent:
