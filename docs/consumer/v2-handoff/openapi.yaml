  /v1/traders/{handle}/aum:
    get:
      operationId: getTraderAum
      tags:
      - AUM
      summary: Balance history for one trader
      description: "One trader's assets-under-management series over a window, thinned into step buckets,\n\
        with the newest reading (`now`), a per-chain split of that reading (`chains`), and the\nservice's\
        \ own verdict on whether the series can be drawn (`drawing`).\n\nRules the consumer must respect:\n\
        * `null` means absent, `0` means measured zero. `now.totalUsd: null` is a refused reading and\n\
        \  `refused` names why; it is never a drawdown.\n* Priced floor (`PRICED_FLOOR = 0.25`, a COUNT\
        \ share, applied at read time): a reading that\n  priced fewer than a quarter of its positions\
        \ AND totals under `PARTIAL_SERVE_FLOOR_USD = 100`\n  is refused `too_little_priced`; the figure\
        \ survives as `partialUsd`. A larger figure is served\n  with `partial: true`, `partialReason:\
        \ unpriced_positions`.\n* `points[].basis`: `sampled` was read from the chain at that moment (`tier:\
        \ verified`);\n  `rebuilt` was inferred afterwards from transfers (`tier: reported`, `reliability:\
        \ low`).\n  Rebuilt points never draw alone (`drawing.reason: rebuilt_only`). Break the line at\
        \ every\n  `breaks[]` entry and at every `gaps[]` entry; `comparability` says why.\n* Live read:\
        \ unless `live=false`, when a live sampler is configured (`AUM_SAMPLE_URL` +\n  `AUM_SAMPLE_SECRET`)\
        \ and the newest sampled reading is older than `AUM_LIVE_AFTER_MINUTES`\n  (default 5), or `live=true`,\
        \ the route triggers a fresh sample and waits at most\n  `AUM_LIVE_WAIT_MS` (default 3000 ms).\
        \ `liveRead.state` reports what happened. A failed live\n  read is logged, never surfaced: the\
        \ stored reading is served.\n* Windows and steps are case-insensitive. The default step is the\
        \ coarsest that leaves\n  >= 24 buckets over the shorter of the window and the tracked span; `stepChosenFrom`\
        \ says which\n  decided, and it falls back to `1h` when a daily bucket would fold the record into\
        \ one point.\n* Handle resolution: `trd_<uuid>`, a bare uuid, the handle, the display handle (any\
        \ case) or\n  `@handle` all resolve to the same trader.\n* Costs 1 unit (`x-cost-units: 1`).\n"
      parameters:
      - name: handle
        in: path
        required: true
        description: Trader handle, display handle, `@handle`, uuid or `trd_<uuid>`.
        schema:
          type: string
          example: '397397'
      - name: window
        in: query
        required: false
        description: 'How far back the series reaches. Canonical words `1d`, `1w`, `1m`, `all`; aliases
          accepted

          in any case: `24h`, `1day` (=1d); `7d`, `1week`, `7day` (=1w); `30d`, `1month`, `30day`,

          `1mo` (=1m); `everything`, `lifetime`, `max` (=all). Anything else is 400 `bad_request`

          with `parameter: window`. The response echoes the canonical word.

          '
        schema:
          type: string
          default: 1w
          enum:
          - 1d
          - 1w
          - 1m
          - all
          - 24h
          - 1day
          - 7d
          - 1week
          - 7day
          - 30d
          - 1month
          - 30day
          - 1mo
          - everything
          - lifetime
          - max
      - name: step
        in: query
        required: false
        description: 'Bucket size. Omit to let the service choose (see `stepChosenFrom`). Case-insensitive.

          Any other word is 400 `bad_request` with `parameter: step`.

          '
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 1d
      - name: chain
        in: query
        required: false
        description: 'Narrow the series to one chain. Lower-cased and validated against the `chains` table

          (today: `ethereum`, `solana`, `bsc`, `base`, `robinhood`); an unknown name is 400

          `bad_request` with `parameter: chain` and the detail lists the valid names. Empty = whole portfolio.

          '
        schema:
          type: string
          example: solana
      - name: live
        in: query
        required: false
        description: '`true` forces a live sample; `false` skips the freshness check (`liveRead.state:
          skipped`).

          Omitted: a live read happens only when the stored reading is older than the freshness

          floor. Any other value is treated as omitted (not validated).

          '
        schema:
          type: boolean
