      summary: Holdings, concentration and per-chain totals for one trader
      description: Answers "how much does this trader hold, and how concentrated is it?" from the `holdings_current`
        snapshot. `totalValueUsd` and `topPosition` exclude honeypot / unsellable coins (their priced
        value is reported apart in `unsellableUsd`); `byChain[].valueUsd` does not. `null` means absent
