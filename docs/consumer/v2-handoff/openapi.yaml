  /v1/traders/aum/now:
    post:
      operationId: batchTraderAumNow
      tags:
      - AUM
      summary: The live value of up to 50 traders
      description: 'The batch form of `GET /v1/traders/{handle}/aum/now`. Takes up to 50 ids (handles,
        display handles or `trd_` ids) and answers one `traders[]` entry per requested id in the order
        sent: `ok: true` with `handle`, `id` and `now` (`null` when the trader has no live figure yet),
        or `ok: false` with a `not_found` error object for an id the directory does not hold. Over 50
        ids is a 400 refusal, never a silent trim, and a duplicate id is a 400 `duplicate_identifier`.
        One SQL read serves every id. The envelope''s `asOf` is the newest `now.at` across the traders
        answered, `null` when none has one. The response''s `x-cost-units` header equals `asked`.'
      requestBody:
        required: true
        description: Must be JSON; a body that does not parse answers 400 `bad_request` ("body must be
          JSON").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AumNowBatchRequest'
            example:
              ids:
              - 0xAvast
              - trd_2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f
      responses:
        '200':
          description: One entry per requested id
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
            x-cost-units:
              description: How many rate-limit units this call cost — the number of ids asked for (at
                most 50).
              schema:
                type: integer
                minimum: 1
                maximum: 50
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AumNowBatchResponse'
              example:
                limit: 50
                asked: 2
                capped: false
                asOf: '2026-09-18T11:58:41.000Z'
                traders:
                - ok: true
                  requested: 0xAvast
                  handle: 0xAvast
                  id: 2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f
                  now:
                    at: '2026-09-18T11:58:41.000Z'
                    totalUsd: 4418902.15
                    pricedPositions: 198
                    totalPositions: 214
                    reason: null
                    source: webhook
                    ageSeconds: 79
                - ok: false
                  requested: trd_2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f
                  handle: null
                  error:
                    code: not_found
                    detail: no trader 'trd_2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f' in the directory
        '400':
          description: '`ids` missing, empty, over 50 or duplicated; body not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: 'body must be { "ids": [...] } with at least one id or handle'
                  requestId: req_5f1c9a3d2b7e4a10
                  parameter: ids
        '401':
          description: X-API-Key missing or wrong (only when the deployment sets GENIE_API_KEY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: invalid or missing X-API-Key
                  requestId: req_5f1c9a3d2b7e4a10
        '404':
          description: Never for a known route; an unknown id is reported inside `traders[]`, not as a
            404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  detail: no route for POST /v1/traders/aum/nows
                  requestId: req_5f1c9a3d2b7e4a10
        '429':
          description: Rate limit exceeded; `Retry-After` header is set
