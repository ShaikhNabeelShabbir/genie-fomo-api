  /v1/traders/{handle}/flow:
    get:
      operationId: getTraderFlow
      tags:
      - Flow
      summary: Net token flow for one trader since a moment (Solana)
      description: 'Signed transfers from the Solana webhook feed (`transactions`) since `since`, summed
        per token: `in`, `out`, `net`, transfer count and the first/last transfer time. Solana only; EVM
        has no real-time feed and is absent. `tokenAddress` is `null` when the mint is not yet in the
        directory (the feed stores a lowercased key and base58 is case-sensitive), so key on `tokenKey`.
        No category taxonomy: group by `tokenKey` yourself. Rows are ordered by `abs(net)` descending
        and are not paged.'
      parameters:
      - name: handle
        in: path
        required: true
        description: The trader's handle, display handle (case-insensitive), `@handle`, or stable id with
          or without the `trd_` prefix. Unknown answers 404 `not_found`.
        schema:
          type: string
        example: '397397'
      - name: since
        in: query
        required: true
        description: 'ISO-8601 lower bound on `block_time` (inclusive), normalised to UTC in the response.
          Absent or empty answers 400 ("''since'' is required"); unparseable answers 400 `bad_request`
          with `parameter: "since"`.'
