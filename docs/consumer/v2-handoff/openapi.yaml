  /v1/traders:
    get:
      operationId: listTraders
      tags:
      - Traders
      summary: The trader directory, ranked, searchable, filterable, pageable and bulk-includable
      description: 'Every listed trader with the leaderboard''s own reported figures. Delisted traders
        are

        excluded unless `includeDelisted=true`. Search (`q`) ranks exact > prefix > substring

        and outranks the chosen sort; `handle` is the final tiebreak on every sort so paging is

        stable. Range filters skip traders with no stats row and say how many under `filters`.

        `include=` inlines sub-resources from one set-based query each under `entries[].included`;

        a requested include that produced nothing for a non-empty page is a 503

        `include_unavailable`, never an empty block. `cursor` wins over `offset` when both are

        sent. `null` means absent, never zero. Without `limit` the whole visible set is returned.

        '
      parameters:
      - name: q
        in: query
        description: Case-insensitive search over display handle and name. A leading `@` is stripped.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size. Whole number ≥ 1; no upper bound is enforced. Absent = every visible row.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        description: Rows to skip after filtering. Ignored when `cursor` is sent.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: cursor
        in: query
        description: Opaque `nextCursor` from a previous page, unmodified. Malformed or no longer matching
          a row is a 400.
        schema:
          type: string
      - name: include
        in: query
        description: Comma-separated sub-resources to inline. Any other word is a 400 naming the valid
          set.
        schema:
          type: string
          example: pnl,wallets
        x-allowed-values:
        - pnl
        - scorecard
        - wallets
        - trust
      - name: includeDelisted
        in: query
        description: Only the literal `true` includes traders the source no longer carries.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: updatedSince
        in: query
        description: ISO-8601 instant. Returns traders refreshed after it PLUS every trader whose refresh
          time is unknown. Applied before paging. Unparseable is a 400.
        schema:
          type: string
          format: date-time
      - name: orderBy
        in: query
        description: Sort key. `rank` ascends by default; every other key descends by default.
        schema:
          type: string
          enum:
          - rank
          - pnl
          - volume
          - trades
          - followers
          - updated
          default: rank
      - name: direction
        in: query
        description: Overrides the key's default direction.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: minPnl
        in: query
        description: Keep traders whose reported pnl_usd ≥ this. Any finite number; non-numeric is a 400.
        schema:
          type: number
      - name: maxPnl
        in: query
        description: Keep traders whose reported pnl_usd ≤ this.
        schema:
          type: number
      - name: minVolume
        in: query
        description: Keep traders whose reported volume_usd ≥ this.
        schema:
          type: number
      - name: maxVolume
        in: query
        description: Keep traders whose reported volume_usd ≤ this.
        schema:
          type: number
      - name: minTrades
        in: query
        description: Keep traders whose reported trade_count ≥ this.
        schema:
          type: number
      - name: minFollowers
        in: query
        description: Keep traders whose reported followers ≥ this.
        schema:
          type: number
      responses:
        '200':
          description: The directory page.
          headers: *id007
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraderList'
              example:
                board: traders
                window: 7d
                capturedAt: '2026-09-17T06:04:12.000Z'
                capturedAtEpoch: 1789625052
                count: 1
                total: 448
                nextCursor: WyIzOTczOTciXQ
                entries:
                - rank: 12
                  id: a06e3ef7-425a-48e9-a131-220a4dcea4cc
                  updatedAt: '2026-09-17T06:04:12.000Z'
                  lastSeenAt: '2026-09-17T06:04:12.000Z'
                  handle: '397397'
                  label: '397'
                  avatarUrl: https://fomoapi.io/avatars/397397.png
                  source: fomoapi.io
                  pnl: 1785254.2
                  volume: 9231000.55
                  followers: 1204
                  numTrades: 318
                  memberCount: null
                  marketCap: null
                  price: null
                  liquidity: null
        '400':
          description: 'A parameter was refused: non-integer `limit`/`offset`, unknown `include`, unparseable
            `updatedSince`, unknown `orderBy`, bad `direction`, non-numeric range filter, or a malformed
            / stale `cursor`.'
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                include:
                  value:
                    error:
                      code: bad_request
                      detail: unknown include 'positions'
                      requestId: req_3f9c2a1b7d4e8f01
                      valid:
                      - pnl
                      - scorecard
                      - wallets
                      - trust
                limit:
                  value:
                    error:
                      code: bad_request
                      detail: '''limit'' must be a whole number — got ''abc'''
                      requestId: req_3f9c2a1b7d4e8f01
                      parameter: limit
                cursor:
                  value:
                    error:
                      code: bad_request
                      detail: cursor no longer matches any row — the list changed since it was issued;
                        restart without a cursor
                      requestId: req_3f9c2a1b7d4e8f01
                      parameter: cursor
        '401': *id008
        '404': *id012
        '429': *id009
        '500': *id010
        '503':
          description: '`include_unavailable` when a requested include produced nothing for a non-empty
            page (retry, do not read it as ''there is none''); otherwise `timeout` / `unavailable` as
            on every route.'
          headers:
            x-request-id: *id002
            RateLimit-Limit: *id003
            RateLimit-Remaining: *id004
            RateLimit-Reset: *id005
            RateLimit-Scope: *id006
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                includeUnavailable:
                  value:
                    error:
                      code: include_unavailable
                      detail: asked for wallets but could not produce it — retry rather than treating
                        this as "there is none"
                      requestId: req_3f9c2a1b7d4e8f01
                      retryAfterSeconds: 5
                      blocks:
                      - wallets
                timeout:
                  value:
                    error:
                      code: timeout
                      detail: this route did not answer within 15s — retry
                      requestId: req_3f9c2a1b7d4e8f01
                      retryAfterSeconds: 5
  /v1/traders/aum:
    post:
      operationId: batchTraderAum
      tags:
      - AUM
      summary: Balance history for up to 50 traders in one call
      description: 'The batch form of `GET /v1/traders/{handle}/aum`, built by the same `aumFor()` so
        the two

        cannot disagree about a window, a step or a chain series. Never reads live: every row carries

        `liveRead: { state: skipped, note }`.


        Batch envelope: `limit` (always 50), `asked` (ids sent), `capped` (always `false`: over the cap

        is a 400, never a trim), `asOf` (the newest reading anywhere in the batch, null when none).

        Cost: `x-cost-units` = `asked`, capped at `BATCH_MAX_COST = 50`.


        Ids may be handles, display handles or `trd_<uuid>`/uuid ids. Duplicates, including a handle and

        its id spelled twice, are 400 `duplicate_identifier`. Exactly one row comes back per requested

        id, in order; an id that does not resolve is an explicit `ok: false` row with

        `error.code: not_found` and is also listed under `unreadableRows`. The call is 200 even when

        every row is `ok: false`.


        `contractVersion`: omit (or send anything but `1`) for the full v2 envelope; `1` selects the

        legacy projection (`handle`, `count`, `now` with four fields, `points` with `at/totalUsd/basis/refused`).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AumBatchRequest'
            example:
              ids:
              - '397397'
              - trd_0b6f7d1e-4c2a-4e0b-9f4e-2a7b1c3d5e6f
              window: 1w
              step: 6h
              chain: solana
      responses:
        '200':
          description: One row per requested id.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
