          id as a UUID with or without the `trd_` prefix. Resolved in that order.
        schema:
          type: string
          example: '397397'
      - name: token
        in: query
        required: false
        description: A token key (lower-cased address / mint) to test against the portfolio. Trimmed and
          lower-cased; no shape check. When given, `includesToken` is added to the body.
