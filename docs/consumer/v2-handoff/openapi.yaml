  /v1/traders/{handle}/scorecard:
    get:
      operationId: getTraderScorecard
      tags:
      - Scorecard
      summary: One trader's full trading record, per window and per coin
      description: 'The deep-dive foundation: win rate, best/worst/median trade, money in and out, realised
        profit by day / month / window, fees, per-coin economics (`byToken[]`), the recent-vs-career composite
        (`recent`, `career`, `bleeding`), exit timing, and an on-chain fallback (`onChain`) drawn from
        the wallet''s own resolved swaps. Every stored position for the trader is used (no cap). A figure
        that cannot be computed is null, and `fieldReasons` names why with a vocabulary word; zero is
        only ever a measured zero. `staleness` says how old the fomo load is and, when stale, whether
        `onChain` can stand in. 404 when the trader is unknown OR has no stored trades.'
      parameters:
      - name: handle
