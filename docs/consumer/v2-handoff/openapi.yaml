        `presence: not_yet_scanned` distinguishes a wallet with no observed chain from an idle one.

        `chains` is observed, never inferred: a chain not seen is absent, not `tradesSeen: 0`.

        `knownChains` is the window-independent list of every chain the trader uses. `linked` is

        wallets funded from the known one (nightly), `[]` when none. `fingerprintMatches` is always

