        half the positions carry a price or when unsellable value was withheld; `partialReason` names
        which. With `?token=` the response also says whether that coin is inside the total (`includesToken`).
        `handle` accepts a directory handle, a display handle, `@handle`, or a stable id with or without
        the `trd_` prefix.
