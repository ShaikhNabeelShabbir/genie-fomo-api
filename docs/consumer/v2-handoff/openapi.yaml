  /v1/traders/{handle}/trades:
    get:
      operationId: getTraderTrades
      tags:
      - Transactions
      summary: The trader's own swaps, both sides, FIFO-paired
      description: 'One row per swap the wallet actually signed (`wallet_swaps`), with the coin leg and
        the money leg. `valueUsd` comes from the money side (`valueSource` says which arm priced it:
        `money_side_pegged`, `money_side_daily_close` or `money_side_market`), never from a
        memecoin price; `priceUsd` is only the implied cross-check. Each sell is paired to the oldest
        buy still holding quantity (FIFO over the trader''s whole record, not the page), giving `positionId`,
        `status`, `openedAt`, `closedAt`, `holdSeconds`; a sell with no matching buy carries `positionId:
        null` and `whyNoPosition`. Keyset-paged on `(block_time desc, tx_hash)`: follow `nextCursor` until
        `null`; `complete` is true on the last page. `?status=` filters AFTER paging, so a filtered page
        may have `count: 0` with a non-null `nextCursor` (`scanned` says how many rows the page held).
        `coverage` names which chains were resolved and which the trader trades on but we hold no swaps
        for. `feeUsd` is `null` whenever no fee row or no native price exists; zero is never substituted.'
      parameters:
      - name: handle
        in: path
        required: true
        description: The trader's handle, display handle (case-insensitive), `@handle`, or stable id with
          or without the `trd_` prefix. Unknown answers 404 `not_found`.
        schema:
          type: string
        example: '397397'
      - name: limit
        in: query
        required: false
        description: Page size. Non-integer or below 1 answers 400; above 500 is clamped to 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: chain
        in: query
        required: false
        description: 'Keep only swaps on this chain name (lowercased before matching). Not validated against
          the directory: an unknown name yields an empty page, not a 400.'
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: Keep swaps with `block_time >= since`. Passed to Postgres as a timestamptz; an unparseable
          value is a database error (500), not a 400.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        required: false
        description: Keep swaps with `block_time <= until`. Passed to Postgres as a timestamptz; an unparseable
          value is a database error (500), not a 400.
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        required: false
        description: 'Keep only rows whose FIFO pairing is in this state. Applied after paging. Any other
          word answers 400 `bad_request` with `parameter: "status"`.'
        schema:
          type: string
          enum:
          - open
          - closed
      - name: cursor
        in: query
        required: false
        description: 'Opaque keyset cursor from this route''s `nextCursor`, unmodified. A cursor that
          does not decode answers 400 `bad_request` with `parameter: "cursor"`.'
        schema:
          type: string
      responses:
        '200':
          description: The page of swaps
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesPage'
              example:
                handle: '397397'
                count: 1
                limit: 1
                capped: true
                asOf: '2026-09-09T04:32:10.000Z'
                trades:
                - chain: solana
                  networkId: 1399811149
                  txHash: 2Rzxy4RvkGf6KEz7aKYVA8gfzMJb5JzwFM5XAGQMkuRLiaTY1b64DS2WSshAp8NhEAZSuePSjVBNzrwM3gASfWzh
                  at: '2026-09-09T04:32:10.000Z'
