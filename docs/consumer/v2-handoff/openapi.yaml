openapi: 3.0.3
info:
  title: genie copy-trading API
  version: 1.0.0
  description: "A read API over ~450 crypto traders across Robinhood Chain, Ethereum, BSC, Base and Solana:\n\
    who they are, what they hold, what they have made, and what their balance has done over time.\n\n\
    Every route answers from Postgres; the request path makes no external call except the\n`/aum` live\
    \ read-through to the balance sampler. Rules every answer follows:\n\n* `null` means absent, zero\
    \ means zero. No string ever stands in for a missing number.\n* Coverage travels with the figure:\
    \ any partial number carries how much it was computed from.\n* A partial answer says it is partial\
    \ (`partial: true` with a `partialReason` word).\n* Every refusal is a machine word published by `GET\
    \ /v1/fields`; a consumer's build should\n  fail on a word it has not seen.\n* A unit never changes\
    \ under a stable name: `*At` is ISO-8601, `*Share` is 0–1, `*Usd` is dollars.\n\n**Versions.** The\
    \ same routes are served as `/v1/*` by the Supabase deployment and as `/v2/*`\nby the Cloudflare Worker.\
    \ Handlers are identical; only the links inside responses are spelled\nfor the requested version.\
    \ The Worker refuses `/v1/*` with 404.\n"
  contact:
    name: genie-fomo-api
    url: https://github.com/ShaikhNabeelShabbir/genie-fomo-api
  license:
    name: Proprietary
    url: https://github.com/ShaikhNabeelShabbir/genie-fomo-api
servers:
- url: https://gxnonqlmujmtgczvhvzp.supabase.co/functions/v1/api
  description: v1 — Supabase Edge Function (live)
- url: https://genie-copy-trading-api.<subdomain>.workers.dev
  description: v2 — Cloudflare Worker (routes under /v2/*; not yet deployed)
security:
- ApiKey: []
tags:
- name: Traders
  description: The directory, profiles, trust checks and wallet resolution
- name: Positions
  description: Portfolio and open positions, single and batch
- name: Scorecard
  description: Trading record and P&L
- name: Transactions
  description: Raw transfers and resolved swaps
- name: AUM
  description: Balance over time (sampled readings, rebuilt history, live reads)
- name: Events
  description: Keyset feed of transfers, swaps and readings
- name: Flow
  description: Solana net flow since a time
- name: Tokens
  description: Tokens the directory holds, holders, activity, momentum, creators
- name: Market
  description: Cohort-wide regime reading
- name: Reference
  description: Chains and the published vocabulary
- name: Health
  description: Feed freshness and capability status
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Required only when the deployment sets `GENIE_API_KEY`; otherwise any request is accepted.
        A wrong or missing key answers 401 `unauthorized`.

        '
  headers:
    RequestId:
      description: Per-request id, also echoed inside every error body as `error.requestId`.
      schema:
        type: string
        example: req_2ec7c488bdf0413a
    RateLimitLimit:
      description: Requests allowed per minute for this scope (default 240).
      schema:
        type: integer
        example: 240
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        example: 237
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
        example: 41
    RateLimitScope:
      description: '`global` when the Postgres-backed counter answered; `unlimited` when the limiter could
        not be reached and the request was allowed through (logged server-side).

        '
      schema:
        type: string
        enum:
        - global
        - unlimited
    RetryAfter:
      description: Seconds to wait before retrying (on 429 and 503).
      schema:
        type: integer
        example: 5
  schemas:
    Error:
      type: object
      description: 'Every non-2xx answer has this shape. `code` is a stable machine word; `detail` is
        a sentence for a person; `hint` (when present) says what to do instead. Driver or SQL text never
        reaches the caller.

        '
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - detail
          - requestId
          properties:
            code:
              type: string
              enum:
              - bad_request
              - duplicate_identifier
              - invalid_address
              - unauthorized
              - not_found
              - address_in_use
              - already_on_record
              - rate_limited
              - timeout
              - unavailable
              - include_unavailable
              - not_configured
              - internal_error
            detail:
              type: string
            requestId:
              type: string
              example: req_2ec7c488bdf0413a
            hint:
              type: string
              nullable: true
            blocks:
              type: array
              items:
                type: string
              description: On `include_unavailable` only — the `?include=` blocks that could not be produced.
            retryAfterSeconds:
              type: integer
              nullable: true
              description: 'On 429 and 503: the same figure as the Retry-After header.'
            parameter:
              type: string
              description: 'On 400: the query or body parameter the route could not use.'
            valid:
              type: array
              items:
                type: string
              description: 'On 400: the values the parameter accepts.'
            routes:
              type: array
              items:
                type: string
              description: 'On 404 for an unknown path: every route that exists.'
            heldBy:
              type: string
              description: 'On 409 address_in_use: the trader who already holds the address.'
            family:
              type: string
              enum:
              - evm
              - solana
              description: 'On 409: which address family clashed.'
            current:
              type: string
              description: 'On 409 already_on_record: the address already stored.'
          additionalProperties: true
      example:
        error:
          code: not_found
          detail: no route for GET /v1/nope
          requestId: req_2ec7c488bdf0413a
          hint: 'routes: GET /v1/traders, GET /v1/traders/:handle, …'
    TraderList:
      type: object
      required:
      - board
      - window
      - capturedAt
      - capturedAtEpoch
      - count
      - nextCursor
      - entries
      properties:
        board:
          type: string
          enum:
          - traders
        window:
          type: string
          nullable: true
          description: The leaderboard window label of the newest build (e.g. `7d`); null when no build
            exists.
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: When the newest directory build was captured. Per-trader freshness is `entries[].updatedAt`.
        capturedAtEpoch:
          type: integer
          nullable: true
          deprecated: true
          description: The same instant as epoch seconds. Read `capturedAt`.
        count:
          type: integer
          description: Rows in this page.
        include:
          type: array
          items:
            type: string
            enum:
            - pnl
            - scorecard
            - wallets
            - trust
          description: Present only when `include=` was sent; the de-duplicated list applied.
        includeNote:
          type: string
          description: Present with `include`; explains why sub-resources are nested under `included`.
        updatedSince:
          type: string
          format: date-time
          description: Present only when `updatedSince=` was sent; the normalised instant applied.
        matched:
          type: integer
          description: With `updatedSince`; rows that passed the freshness filter before paging.
        updatedSinceNote:
          type: string
          description: With `updatedSince`; explains that traders with unknown refresh time are always
            returned.
        total:
          type: integer
          description: Present only when the page is smaller than the visible set; the visible total.
        nextCursor:
          type: string
          nullable: true
          description: Feed back as `?cursor=` for the next page; null on the last page. Opaque; never
            build one by hand.
        filters:
          $ref: '#/components/schemas/TraderListFilters'
        orderBy:
          type: string
          enum:
          - rank
          - pnl
          - volume
          - trades
          - followers
          - updated
          description: Present only when `orderBy` or `direction` was sent.
        direction:
          type: string
          enum:
          - asc
          - desc
          description: Present only when `orderBy` or `direction` was sent.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TraderListEntry'
    TraderListFilters:
      type: object
      description: Present only when at least one range filter was sent.
      required:
      - applied
      - excludedForMissingValue
      - note
      properties:
        applied:
          type: object
          description: The filters that were applied, by parameter name.
          additionalProperties:
            type: number
        excludedForMissingValue:
          type: integer
          description: Traders with no stats row, which no range filter can evaluate and which are therefore
            absent — not the same as failing the filter.
        note:
          type: string
    TraderListEntry:
      type: object
      required:
      - rank
      - id
      - updatedAt
      - lastSeenAt
      - handle
      - label
      - avatarUrl
      - source
      - pnl
      - volume
      - followers
      - numTrades
      - memberCount
      - marketCap
      - price
      - liquidity
      properties:
        rank:
          type: integer
          nullable: true
          description: The leaderboard's own rank; null for a trader with no stats row.
        id:
          type: string
          description: Stable id, never reused. Key on it, show the handle. Opaque; today UUID-shaped.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: This trader's own last refresh; varies between entries.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the source directory last listed this trader.
        handle:
          type: string
          description: Display handle. Changes when the trader renames; key on `id`.
        label:
          type: string
          nullable: true
          description: The trader's name as the source shows it.
        avatarUrl:
          type: string
          nullable: true
          description: Avatar URL; null where the source gave nothing (an empty string is not a URL).
        source:
          type: string
          enum:
          - fomoapi.io
          - gmgn
          - null
          nullable: true
          description: Which directory this trader came from. The two fail in opposite directions (see
            PARAMETER_ROUTES §0d).
        pnl:
          type: number
          nullable: true
          description: fomo's REPORTED lifetime profit in USD, not ours. See /trust.
        volume:
          type: number
          nullable: true
          description: Reported lifetime volume in USD.
        followers:
          type: integer
          nullable: true
          description: Reported follower count.
        numTrades:
          type: integer
          nullable: true
          description: Reported trade count.
        memberCount:
          type: integer
          nullable: true
          description: Always null (kept for shape compatibility).
        marketCap:
          type: number
          nullable: true
          description: Always null (kept for shape compatibility).
        price:
          type: number
          nullable: true
          description: Always null (kept for shape compatibility).
        liquidity:
          type: number
          nullable: true
          description: Always null (kept for shape compatibility).
        included:
          $ref: '#/components/schemas/TraderIncluded'
    TraderIncluded:
      type: object
      description: Present only when `include=` was sent; one key per requested include. Nested, not spread,
        because `entries[].pnl` (reported) and `included.pnl` (computed) must not share a key.
      properties:
        pnl:
          type: object
          description: The same body as GET /v1/traders/{handle}/pnl, computed from stored trades (see
            that operation's schema).
          additionalProperties: true
        scorecard:
          type: object
          nullable: true
          description: The same body as GET /v1/traders/{handle}/scorecard with `byToken` empty (`tokensTotal`
            still reports the real count); null for a trader with no trade rows.
          additionalProperties: true
        wallets:
          description: The wallet block without `wallets[]`/`linked[]`/`presence`; null when the trader
            has no row.
          anyOf:
          - $ref: '#/components/schemas/TraderWalletsCore'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        trust:
          $ref: '#/components/schemas/TraderTrust'
    TraderProfile:
      type: object
      required:
      - id
      - handle
      - name
      - rank
      - verified
      - listed
      - source
      - updatedAt
      - asOf
      - bio
      - profilePicture
      - twitter
      - reported
      - wallets
      - onChain
      - stored
      - links
      properties:
        id:
          type: string
          description: Stable id, never reused.
        handle:
          type: string
          description: Display handle.
        name:
          type: string
          nullable: true
        rank:
          type: integer
          nullable: true
          description: Leaderboard rank; null without a stats row.
        verified:
          type: boolean
          description: The source's verified badge.
        listed:
          type: boolean
          description: Whether the trader is still on the board.
        delisted:
          $ref: '#/components/schemas/TraderProfileDelisted'
        source:
          type: string
          enum:
          - fomoapi.io
          - gmgn
          - null
          nullable: true
          description: Which directory this trader came from.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stats row was captured.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The same instant as `updatedAt`, under the name every other route uses.
        bio:
          type: string
          nullable: true
        profilePicture:
          type: string
          nullable: true
          description: Avatar URL; null where the source gave nothing.
        twitter:
          type: string
          nullable: true
        reported:
          $ref: '#/components/schemas/TraderProfileReported'
        wallets:
          $ref: '#/components/schemas/TraderProfileWallets'
        onChain:
          description: Counted from transfers we ingested; null when no wallet is on record.
          anyOf:
          - $ref: '#/components/schemas/TraderOnChain'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        stored:
          $ref: '#/components/schemas/TraderStored'
        links:
          $ref: '#/components/schemas/TraderLinks'
    TraderProfileDelisted:
      type: object
      description: Present only when `listed` is false.
      required:
      - at
      - reason
      - note
      properties:
        at:
          type: string
          format: date-time
          nullable: true
          description: When the trader dropped off the source.
        reason:
          type: string
          enum:
          - absent_from_source
          - null
          nullable: true
        note:
          type: string
    TraderProfileReported:
      type: object
      description: The leaderboard's own figures, straight through. See /trust before trusting them.
      required:
      - pnlUsd
      - volumeUsd
      - trades
      - followers
      properties:
        pnlUsd:
          type: number
          nullable: true
        volumeUsd:
          type: number
          nullable: true
        trades:
          type: integer
          nullable: true
        followers:
          type: integer
          nullable: true
    TraderProfileWallets:
      type: object
      required:
      - evm
      - solana
      properties:
        evm:
          type: string
          nullable: true
          description: The EVM address on record (one address serves every EVM chain).
        solana:
          type: string
          nullable: true
          description: The Solana address on record.
    TraderOnChain:
      type: object
      required:
      - transactions
      - chainsCovered
      - transfers
      - inbound
      - outbound
      - swaps
      - tokensTouched
      - activeDays
      - evenness
      - tradesPerActiveDay
      - firstSeenAt
      - lastActiveAt
      - tier
      - source
      - note
      properties:
        transactions:
          type: integer
          description: Distinct transaction hashes across the stored transfers.
        chainsCovered:
          type: array
          items:
            type: string
          description: Chains present in the stored transaction feed for these wallets; all-zero counts
            outside this list mean "not covered".
        transfers:
          type: integer
          description: Transfer rows (one transaction can carry several).
        inbound:
          type: integer
        outbound:
          type: integer
        swaps:
          type: integer
          description: Transfers typed SWAP.
        tokensTouched:
          type: integer
          description: Distinct tokens across the transfers.
        activeDays:
          type: integer
          description: Distinct calendar days with at least one transfer.
        evenness:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: '1 − Gini over trades-per-active-day: 1.0 = the same number every day, toward 0
            = a burst. null under two active days.'
        tradesPerActiveDay:
          type: number
          nullable: true
          description: Mean transfers per active day, 2 dp; null with no active day.
        dailyTrades:
          type: array
          items:
            $ref: '#/components/schemas/TraderDailyTrade'
          description: Present only with `?dailyTrades=true`; the series `evenness` came from, one row
            per active day, unbounded.
        dailyTradesAvailable:
          type: integer
          description: Present without `?dailyTrades=true`; how many `dailyTrades` rows exist.
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest stored transfer; a floor for wallets older than ingestion.
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: Newest stored transfer.
        tier:
          type: string
          enum:
          - verified
        source:
          type: string
          description: Always `d1 · transactions (helius webhook)`.
        note:
          type: string
    TraderDailyTrade:
      type: object
      required:
      - day
      - trades
      properties:
        day:
          type: string
          format: date
          description: Calendar date, YYYY-MM-DD.
        trades:
          type: integer
    TraderStored:
      type: object
      description: What this database holds for the trader.
      required:
      - positions
      - trades
      - transfers
      properties:
        positions:
          type: integer
          description: Rows in the current holdings snapshot.
        trades:
          type: integer
          description: Trade records on file.
        transfers:
          type: integer
          description: Stored transfers for the wallets on record.
    TraderLinks:
      type: object
      description: Every sub-route for this trader, as paths under the requested API version.
      required:
      - pnl
      - scorecard
      - portfolio
      - positions
      - trust
      - wallets
      - transactions
      - events
      properties:
        pnl:
          type: string
        scorecard:
          type: string
        portfolio:
          type: string
        positions:
          type: string
        trust:
          type: string
        wallets:
          type: string
        transactions:
          type: string
        events:
          type: string
    TraderTrust:
      type: object
      required:
      - handle
      - name
      - checks
      - blacklist
      - asOf
      - reportedPnlUsd
      - volumeUsd
      - flags
      - pnlToVolume
      - pnlToHoldings
      - trades
      - verdict
      - plain
      properties:
        handle:
          type: string
        name:
          type: string
          nullable: true
        checks:
          $ref: '#/components/schemas/TraderTrustChecks'
        blacklist:
          $ref: '#/components/schemas/TraderTrustBlacklist'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: 'The holdings snapshot the ratios are derived from: this trader''s own row, else
            the board-wide snapshot; null only when neither exists.'
        reportedPnlUsd:
          type: number
          nullable: true
          description: fomo's reported profit.
        volumeUsd:
          type: number
          nullable: true
          description: fomo's reported volume.
        flags:
          type: array
          items:
            $ref: '#/components/schemas/TraderTrustFlag'
        pnlToVolume:
          type: number
          nullable: true
          description: reportedPnlUsd / volumeUsd, 2 dp; null when either is absent or volume is 0. Both
            sides are reported.
        pnlToHoldings:
          type: number
          nullable: true
          description: reportedPnlUsd / our sum of priced positions, 2 dp; null when pnl is absent or
            nothing is priced.
        trades:
          type: integer
          nullable: true
          description: Reported trade count.
        verdict:
          type: string
          enum:
          - self_contradictory
          - unverified
          - unverifiable
          - insufficient
          - ok
          description: '`self_contradictory`: fomo''s own profit and volume disagree. `unverified`: profit
            far exceeds a portfolio we CAN see. `unverifiable`: too little is priced to say. `insufficient`:
            under 10 trades. `ok`: nothing contradicts. Describes the numbers, not the trader.'
        basis:
          $ref: '#/components/schemas/TraderTrustBasis'
        plain:
          type: string
    TraderTrustChecks:
      type: object
      description: What was looked at, so an absent flag cannot be read as a clean bill of health.
      required:
      - performed
      - blacklist
      - externalReputation
      properties:
        performed:
          type: array
          items:
            type: string
            enum:
            - pnl_exceeds_volume
            - pnl_exceeds_holdings
            - holdings_coverage_too_low
            - too_few_trades
            - partial_pricing
        basis:
          type: string
        blacklist:
          $ref: '#/components/schemas/TraderTrustBlacklist'
        externalReputation:
          type: object
          required:
          - checked
          - sources
          properties:
            checked:
              type: boolean
              description: Always false.
            sources:
              type: array
              items:
                type: string
              description: Always empty.
    TraderTrustBlacklist:
      type: object
      description: 'Always `checked: false`. `listed` is null (not checked), never false (checked and
        clear).'
      required:
      - checked
      - lists
      - listed
      - checkedAt
      - why
      properties:
        checked:
          type: boolean
        lists:
          type: array
          items:
            type: string
        listed:
          type: boolean
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
        why:
          type: string
    TraderTrustFlag:
      type: object
      required:
      - code
      - severity
      - plain
      properties:
        code:
          type: string
          enum:
          - pnl_exceeds_volume
          - pnl_exceeds_holdings
          - holdings_coverage_too_low
          - too_few_trades
          - partial_pricing
        severity:
          type: string
          enum:
          - warn
          - info
        plain:
          type: string
    TraderTrustBasis:
      type: object
      description: What each denominator was, so the verdict can be weighed rather than taken.
      required:
      - pnlToVolume
      - pnlToHoldings
      properties:
        pnlToVolume:
          type: object
          required:
          - numerator
          - denominator
          - bothReported
          properties:
            numerator:
              type: string
            denominator:
              type: string
            bothReported:
              type: boolean
        pnlToHoldings:
          type: object
          required:
          - numerator
          - denominator
          - pricedPositions
          - totalPositions
          - pricedShare
          properties:
            numerator:
              type: string
            denominator:
              type: string
            pricedPositions:
              type: integer
            totalPositions:
              type: integer
            pricedShare:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
              description: Count share of priced positions, 4 dp; null with no positions.
    TraderWalletsCore:
      type: object
      description: The wallet block shared by GET /wallets and `?include=wallets`.
      required:
      - handle
      - name
      - bio
      - banner
      - profilePicture
      - twitter
      - solanaAddress
      - evmAddress
      - source
      - walletState
      - tier
      - confidence
      - resolvedBy
      - fingerprintMatches
      - knownChains
      properties:
        handle:
          type: string
        name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
          description: Always null.
        profilePicture:
          type: string
          nullable: true
        twitter:
          type: string
          nullable: true
        solanaAddress:
          type: string
          nullable: true
          description: Base58 Solana address; null when absent or malformed on file.
        evmAddress:
          type: string
          nullable: true
          description: 0x + 40 hex; null when absent or malformed on file.
        source:
          type: string
          nullable: true
          description: 'In `included.wallets`: the wallet resolution source (`fomoapi.io`, `gmgn`, `submitted`).
            On GET /wallets this key is overridden by the trader''s directory source.'
        walletState:
          type: string
          enum:
          - on_record
          - unresolved_upstream
          description: '`unresolved_upstream`: the source itself carries no address, as opposed to us
            never having looked.'
        tier:
          type: string
          enum:
          - verified
          - reported
          description: '`verified` only once a confidence column is set.'
        confidence:
          type: object
          required:
          - evm
          - solana
          properties:
            evm:
              type: string
              nullable: true
            solana:
              type: string
              nullable: true
        resolvedBy:
          type: object
          description: How each address was found. null = no address of that family.
          required:
          - evm
          - solana
          properties:
            evm:
              type: string
              enum:
              - fomoapi
              - gmgn
              - submitted
              - null
              nullable: true
            solana:
              type: string
              enum:
              - fomoapi
              - gmgn
              - submitted
              - null
              nullable: true
        fingerprintMatches:
          type: integer
          nullable: true
          description: Always null; no fingerprint count is stored.
        warning:
          type: string
          description: Present only when a stored address was malformed and withheld.
        knownChains:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraderKnownChain'
          description: Every chain this trader uses, window-independent. `[]` when none is recorded.
    TraderKnownChain:
      type: object
      required:
      - chain
      - networkId
      - wallets
      - hasPositions
      - historyState
      properties:
        chain:
          type: string
        networkId:
          type: integer
        wallets:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the address family that reaches this chain is on record, 0 when the chain
            is evidenced but the address is not.
        hasPositions:
          type: boolean
        historyState:
          type: string
          enum:
          - ready
          - warming
          - none
          description: '`none`: a chain we know he uses with no balance history at all.'
    TraderWallets:
      allOf:
      - $ref: '#/components/schemas/TraderWalletsCore'
      - type: object
        required:
        - id
        - source
        - asOf
        - handleChangedAt
        - wallets
        - linked
        - presence
        properties:
          id:
            type: string
            nullable: true
            description: Stable id.
          source:
            type: string
            enum:
            - fomoapi.io
            - gmgn
            nullable: true
            description: Which directory the trader came from (overrides the core `source`).
          asOf:
            type: string
            format: date-time
            nullable: true
            description: When the wallet record was last confirmed.
          handleChangedAt:
            type: string
            format: date-time
            nullable: true
            description: When the display handle last changed.
          wallets:
            type: array
            items:
              $ref: '#/components/schemas/TraderWalletEntry'
            description: '`[]` for a trader with no address on record — a valid answer, not an error.'
          linked:
            type: array
            items:
              $ref: '#/components/schemas/TraderLinkedWallet'
          presence:
            type: string
            enum:
            - observed
            - not_yet_scanned
            description: '`not_yet_scanned` when wallets exist but none has an observed chain.'
    TraderWalletEntry:
      type: object
      required:
      - address
      - family
      - source
      - chains
      properties:
        address:
          type: string
        family:
          type: string
          enum:
          - solana
          - evm
          description: How to talk to the address; never a chain.
        source:
          type: string
          nullable: true
          description: The wallet resolution source word.
        chains:
          type: array
          items:
            $ref: '#/components/schemas/TraderWalletChainPresence'
          description: Observed, never inferred; an unseen chain is absent.
    TraderWalletChainPresence:
      type: object
      required:
      - chain
      - networkId
      - tradesSeen
      - lastActiveAt
      properties:
        chain:
          type: string
        networkId:
          type: integer
        tradesSeen:
          type: integer
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
    TraderLinkedWallet:
      type: object
      required:
      - chain
      - address
      - linkedFrom
      - kind
      - firstSeenAt
      - evidenceTx
      - watch
      properties:
        chain:
          type: string
        address:
          type: string
          description: Case-preserved spelling when resolved, else the key.
        linkedFrom:
          type: string
          description: The known wallet key it was funded from.
        kind:
          type: string
          enum:
          - funded_by
          - submitted
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        evidenceTx:
          type: string
          nullable: true
          description: The funding signature.
        watch:
          type: boolean
          description: Registered with the Helius webhook alongside the primary wallet.
    WalletSubmissionRequest:
      type: object
      required:
      - secret
      description: At least one of `evmAddress` / `solanaAddress` is required (400 otherwise). Non-string
        address fields are treated as absent. Values are trimmed.
      properties:
        secret:
          type: string
          description: Must equal WALLET_SUBMIT_SECRET; compared as a string.
        evmAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: 20-byte hex address.
        solanaAddress:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          description: Base58 Solana address.
    WalletSubmission:
      type: object
      required:
      - handle
      - accepted
      - onRecord
      - pricing
      - tier
      - plain
      properties:
        handle:
          type: string
        accepted:
          type: object
          description: Exactly what this request stored (null for a family not sent).
          required:
          - evmAddress
          - solanaAddress
          properties:
            evmAddress:
              type: string
              nullable: true
            solanaAddress:
              type: string
              nullable: true
        onRecord:
          $ref: '#/components/schemas/WalletSubmissionOnRecord'
        pricing:
          $ref: '#/components/schemas/WalletSubmissionPricing'
        tier:
          type: string
          enum:
          - reported
        plain:
          type: string
    WalletSubmissionOnRecord:
      type: object
      description: The wallet row after the write; pre-existing addresses are never overwritten.
      required:
      - evmAddress
      - solanaAddress
      - evmSource
      - solanaSource
      - evmConfidence
      - solanaConfidence
      properties:
        evmAddress:
          type: string
          nullable: true
        solanaAddress:
          type: string
          nullable: true
        evmSource:
          type: string
          nullable: true
          description: '`submitted` for a submitted address; the loader''s word otherwise.'
        solanaSource:
          type: string
          nullable: true
        evmConfidence:
          type: string
          nullable: true
          description: '`reported` for a submitted address.'
        solanaConfidence:
          type: string
          nullable: true
    WalletSubmissionPricing:
      type: object
      required:
      - state
      - readsOn
      - note
      properties:
        state:
          type: string
          enum:
          - pending_first_read
        readsOn:
          type: string
          description: The /aum path that forces a live read now.
        note:
          type: string
    ChainsList:
      type: object
      required:
      - board
      - asOf
      - vocabulary
      - traders
      - totalPositions
      - count
      - unattributedRealized
      - plain
      - entries
      properties:
        board:
          type: string
          enum:
          - chains
        asOf:
          type: string
          format: date-time
          nullable: true
          description: The holdings snapshot time.
        vocabulary:
          $ref: '#/components/schemas/ChainsVocabulary'
        traders:
          type: integer
          description: Every trader in the database (listed and delisted).
        totalPositions:
          type: integer
          description: Rows in the current holdings snapshot.
        count:
          type: integer
          description: Number of entries.
        unattributedRealized:
          description: Closed trades whose chain could not be established; null when there are none.
          anyOf:
          - $ref: '#/components/schemas/ChainsUnattributedRealized'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        plain:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChainsEntry'
    ChainsVocabulary:
      type: object
      description: The closed chain vocabulary; use `words` verbatim in `?chain=`.
      required:
      - closed
      - version
      - words
      - note
      properties:
        closed:
          type: boolean
        version:
          type: integer
        words:
          type: array
          items:
            type: string
        note:
          type: string
    ChainsUnattributedRealized:
      type: object
      required:
      - closedTrades
      - pnlUsd
      - note
      properties:
        closedTrades:
          type: integer
        pnlUsd:
          type: number
          nullable: true
        note:
          type: string
    ChainsEntry:
      type: object
      required:
      - networkId
      - chain
      - traders
      - traderShare
      - positions
      - tokens
      - totalValueUsd
      - coverage
      - plain
      - realized
      - historyCoverage
      - balanceVerifiable
      properties:
        networkId:
          type: integer
        chain:
          type: string
          description: The vocabulary word.
        traders:
          type: integer
          description: Distinct traders holding a position on this chain (C1).
        traderShare:
          type: number
          minimum: 0
          maximum: 1
          description: traders / all traders, 4 dp.
        positions:
          type: integer
        tokens:
          type: integer
          description: Distinct tokens excluding quote assets.
        totalValueUsd:
          type: number
          nullable: true
          description: Sum of priced positions (C2); null when nothing on the chain is priced.
        coverage:
          $ref: '#/components/schemas/ChainsCoverage'
        plain:
          type: string
          description: Leads with the caveat when under half the positions are priced.
        realized:
          $ref: '#/components/schemas/ChainsRealized'
        historyCoverage:
          $ref: '#/components/schemas/ChainsHistoryCoverage'
        balanceVerifiable:
          type: boolean
          description: Always true; a position size is checkable on every chain (C5).
    ChainsCoverage:
      type: object
      required:
      - pricedPositions
      - unpricedPositions
      - pricedShare
      properties:
        pricedPositions:
          type: integer
        unpricedPositions:
          type: integer
        pricedShare:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: A COUNT ratio, 4 dp; null with no positions.
    ChainsRealized:
      type: object
      description: Realized profit from fomo's REPORTED trade records (C3), independent of price coverage.
      required:
      - closedTrades
      - pnlUsd
      - tier
      - source
      - note
      properties:
        closedTrades:
          type: integer
          description: 0 when no trade on record names this chain.
        pnlUsd:
          type: number
          nullable: true
          description: null when no trade on record names this chain.
        basis:
          type: string
        tier:
          type: string
          enum:
          - reported
        source:
          type: string
        note:
          type: string
    ChainsHistoryCoverage:
      type: object
      description: Whether transaction history is readable on this chain and through what (C4).
      required:
      - available
      - via
      - note
      properties:
        available:
          type: boolean
        via:
          type: string
          nullable: true
          description: The history provider name (e.g. `helius`, `blockscout`); null when none.
        note:
          type: string
          nullable: true
          description: '`keyless` for blockscout; null otherwise.'
    FieldsVocabulary:
      type: object
      required:
      - board
      - asOf
      - traders
      - vocabulary
      - units
      - constants
      - fillRates
      - plain
      properties:
        board:
          type: string
          enum:
          - fields
        asOf:
          type: string
          format: date-time
          description: Now; the rates are counted live on every call.
        traders:
          type: integer
          description: Every trader in the database; the denominator of every fill rate.
        vocabulary:
          $ref: '#/components/schemas/FieldsVocabularyWords'
        units:
          $ref: '#/components/schemas/FieldsUnits'
        constants:
          $ref: '#/components/schemas/FieldsConstants'
        fillRates:
          type: object
          description: How much of the directory carries each named field, keyed by a human field label.
          additionalProperties:
            $ref: '#/components/schemas/FieldsFillRate'
        plain:
          type: string
    FieldsVocabularyWords:
      type: object
      description: The published word list (shared/vocabulary.ts). Every enumerated field's complete set,
        keyed by dotted field path (e.g. `aum.status`, `wallets.walletState`, `health.dataState`, `error.code`).
      required:
      - closed
      - version
      - fields
      properties:
        closed:
          type: boolean
          description: Always true; a word not listed is not one the API emits.
        version:
          type: integer
          description: Bumped on every addition (7 as of 17 Sep 2026).
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    FieldsUnits:
      type: object
      description: The unit of every quantity, by name suffix; keys are suffix patterns such as `*Usd`,
        `*Share`, `*Pct`, `*Ms`, `*Seconds`, `*Hours`, `*Days`, `*At / *From / *To / *Since`, `day`, `month`,
        `winRate`, `pricedPositionShare`, `coverage{of,total,share}` and `note`.
      additionalProperties:
        type: string
    FieldsConstants:
      type: object
      description: The thresholds the /aum rules apply, published so a refusal can be explained.
      required:
      - pricedFloor
      - partialServeFloorUsd
      - drawableMinPoints
      properties:
        pricedFloor:
          type: number
          description: Count share of priced positions below which a reading is partial or refused (0.25).
        partialServeFloorUsd:
          type: number
          description: A figure below the count floor is served as partial at or above this; refused below
            (100).
        drawableMinPoints:
          type: integer
          description: Dated figures needed before an /aum series is drawable (2).
    FieldsFillRate:
      type: object
      required:
      - of
      - total
      - commonestAbsence
      properties:
        of:
          type: integer
          description: Traders carrying the field.
        total:
          type: integer
          description: All traders.
        share:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: of / total, 4 dp; null only when the directory is empty.
        commonestAbsence:
          type: string
          nullable: true
          description: The usual reason the field is null.
    HealthReport:
      type: object
      required:
      - status
      - apiVersion
      - cached
      - cacheAgeSeconds
      - runtime
      - source
      - build
      - feeds
      - dataState
      - staleFeeds
      - staleTraders
      - measurements
      - rows
      - delistedTraders
      - estimatedRows
      - externalCallsPerRequest
      - capabilities
      properties:
        status:
          type: string
          enum:
          - ok
          description: Liveness; always `ok` when the service answers.
        apiVersion:
          type: string
          enum:
          - v1
          - v2
          description: '`v1` = Supabase, `v2` = the Cloudflare Worker.'
        cached:
          type: boolean
          description: Whether this body came from the 30 s per-isolate cache.
        cacheAgeSeconds:
          type: integer
          minimum: 0
          description: Age of the cached body; 0 when computed for this call.
        runtime:
          type: string
          enum:
          - supabase edge function (deno)
          - cloudflare worker
        source:
          type: string
          enum:
          - postgres
          - cloudflare d1
        build:
          $ref: '#/components/schemas/HealthBuild'
        feeds:
          $ref: '#/components/schemas/HealthFeeds'
        dataState:
          type: string
          enum:
          - current
          - degraded
          description: '`degraded` when any feed is not current or any scorecard is stale.'
        staleFeeds:
          type: array
          items:
            type: string
            enum:
            - traders
            - trades
            - wallets
            - positions
            - transactions
            - tokenInfo
            - aum
            - scorecards
            - swaps
          description: Sorted names of feeds that stopped; empty is healthy.
        staleTraders:
          $ref: '#/components/schemas/HealthStaleTraders'
        measurements:
          $ref: '#/components/schemas/HealthMeasurements'
        rows:
          $ref: '#/components/schemas/HealthRows'
        delistedTraders:
          $ref: '#/components/schemas/HealthDelistedTraders'
        estimatedRows:
          type: array
          items:
            type: string
          description: Which `rows` entries are planner estimates (`transactions`).
        externalCallsPerRequest:
          $ref: '#/components/schemas/HealthExternalCalls'
        capabilities:
          $ref: '#/components/schemas/HealthCapabilities'
    HealthBuild:
      type: object
      required:
      - capturedAt
      - window
      properties:
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: The newest directory build; null when none.
        window:
          type: string
          nullable: true
    HealthFeeds:
      type: object
      required:
      - traders
      - trades
      - wallets
      - positions
      - transactions
      - tokenInfo
      - aum
      - swaps
      properties:
        traders:
          $ref: '#/components/schemas/HealthFeed'
        trades:
          allOf:
          - $ref: '#/components/schemas/HealthFeed'
          description: fomoapi trade records, load time (`captured_at`). Not the on-chain swaps; see `swaps`.
        swaps:
          allOf:
          - $ref: '#/components/schemas/HealthFeed'
          description: On-chain swaps resolved from the wallets' transactions (`wallet_swaps`, what `/trades`
            and `/events?kind=swap` read), newest block time; stale after 6 h.
        wallets:
          $ref: '#/components/schemas/HealthFeed'
        positions:
          $ref: '#/components/schemas/HealthFeed'
        transactions:
          $ref: '#/components/schemas/HealthFeed'
        tokenInfo:
          $ref: '#/components/schemas/HealthFeed'
        aum:
          $ref: '#/components/schemas/HealthAumFeed'
    HealthFeed:
      type: object
      required:
      - lastRefreshAt
      - rowCount
      - ageSeconds
      - staleAfterHours
      - state
      properties:
        lastRefreshAt:
          type: string
          format: date-time
          nullable: true
          description: When the feed's job last wrote; null when it never has.
        rowCount:
          type: integer
          nullable: true
          description: null on every feed except `aum`.
        ageSeconds:
          type: integer
          nullable: true
          description: Seconds since `lastRefreshAt`; null when never.
        staleAfterHours:
          type: integer
          description: 'This feed''s own allowance: traders/wallets/positions/transactions 36, trades
            72, tokenInfo 336, swaps 6.'
        state:
          type: string
          enum:
          - current
          - stale
          - never
          description: '`never` is not `stale`: different cause, different fix.'
        description:
          type: string
          description: What the clock measures, on the feeds whose name alone is ambiguous (`trades`, `swaps`).
    HealthAumFeed:
      allOf:
      - $ref: '#/components/schemas/HealthFeed'
      - type: object
        required:
        - traders
        - newestReadingAt
        - samplerLastRunAt
        - historyState
        - chains
        properties:
          traders:
            type: integer
            description: Distinct traders with any sample row.
          newestReadingAt:
            type: string
            format: date-time
            nullable: true
            description: The newest reading's own time, accepted or not. `lastRefreshAt` is the newest
              ACCEPTED reading and drives `state`.
          samplerLastRunAt:
            type: string
            format: date-time
            nullable: true
            description: When the sampler last wrote anything.
          historyState:
            $ref: '#/components/schemas/HealthHistoryState'
          chains:
            type: object
            description: Per-chain sampler health, keyed by chain name.
            additionalProperties:
              $ref: '#/components/schemas/HealthAumChain'
    HealthAumChain:
      type: object
      required:
      - accepted36h
      - failed24h
      - newestAcceptedAt
      - historyState
      properties:
        accepted36h:
          type: integer
          description: Chain sample rows carrying a figure in the last 36 h.
        failed24h:
          type: integer
          description: Chain sample rows carrying a reason in the last 24 h.
        newestAcceptedAt:
          type: string
          format: date-time
          nullable: true
        historyState:
          $ref: '#/components/schemas/HealthHistoryState'
    HealthHistoryState:
      type: object
      description: Counts of trader-chains by `knownChains[].historyState`.
      required:
      - ready
      - warming
      - none
      properties:
        ready:
          type: integer
        warming:
          type: integer
        none:
          type: integer
    HealthStaleTraders:
      type: object
      description: Per-trader staleness over LISTED traders, which no feed clock can express.
      required:
      - readingStale
      - readingStaleAfterHours
      - noReading
      - oldestReadingHours
      - scorecardStale
      - scorecardStaleGmgn
      - scorecardStaleAfterHours
      - scorecardLoadFailed
      - scorecardNeverAttempted
      - oldestScorecardHours
      - of
      properties:
        readingStale:
          type: integer
          description: Traders whose newest accepted reading is past 36 h.
        readingStaleAfterHours:
          type: integer
          enum:
          - 36
        noReading:
          type: integer
          description: Traders with no accepted reading at all (refused readings do not count).
        oldestReadingHours:
          type: integer
          nullable: true
          description: null when no trader has a reading.
        scorecardStale:
          type: integer
          description: fomoapi.io traders whose newest trade snapshot (`trades.captured_at`) is past 72
            h - the set the six-hourly loader targets.
        scorecardStaleGmgn:
          type: integer
          description: The same for traders the fomoapi loader does not own (source gmgn); the nightly
            gmgn job refreshes them.
        scorecardStaleAfterHours:
          type: integer
          enum:
          - 72
        scorecardLoadFailed:
          type: integer
          description: Of the stale, how many the loader's last attempt did not bring back (`loadOutcome`
            other than `loaded`); a never-attempted trader counts.
        scorecardNeverAttempted:
          type: integer
          description: Of the stale, how many have no `trade_loads` row at all - a subset of `scorecardLoadFailed`.
        oldestScorecardHours:
          type: integer
          nullable: true
        of:
          type: integer
          description: Listed traders.
    HealthMeasurements:
      type: object
      required:
      - traders
      - withClosedTrades
      properties:
        traders:
          type: integer
          description: Every trader in the database.
        withClosedTrades:
          type: integer
          description: Traders with at least one closed trade (a usable rhythm figure).
        share:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
    HealthRows:
      type: object
      description: Row counts; `transactions` is a planner estimate.
      required:
      - traders
      - delisted
      - holdings
      - tokens
      - trades
      - transactions
      - wallets
      - generations
      properties:
        traders:
          type: integer
          description: LISTED traders.
        delisted:
          type: integer
        holdings:
          type: integer
        tokens:
          type: integer
        trades:
          type: integer
        transactions:
          type: integer
          description: Estimated from pg_class.reltuples.
        wallets:
          type: integer
          description: Distinct traders with a wallet row.
        generations:
          type: integer
          description: Distinct holdings capture times.
    HealthDelistedTraders:
      type: object
      required:
      - count
      - reason
      - note
      properties:
        count:
          type: integer
        reason:
          type: string
          enum:
          - absent_from_source
        note:
          type: string
    HealthExternalCalls:
      type: object
      required:
      - typical
      - max
      - note
      - liveAum
      properties:
        typical:
          type: integer
          enum:
          - 0
        max:
          type: integer
          enum:
          - 1
        note:
          type: string
        liveAum:
          type: object
          required:
          - enabled
          - freshnessFloorMinutes
          properties:
            enabled:
              type: boolean
              description: Whether AUM_SAMPLE_URL and AUM_SAMPLE_SECRET are both set.
            freshnessFloorMinutes:
              type: number
              description: AUM_LIVE_AFTER_MINUTES (default 5).
    HealthCapabilities:
      type: object
      required:
      - degraded
      - providers
      properties:
        degraded:
          type: array
          items:
            type: string
          description: Names of capabilities whose feeds all stopped; empty is healthy.
        providers:
          type: array
          items:
            $ref: '#/components/schemas/HealthProvider'
        basis:
          type: string
    HealthProvider:
      type: object
      required:
      - name
      - state
      - supplies
      - staleFeeds
      - keyInThisProcess
      properties:
        name:
          type: string
        state:
          type: string
          enum:
          - current
          - stale
          - never
          description: '`current` if any supplied feed is current; `never` only if all are.'
        supplies:
          type: array
          items:
            type: string
            enum:
            - traders
            - trades
            - wallets
            - positions
            - transactions
            - tokenInfo
            - aum
        staleFeeds:
          type: array
          items:
            type: string
        keyInThisProcess:
          type: boolean
          description: Presence (never the value) of the provider key in this process; normally false
            and not a fault.
    CreatorLedger:
      type: object
      required:
      - creator
      - asOf
      - ledger
      - tokens
      - tier
      - source
      properties:
        creator:
          type: string
          description: The address as requested (not normalised).
        asOf:
          type: string
          format: date-time
          nullable: true
          description: When the nightly ledger last rebuilt this creator.
        ledger:
          description: null when the ledger row carries no launch count.
          anyOf:
          - $ref: '#/components/schemas/CreatorLedgerSummary'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/CreatorToken'
          description: Ordered by market cap descending, nulls last.
        tier:
          type: string
          enum:
          - third_party
        source:
          type: string
          enum:
          - gmgn
    CreatorLedgerSummary:
      type: object
      required:
      - launches
      - bestPeakMcapUsd
      - bestToken
      - stillHoldingCount
      - soldCount
      - honeypotCount
      - lastLaunchAt
      properties:
        launches:
          type: integer
          description: Tokens a tracked leader holds from this creator, not everything ever minted.
        bestPeakMcapUsd:
          type: number
          nullable: true
        bestToken:
          type: string
          nullable: true
          description: An address key (lower-cased).
        stillHoldingCount:
          type: integer
        soldCount:
          type: integer
        honeypotCount:
          type: integer
        lastLaunchAt:
          type: string
          format: date-time
          nullable: true
          description: When we first saw the newest launch, not the mint time.
    CreatorToken:
      type: object
      required:
      - chain
      - tokenAddress
      - symbol
      - status
      - isHoneypot
      - marketCapUsd
      properties:
        chain:
          type: string
        tokenAddress:
          type: string
        symbol:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - creator_hold
          - creator_close
          - null
          nullable: true
          description: GMGN's word; null when it was silent.
        isHoneypot:
          type: boolean
          nullable: true
          description: null when no security read exists.
        marketCapUsd:
          type: number
          nullable: true
    MoneyCoverage:
      type: object
      description: How much of a denominator the figure beside it rests on. `share` is `of / total` to
        4 dp, null when `total` is 0.
      required:
      - of
      - total
      properties:
        of:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        share:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
    PortfolioResponse:
      type: object
      required:
      - handle
      - name
      - asOf
      - positions
      - concentration
      - topPosition
      - totalValueUsd
      - cashShare
      - coverage
      - byChain
      - partial
      - partialReason
      - unsellableUsd
      - plain
      properties:
        handle:
          type: string
          description: The trader's display handle.
        name:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest `captured_at` across the trader's holdings rows; the measurement time of
            every money figure. Null with no rows.
        positions:
          type: integer
          minimum: 0
          description: Rows held, priced or not.
        concentration:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Top sellable position's share of `totalValueUsd` (4 dp). Null when nothing sellable
            is priced.
        topPosition:
          anyOf:
          - $ref: '#/components/schemas/PortfolioTopPosition'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        totalValueUsd:
          type: number
          nullable: true
          description: Sum of priced, sellable holdings. Null when nothing sellable carries a price -
            never 0 for "could not value".
        cashShare:
          type: number
          nullable: true
          minimum: 0
          description: Priced quote-asset value divided by `totalValueUsd`. Null when there is no total.
        coverage:
          $ref: '#/components/schemas/PortfolioCoverage'
        byChain:
          type: array
          description: One entry per chain the trader holds on, most positions first.
          items:
            $ref: '#/components/schemas/PortfolioChain'
        includesToken:
          allOf:
          - $ref: '#/components/schemas/PortfolioIncludesToken'
          description: Present only when `?token=` was given.
        partial:
          type: boolean
          description: True when fewer than half the positions are priced, or unsellable value was withheld
            from the total.
        partialReason:
          type: string
          nullable: true
          enum:
          - unsellable_positions
          - unpriced_positions
          - null
          description: Which condition made it partial; `unsellable_positions` wins when both hold.
        unsellableUsd:
          type: number
          minimum: 0
          description: Priced value in honeypot / sell-blocked coins, kept OUT of `totalValueUsd`. Zero
            when none.
        plain:
          type: string
          description: The one-sentence reading of the numbers, caveat first when most positions are unpriced.
    PortfolioTopPosition:
      type: object
      required:
      - tokenAddress
      - networkId
      - valueUsd
      properties:
        tokenAddress:
          type: string
        networkId:
          type: integer
        valueUsd:
          type: number
          nullable: true
    PortfolioCoverage:
      type: object
      required:
      - pricedPositions
      - unpricedPositions
      - pricedShare
      properties:
        pricedPositions:
          type: integer
          minimum: 0
          description: Rows with `value > 0`.
        unpricedPositions:
          type: integer
          minimum: 0
        pricedShare:
          type: number
          nullable: true
          description: A COUNT share (`pricedPositions / positions`, 4 dp), not a value share. Null with
            no positions.
    PortfolioChain:
      type: object
      required:
      - chain
      - networkId
      - positions
      - priced
      - valueUsd
      - nativeSymbol
      - nativeUsd
      - nativePriceSource
      - nativeAmount
      - whyNoNative
      properties:
        chain:
          type: string
          example: solana
        networkId:
          type: integer
        positions:
          type: integer
          minimum: 0
        priced:
          type: integer
          minimum: 0
        valueUsd:
          type: number
          nullable: true
          description: This chain's priced dollars, unsellable coins INCLUDED (a chain's dollars are what
            sits on it). Null when nothing on the chain is priced.
        nativeSymbol:
          type: string
          nullable: true
          description: The chain's own coin.
        nativeUsd:
          type: number
          nullable: true
          description: Current price of that coin; null when no market price is held.
        nativePriceSource:
          type: string
          nullable: true
          description: Where `nativeUsd` came from, naming the chain it was borrowed from when it was.
        nativeAmount:
          type: number
          nullable: true
          description: '`valueUsd / nativeUsd`; null when either side is missing.'
        whyNoNative:
          type: string
          nullable: true
          description: Why `nativeAmount` is null; null when it is not.
    PortfolioIncludesToken:
      type: object
      required:
      - tokenAddress
      - held
      - inTotal
      - valueUsd
      - chains
      - note
      properties:
        tokenAddress:
          type: string
          description: The stored address when held, else the query as sent.
        held:
          type: boolean
        inTotal:
          type: boolean
          description: Held AND priced, i.e. part of `totalValueUsd`. Held-but-unpriced is false.
        valueUsd:
          type: number
          nullable: true
        chains:
          type: array
          items:
            type: string
        note:
          type: string
    PositionsResponse:
      type: object
      required:
      - handle
      - name
      - asOf
      - liveBasis
      - count
      - positions
      - limit
      - nextCursor
      - complete
      - totalValueUsd
      - unsellableUsd
      - partial
      - partialReason
      - coverage
      - chainHistory
      - entries
      properties:
        handle:
          type: string
        name:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest balance read among this trader's rows.
        liveBasis:
          $ref: '#/components/schemas/PositionsLiveBasis'
        count:
          type: integer
          minimum: 0
          description: Rows on this page.
        positions:
          type: integer
          minimum: 0
          description: Rows in the whole (filtered) list.
        limit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 500
          description: The page size actually applied; null when unpaged.
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `?cursor=`; null at the end of the list.
        complete:
          type: boolean
          description: False whenever rows remain. Do not call a `false` page a portfolio.
        totalValueUsd:
          type: number
          nullable: true
          description: Sum of priced, sellable holdings. 0 when the trader holds nothing; null when nothing
            held could be priced.
        unsellableUsd:
          type: number
          minimum: 0
          description: Priced value in honeypot / sell-blocked coins, kept out of `totalValueUsd`.
        suspectUsd:
          type: number
          minimum: 0
          description: 'Priced value under a suspect price (`priceSuspect: true` rows), kept out of `totalValueUsd`,
            `coverage.pricedPositions` and every `share`. The rows keep `priceUsd` and `valueUsd` so what
            was excluded is visible.'
        partial:
          type: boolean
        partialReason:
          type: string
          nullable: true
          enum:
          - unsellable_positions
          - indexer_coverage_low
          - unsellable_positions_and_indexer_coverage_low
          - price_suspect
          - price_suspect_and_unsellable_positions
          - price_suspect_and_indexer_coverage_low
          - price_suspect_and_unsellable_positions_and_indexer_coverage_low
          - null
        coverage:
          $ref: '#/components/schemas/PositionsCoverage'
        chainHistory:
          $ref: '#/components/schemas/PositionsChainHistory'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PositionRow'
    PositionsLiveBasis:
      type: object
      description: What `amountLive` is on each chain family.
      required:
      - solana
      - evm
      properties:
        solana:
          type: string
          enum:
          - rolled_forward_from_transfers
        evm:
          type: string
          enum:
          - nightly_read
    PositionsChainCoverage:
      type: object
      description: How much of one chain's activity the indexer holds, written by the balances job after
        each EVM wallet read from one Bitquery `Transactions { count }` on the realtime dataset.
      required:
      - readAt
      properties:
        chainTxCount:
          type: integer
          nullable: true
          description: Transactions the wallet sent within Bitquery's realtime window, a LOWER bound on
            its nonce.
        rowsHeld:
          type: integer
          nullable: true
        share:
          type: number
          nullable: true
          description: '`rowsHeld / chainTxCount`; null when either side is unknown or the wallet never
            sent. An upper bound (the count is a lower bound) and may exceed 1. Below 0.5 makes the list
            partial.'
        readAt:
          type: string
          format: date-time
          nullable: true
        basis:
          type: string
          enum:
          - bitquery_realtime
          description: What `chainTxCount` counts.
    PositionsCoverage:
      type: object
      required:
      - pricedPositions
      - unpricedPositions
      - chains
      properties:
        pricedPositions:
          type: integer
          minimum: 0
          description: Valued rows whose price is not suspect.
        suspectPositions:
          type: integer
          minimum: 0
          description: 'Rows with `priceSuspect: true`; their value is `suspectUsd`.'
        unpricedPositions:
          type: integer
          minimum: 0
          description: Rows with `valueUsd` null.
        chains:
          type: object
          description: Keyed by chain name. Empty when no coverage row exists for the trader.
          additionalProperties:
            $ref: '#/components/schemas/PositionsChainCoverage'
    PositionsChainHistory:
      type: object
      required:
      - observedFrom
      - note
      - positionsWithTiming
      - positionsWithoutTiming
      properties:
        observedFrom:
          type: string
          format: date-time
          nullable: true
          description: Earliest on-chain timing held for this trader - a floor under every timestamp on
            the page.
        note:
          type: string
        positionsWithTiming:
          type: integer
          minimum: 0
        positionsWithoutTiming:
          type: integer
          minimum: 0
    PositionCost:
      type: object
      description: What the trader paid for what he still holds, from stored trades. Everything is null
        (not 0) when nothing stored says he bought it - a transfer in is not a purchase at zero.
      required:
      - costKnownAmount
      - avgCostPrice
      - costUsd
      - realizedUsd
      - unrealizedUsd
      - costMethod
      - costSource
      - costCoverage
      - costReason
      properties:
        costKnownAmount:
          type: number
          nullable: true
          description: Quantity the cost basis covers.
        avgCostPrice:
          type: number
          nullable: true
        costUsd:
          type: number
          nullable: true
        realizedUsd:
          type: number
          nullable: true
          description: Realised on this coin's CLOSED positions - a different quantity.
        unrealizedUsd:
          type: number
          nullable: true
          description: '`(priceUsd - avgCostPrice) x costKnownAmount`; against the known amount only.'
        costMethod:
          type: string
          nullable: true
          enum:
          - weighted_open_positions
          - weighted_open_positions_partial
          - null
        costSource:
          type: string
          nullable: true
        costCoverage:
          $ref: '#/components/schemas/MoneyCoverage'
        costReason:
          type: string
          nullable: true
          description: Why the cost is null; null when it is not.
        costAmountShare:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Share of the holding the cost covers. Absent (not null) when no stored position
            exists for the holding.
    PositionRow:
      allOf:
      - type: object
        required:
        - tokenAddress
        - networkId
        - chain
        - isNative
        - amount
        - amountLive
        - deltaSinceRead
        - lastTransferAt
        - balanceAt
        - tier
        - priceUsd
        - drawdownShare
        - valueUsd
        - whyNoPrice
        - priceSuspect
        - priceSuspectReason
        - isQuoteAsset
        - isHoneypot
        - canSell
        - startHoldingAt
        - endHoldingAt
        - lastActiveAt
        properties:
          tokenAddress:
            type: string
          networkId:
            type: integer
          chain:
            type: string
          isNative:
            type: boolean
            description: True for the chain's own coin (EVM zero-address sentinel, Solana system program
              key).
          amount:
            type: number
            description: Balance at `balanceAt`.
          amountLive:
            type: number
            nullable: true
            description: Solana - `amount` plus signed transfers since `balanceAt` from the webhook feed.
              EVM - null.
          deltaSinceRead:
            type: number
            nullable: true
            description: The signed sum itself; 0 = nothing moved (Solana), null = not rolled forward
              (EVM).
          lastTransferAt:
            type: string
            format: date-time
            nullable: true
          balanceAt:
            type: string
            format: date-time
            nullable: true
            description: When the balance was read.
          tier:
            type: string
            enum:
            - verified
            - reported
            - rolled_forward
            description: '`verified` - read from chain; `reported` - a build said so; `rolled_forward`
              - opened since the read (amount 0, balanceAt null, no price).'
          priceUsd:
            type: number
            nullable: true
          priceSource:
            type: string
            nullable: true
            enum:
            - pegged
            - token_info
            - token_prices
            - fomo_reported_entry
            - null
            description: Which price ladder rung valued the holding (`pegged` = quote_assets.pegged_usd,
              `token_info` = GMGN, `token_prices` = the newest daily row, `fomo_reported_entry` = the
              directory build's reported price); null when unpriced.
          pricedAt:
            type: string
            format: date-time
            nullable: true
            description: When that price was true.
          drawdownShare:
            type: number
            nullable: true
            description: '`1 - last / ATH` over hourly samples; null when never sampled.'
          valueUsd:
            type: number
            nullable: true
            description: Null, never 0, when the holding cannot be priced or its price was refused by
              the ceilings.
          whyNoPrice:
            type: string
            nullable: true
          priceSuspect:
            type: boolean
          priceSuspectReason:
            type: string
            nullable: true
            enum:
            - implied_mcap_over_ceiling
            - concentration_over_ceiling
            - no_market_over_ceiling
            - null
          share:
            type: number
            nullable: true
            minimum: 0
            maximum: 1
            description: Share of `totalValueUsd`; null when unpriced or unsellable.
          isQuoteAsset:
            type: boolean
          isHoneypot:
            type: boolean
          canSell:
            type: boolean
            nullable: true
            description: Null when the security source never judged it; false when it said cannot sell.
          startHoldingAt:
            type: string
            format: date-time
            nullable: true
            description: First time the token was seen arriving; null with no on-chain record.
          endHoldingAt:
            type: string
            format: date-time
            nullable: true
          lastActiveAt:
            type: string
            format: date-time
            nullable: true
      - $ref: '#/components/schemas/PositionCost'
    PositionsBatchRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          description: Handles, display handles or stable ids (`trd_` prefix optional). Entries are coerced
            to strings and trimmed. Duplicates, after resolution, are refused. More than 50 is a 400.
          items:
            type: string
          example:
          - '397397'
          - trd_a06e3ef7-425a-48e9-a131-220a4dcea4cc
        contractVersion:
          type: integer
          description: '`1` selects the pre-v2 projection. Any other value, or absent, answers with contract
            version 2. Compared numerically, so `"1"` also selects v1.'
          default: 2
          example: 2
    PositionsBatchEnvelope:
      type: object
      required:
      - limit
      - asked
      - capped
      - asOf
      properties:
        limit:
          type: integer
          enum:
          - 50
          description: The cap per call, stated on every answer.
        asked:
          type: integer
          minimum: 1
          maximum: 50
          description: Ids received; also the call's cost (`x-cost-units`).
        capped:
          type: boolean
          description: Always false - over the cap is refused with a 400, never trimmed.
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest balance read across every trader asked for.
        note:
          type: string
          description: Only present when `capped` is true (never, today).
    PositionsBatchResponseV2:
      allOf:
      - type: object
        required:
        - contractVersion
        - traders
        properties:
          contractVersion:
            type: integer
            enum:
            - 2
          traders:
            type: array
            description: One row per requested id, in request order.
            items:
              oneOf:
              - $ref: '#/components/schemas/PositionsBatchTrader'
              - $ref: '#/components/schemas/PositionsBatchTraderMissing'
      - $ref: '#/components/schemas/PositionsBatchEnvelope'
    PositionsBatchTrader:
      type: object
      required:
      - ok
      - requested
      - id
      - handle
      - positions
      - positionCount
      - pricedPositionCount
      - totalValueUsd
      - unsellableUsd
      - coverage
      - complete
      - nextCursor
      properties:
        ok:
          type: boolean
          enum:
          - true
        requested:
          type: string
          description: The id exactly as the caller sent it.
        id:
          type: string
          nullable: true
          format: uuid
          description: The trader's stable id.
        handle:
          type: string
          description: Display handle.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionsBatchRow'
        positionCount:
          type: integer
          minimum: 0
        pricedPositionCount:
          type: integer
          minimum: 0
          description: Valued rows whose price is not suspect.
        suspectPositionCount:
          type: integer
          minimum: 0
          description: 'Rows with `priceSuspect: true`; their value is `suspectUsd`.'
        totalValueUsd:
          type: number
          nullable: true
          description: 0 when nothing is held; null when nothing held could be priced.
        unsellableUsd:
          type: number
          minimum: 0
        suspectUsd:
          type: number
          minimum: 0
          description: Priced value under a suspect price, kept out of `totalValueUsd`; the rows still
            show it.
        partial:
          type: boolean
          enum:
          - true
          description: Present only when `partialReason` is set.
        partialReason:
          type: string
          enum:
          - unsellable_positions
          - indexer_coverage_low
          - unsellable_positions_and_indexer_coverage_low
          - price_suspect
          - price_suspect_and_unsellable_positions
          - price_suspect_and_indexer_coverage_low
          - price_suspect_and_unsellable_positions_and_indexer_coverage_low
          description: Present only when the row is partial.
        coverage:
          allOf:
          - $ref: '#/components/schemas/MoneyCoverage'
          - type: object
            required:
            - chains
            properties:
              chains:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/PositionsChainCoverage'
        complete:
          type: boolean
          enum:
          - true
          description: The batch never pages.
        nextCursor:
          type: string
          nullable: true
          enum:
          - null
          description: Always null; kept so the field means the same as on the single route.
    PositionsBatchTraderMissing:
      type: object
      required:
      - ok
      - requested
      - id
      - handle
      - error
      properties:
        ok:
          type: boolean
          enum:
          - false
        requested:
          type: string
        id:
          type: string
          nullable: true
          enum:
          - null
        handle:
          type: string
          nullable: true
          enum:
          - null
        error:
          type: object
          required:
          - code
          - detail
          properties:
            code:
              type: string
              enum:
              - not_found
            detail:
              type: string
    PositionsBatchRow:
      allOf:
      - type: object
        required:
        - chain
        - networkId
        - tokenAddress
        - symbol
        - isNative
        - amount
        - balanceAt
        - priceUsd
        - drawdownShare
        - valueUsd
        - whyNoPrice
        - priceSuspect
        - priceSuspectReason
        - tier
        - isHoneypot
        - canSell
        properties:
          chain:
            type: string
          networkId:
            type: integer
          tokenAddress:
            type: string
          symbol:
            type: string
            nullable: true
          isNative:
            type: boolean
          amount:
            type: number
            nullable: true
            description: Balance at `balanceAt`; null when the row carries none.
          balanceAt:
            type: string
            format: date-time
            nullable: true
          priceUsd:
            type: number
            nullable: true
          priceSource:
            type: string
            nullable: true
            enum:
            - pegged
            - token_info
            - token_prices
            - fomo_reported_entry
            - null
          pricedAt:
            type: string
            format: date-time
            nullable: true
          drawdownShare:
            type: number
            nullable: true
          valueUsd:
            type: number
            nullable: true
            description: Null, never 0, for an unpriceable coin.
          whyNoPrice:
            type: string
            nullable: true
          priceSuspect:
            type: boolean
          priceSuspectReason:
            type: string
            nullable: true
            enum:
            - implied_mcap_over_ceiling
            - concentration_over_ceiling
            - no_market_over_ceiling
            - null
          tier:
            type: string
            enum:
            - verified
            - reported
          isHoneypot:
            type: boolean
          canSell:
            type: boolean
            nullable: true
      - $ref: '#/components/schemas/PositionCost'
    PositionsBatchResponseV1:
      allOf:
      - type: object
        required:
        - traders
        description: 'The pre-v2 projection (`contractVersion: 1`). No `ok`, no `id`; an unknown id yields
          a row with the lower-cased input as `handle` and no positions.'
        properties:
          traders:
            type: array
            items:
              $ref: '#/components/schemas/PositionsBatchTraderV1'
      - $ref: '#/components/schemas/PositionsBatchEnvelope'
    PositionsBatchTraderV1:
      type: object
      required:
      - handle
      - positions
      - coverage
      properties:
        handle:
          type: string
          description: The RESOLVED directory handle (lower-case), not the display handle.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionsBatchRow'
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
    ScorecardResponse:
      type: object
      required:
      - handle
      - name
      - source
      - traderSource
      - realizedByDay
      - realizedByMonth
      - realizedByMonthBasis
      - asOf
      - sample
      - complete
      - tradesKnown
      - tradesUsed
      - loadedAt
      - loadAttemptedAt
      - loadOutcome
      - nextLoadAt
      - nextLoadBasis
      - staleness
      - onChain
      - onChainNote
      - fees
      - volume
      - winRate
      - wins
      - losses
      - breakeven
      - winRateBasis
      - winRateCoverage
      - bestTradeUsd
      - worstTradeUsd
      - topTradeShare
      - meanToMedian
      - meanTradeUsd
      - medianTradeUsd
      - meanToMedianBasis
      - perExit
      - moneyIn
      - moneyOut
      - returnPct
      - typicalBetUsd
      - medianWinUsd
      - medianLossUsd
      - bigWinMonths
      - recent
      - career
      - bleeding
      - bleedingBasis
      - exitTimingScore
      - fieldReasons
      - measurements
      - holdingTime
      - lastTradeAt
      - firstTradeAt
      - trackRecordDays
      - tradesPerDay
      - entryBasis
      - smallCapWinRate
      - windows
      - buysCoverage
      - entryPriceCoverage
      - tokensTotal
      - coinsTotal
      - plain
      - caveats
      properties:
        handle:
          type: string
        name:
          type: string
          nullable: true
        source:
          type: string
          description: Where the trades came from (fomoapi load, or folded from GMGN wallet activity).
        traderSource:
          type: string
          nullable: true
          example: fomoapi.io
        realizedByDay:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardRealizedDay'
        realizedByMonth:
          type: array
          description: The last twelve completed calendar months plus the running one, ascending.
          items:
            $ref: '#/components/schemas/ScorecardRealizedMonth'
        realizedByMonthBasis:
          $ref: '#/components/schemas/ScorecardRealizedMonthBasis'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest `captured_at` among the trader's stored trades.
        sample:
          $ref: '#/components/schemas/ScorecardSample'
        complete:
          type: boolean
          enum:
          - true
        tradesKnown:
          type: integer
          minimum: 0
        tradesUsed:
          type: integer
          minimum: 0
        loadedAt:
          type: string
          format: date-time
          nullable: true
        loadAttemptedAt:
          type: string
          format: date-time
          nullable: true
          description: Last fomoapi fetch attempt; null = never attempted.
        loadOutcome:
          type: string
          nullable: true
          enum:
          - loaded
          - unchanged
          - unavailable
          - degraded
          - not_found
          - error
          - null
          description: The loader's last attempt. `unchanged` = fomo answered but the snapshot (`loadedAt`)
            did not advance; retried six-hourly.
        nextLoadAt:
          type: string
          format: date-time
          description: Next 06:00 UTC nightly slot.
        nextLoadBasis:
          type: string
          enum:
          - six_hourly_slot
          - nightly_slot
          description: '`six_hourly_slot` - the next 0/6/12/18 UTC tick of the loader; `nightly_slot`
            was the pre-Worker word and is published one more version.'
        staleness:
          $ref: '#/components/schemas/ScorecardStaleness'
        onChain:
          description: Same figures from the wallet's own resolved swaps. Null only under `?include=scorecard`
            on the board.
          anyOf:
          - $ref: '#/components/schemas/ScorecardOnChain'
          - type: object
            nullable: true
            enum:
            - null
            description: absent
        onChainNote:
          type: string
          nullable: true
        fees:
          $ref: '#/components/schemas/ScorecardFees'
        volume:
          $ref: '#/components/schemas/ScorecardVolume'
        winRate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Wins over closed positions carrying a realised figure.
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        breakeven:
          type: integer
          minimum: 0
        winRateBasis:
          type: string
          enum:
          - closed_positions_with_realized_figure
        winRateCoverage:
          $ref: '#/components/schemas/MoneyCoverage'
        bestTradeUsd:
          type: number
          nullable: true
        worstTradeUsd:
          type: number
          nullable: true
        topTradeShare:
          type: number
          nullable: true
          description: Best trade over the sum of gains; null with no winning trade.
        meanToMedian:
          type: number
          nullable: true
          description: Mean over median realised per token; null unless both are positive.
        meanTradeUsd:
          type: number
          nullable: true
        medianTradeUsd:
          type: number
          nullable: true
        meanToMedianBasis:
          type: string
          enum:
          - per_token
        perExit:
          $ref: '#/components/schemas/ScorecardPerExit'
        moneyIn:
          $ref: '#/components/schemas/ScorecardMoneyLeg'
        moneyOut:
          $ref: '#/components/schemas/ScorecardMoneyLeg'
        returnPct:
          $ref: '#/components/schemas/ScorecardReturnPct'
        typicalBetUsd:
          $ref: '#/components/schemas/ScorecardTypicalBet'
        medianWinUsd:
          type: number
          nullable: true
          description: Median realised P&L over winners; null when none.
        medianLossUsd:
          type: number
          nullable: true
          description: Median realised P&L over losers (negative); null when none.
        bigWinMonths:
          type: integer
          nullable: true
          minimum: 0
          description: Distinct `closedMonth` with a coin at >= 10x; null when no coin carries a multiple,
            0 when some do and none reached 10x.
        recent:
          $ref: '#/components/schemas/ScorecardRecent'
        career:
          $ref: '#/components/schemas/ScorecardCareer'
        bleeding:
          type: boolean
          nullable: true
          description: See `bleedingBasis.plain`; null with no dated close.
        bleedingBasis:
          $ref: '#/components/schemas/ScorecardBleedingBasis'
        exitTimingScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Share of closed coins whose current price is below the average exit; null under
            5 coins carrying both prices.
        fieldReasons:
          $ref: '#/components/schemas/ScorecardFieldReasons'
        measurements:
          $ref: '#/components/schemas/ScorecardMeasurements'
        holdingTime:
          $ref: '#/components/schemas/ScorecardHoldingTime'
        lastTradeAt:
          type: string
          format: date-time
          nullable: true
        firstTradeAt:
          type: string
          format: date-time
          nullable: true
        trackRecordDays:
          type: number
          nullable: true
        tradesPerDay:
          type: number
          nullable: true
          description: Positions per calendar day over the record; null under one day of span.
        entryBasis:
          $ref: '#/components/schemas/ScorecardEntryBasis'
        smallCapWinRate:
          $ref: '#/components/schemas/ScorecardSmallCapWinRate'
        windows:
          $ref: '#/components/schemas/ScorecardWindows'
        buysCoverage:
          $ref: '#/components/schemas/ScorecardBuysCoverage'
        entryPriceCoverage:
          $ref: '#/components/schemas/ScorecardEntryPriceCoverage'
        tokensTotal:
          type: integer
          minimum: 0
        coinsTotal:
          type: integer
          minimum: 0
          description: Same as `tokensTotal`.
        byToken:
          type: array
          description: Per-coin economics, realised P&L descending. Omitted entirely with `?tokens=0`;
            truncated to `?tokens=N`.
          items:
            $ref: '#/components/schemas/ScorecardByToken'
        plain:
          type: string
        caveats:
          type: array
          items:
            type: string
    ScorecardRealizedDay:
      type: object
      required:
      - day
      - realizedUsd
      - closedTrades
      properties:
        day:
          type: string
          format: date
          example: '2026-09-14'
        realizedUsd:
          type: number
          nullable: true
        closedTrades:
          type: integer
          minimum: 0
    ScorecardRealizedMonth:
      type: object
      required:
      - month
      - realizedUsd
      - closedTrades
      - coverage
      - complete
      - startingCapitalUsd
      - startCapitalUsd
      - returnPct
      properties:
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
          example: 2026-08
        realizedUsd:
          type: number
          nullable: true
          description: Null when no close in the month carries a figure.
        closedTrades:
          type: integer
          minimum: 0
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
        complete:
          type: boolean
          description: False for the running month.
        startingCapitalUsd:
          type: number
          nullable: true
          description: Balance the trader entered the month with; null when no reading is held.
        startCapitalUsd:
          type: number
          nullable: true
          description: Same value as `startingCapitalUsd`.
        returnPct:
          type: number
          nullable: true
          description: '`realizedUsd / startCapitalUsd x 100`; null without a positive starting capital.'
    ScorecardRealizedMonthBasis:
      type: object
      required:
      - months
      - from
      - to
      - realizedUsd
      - beforeWindowUsd
      - note
      properties:
        months:
          type: integer
          minimum: 0
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
        realizedUsd:
          type: number
          nullable: true
        beforeWindowUsd:
          type: number
          nullable: true
          description: Lifetime realised minus the twelve-month sum.
        note:
          type: string
    ScorecardSample:
      type: object
      required:
      - returned
      - storedAt
      - complete
      - capped
      - unit
      - positionsStored
      - reportedTrades
      - reportedTradesSource
      - loadedAt
      - loadAttemptedAt
      - loadOutcome
      - nextLoadAt
      - nextLoadBasis
      - note
      properties:
        returned:
          type: integer
          minimum: 0
        storedAt:
          type: string
          format: date-time
          nullable: true
        complete:
          type: boolean
          enum:
          - true
        capped:
          type: boolean
          enum:
          - false
        unit:
          type: string
          enum:
          - position
        positionsStored:
          type: integer
          minimum: 0
        reportedTrades:
          type: integer
          nullable: true
          description: Leaderboard lifetime fill count; not comparable to `returned`.
        reportedTradesSource:
          type: string
        loadedAt:
          type: string
          format: date-time
          nullable: true
        loadAttemptedAt:
          type: string
          format: date-time
          nullable: true
        loadOutcome:
          type: string
          nullable: true
          enum:
          - loaded
          - unchanged
          - unavailable
          - degraded
          - not_found
          - error
          - null
          description: The loader's last attempt. `unchanged` = fomo answered but the snapshot (`loadedAt`)
            did not advance; retried six-hourly.
        nextLoadAt:
          type: string
          format: date-time
        nextLoadBasis:
          type: string
          enum:
          - six_hourly_slot
          - nightly_slot
          description: '`six_hourly_slot` - the next 0/6/12/18 UTC tick of the loader; `nightly_slot`
            was the pre-Worker word and is published one more version.'
        note:
          type: string
    ScorecardStaleness:
      type: object
      required:
      - state
      - ageSeconds
      - staleAfterHours
      - fallback
      - fallbackReason
      properties:
        state:
          type: string
          enum:
          - current
          - stale
          - never
        ageSeconds:
          type: integer
          nullable: true
          minimum: 0
        staleAfterHours:
          type: integer
          enum:
          - 72
        fallback:
          type: string
          nullable: true
          enum:
          - on_chain
          - null
          description: '`on_chain` when stale or never AND `onChain.coverage.share >= 0.5` (the swap store
            holds at least half the profile''s swaps) - draw `onChain` instead.'
        fallbackReason:
          type: string
          nullable: true
          enum:
          - swap_store_incomplete
          - null
          description: Why `fallback` is null although the record is stale or never - the swap store covers
            under half of this trader. null when current or when `fallback` is set.
    ScorecardOnChain:
      type: object
      required:
      - swaps
      - buys
      - sells
      - volumeUsd
      - realizedPnlUsd
      - winRate
      - wins
      - losses
      - coverage
      - asOf
      properties:
        basis:
          type: string
          enum:
          - wallet_swaps
        swaps:
          type: integer
          minimum: 0
        buys:
          type: integer
          nullable: true
        sells:
          type: integer
          nullable: true
        volumeUsd:
          type: number
          nullable: true
        realizedPnlUsd:
          type: number
          nullable: true
          description: Sum over resolved exits; null with none.
        winRate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        wins:
          type: integer
          nullable: true
        losses:
          type: integer
          nullable: true
        coverage:
          $ref: '#/components/schemas/MoneyCoverage'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Newest resolved swap.
    ScorecardFeeNative:
