  /v1/market/regime:
    get:
      operationId: getMarketRegime
      tags:
      - Market
      summary: Cohort-wide 7-day conditions and a regime word
      description: 'One reading for everyone ("Casino Closed" workflow, composite C4): how many tracked
        leaders closed green this week, how many Solana launches graduated, and how concentrated the cohort''s
        rotation is, reduced to `regime` by the published `rule`: `closed` when `leaders.greenShare7d
        < 0.25`, `caution` when `< 0.5`, else `open`; `launches.survival7d < 0.1` moves the result one
        step down (never past `closed`). `regime` is `null` when no tracked leader closed a trade in the
        window. `greenShare7d`, `survival7d` and `topShare7d` are `null` when their denominator is zero,
        never 0. The body is identical for every caller and served from a 60 s per-instance memory cache,
        so `asOf` is the compute time. A cohort reading, not advice.'
      responses:
        '200':
          description: The cohort reading
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketRegime'
              example:
                board: market
                asOf: '2026-09-17T12:00:03.120Z'
                window: 7d
                regime: caution
                rule:
                  closedBelow: 0.25
                  cautionBelow: 0.5
                  survivalDowngradeBelow: 0.1
                  basis: greenShare7d < closedBelow → closed, < cautionBelow → caution, else open; survival7d
                    < survivalDowngradeBelow moves the result one step down
                leaders:
                  total: 84
                  green7d: 31
                  greenShare7d: 0.369
                  basis: traders with ≥ 1 trade closed in the window; green = sum(realized_pnl_usd) >
                    0 over those closes
                launches:
                  seen7d: 40
                  graduated7d: 3
                  survival7d: 0.075
                  chains:
                  - solana
                  basis: tokens.created_at in the window (pump.fun curve read, docs/LAUNCH_METADATA.md);
                    graduated = curve complete
                rotation:
                  tokensMoved7d: 612
                  topShare7d: 0.41
                  basis: transfers in the window across tracked wallets; topShare7d = share carried by
                    the 10 most-moved tokens
                plain: 37% of tracked leaders are green this week (31 of 84); 8% of 40 Solana launches
                  graduated; regime caution. A cohort reading, not advice.
                cachedForSeconds: 60
        '401':
          description: X-API-Key missing or wrong (only when the deployment sets GENIE_API_KEY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: invalid or missing X-API-Key
                  requestId: req_5f1c9a3d2b7e4a10
        '429':
          description: Rate limit exceeded; `Retry-After` header is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  detail: too many requests — retry after the stated delay
                  requestId: req_5f1c9a3d2b7e4a10
                  retryAfterSeconds: 57
        '500':
          description: Unclassified failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: internal_error
                  detail: the service failed to answer this request
                  requestId: req_5f1c9a3d2b7e4a10
        '503':
          description: Database unreachable (`unavailable`) or the 15 s route budget elapsed (`timeout`);
            the `Retry-After` header is 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unavailable
                  detail: the database is not answering — retry shortly
                  requestId: req_5f1c9a3d2b7e4a10
                  retryAfterSeconds: 5
  /v1/tokens:
    get:
      operationId: listTokens
      tags:
      - Tokens
      summary: The token board — what the tracked leaders are crowding into
      description: 'One row per (chain, token) held by at least `minHolders` tracked leaders, ranked by
        `orderBy`.

        Quote assets (USDC and the like) are always excluded; `excludedQuoteAssets` counts them.

        `rank` is the position on the whole board, not within the page. Paged by keyset cursor:

        feed `nextCursor` back as `cursor`; it is `null` on the last page. With no `limit` the whole

        board is returned.


        `null` means not assessed / not priced, never zero: `totalValueUsd` is null when no holder

        has a price; `isHoneypot` is null on every Solana token (GMGN does not assess it there).

        `marketCapUsd`, `liquidityUsd`, `chainHolderCount`, `smartWallets`, `renownedWallets` are

        GMGN''s chain-wide figures (`fundamentalsTier: third_party`) and null before a fetch; a

        market-cap or liquidity filter therefore excludes unfetched tokens rather than counting them as
        0

        (`filtersNote`). Wallet-tag counts are capped at 1000 by GMGN (1000 means at least 1000).

        Costs 1 unit.

        '
      parameters:
      - name: chain
        in: query
        required: false
        description: Restrict to one chain, validated against the `chains` table; unknown is 400 `bad_request`.
        schema:
          type: string
          example: solana
      - name: minHolders
        in: query
        required: false
        description: Keep tokens held by at least this many leaders. Whole number >= 1; otherwise 400.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: orderBy
        in: query
        required: false
        description: Sort key. Unknown is 400 with `valid` listing the keys. Echoed only when sent.
        schema:
          type: string
          default: holders
          enum:
          - holders
          - value
          - priced
          - marketCap
          - liquidity
          - chainHolders
          - smartWallets
          - renownedWallets
      - name: direction
        in: query
        required: false
        description: Sort direction; every key defaults to `desc`. Other words are 400.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: minValue
        in: query
        required: false
        description: Minimum summed leader value in USD (priced positions only). Any finite number; non-numeric
          is 400.
        schema:
          type: number
      - name: maxValue
        in: query
        required: false
        description: Maximum summed leader value in USD.
        schema:
          type: number
      - name: minMarketCap
        in: query
        required: false
        description: Minimum GMGN market cap in USD. Unfetched tokens are excluded, not counted as 0.
        schema:
          type: number
      - name: maxMarketCap
        in: query
        required: false
        description: Maximum GMGN market cap in USD.
        schema:
          type: number
      - name: minLiquidity
        in: query
        required: false
        description: Minimum GMGN liquidity in USD.
        schema:
          type: number
      - name: excludeHoneypots
        in: query
        required: false
        description: Exactly `true` drops tokens GMGN flagged as honeypots; any other value is ignored.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        description: Page size. Whole number >= 1, no upper bound; omitted = the whole board.
        schema:
          type: integer
          minimum: 1
      - name: cursor
        in: query
        required: false
        description: The `nextCursor` of the previous page. Opaque.
        schema:
          type: string
      responses:
        '200':
          description: The board page.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBoardResponse'
              example:
                board: tokens
                chain: all
                asOf: '2026-09-17T06:12:44.000Z'
                traders: 445
                count: 2
                ranked: 1873
                totalTokens: 5244
                minHolders: 1
                excludedQuoteAssets:
                  tokens: 6
                  positions: 391
                nextCursor: eyJrIjpbIjEzOTk4MTExNDk6YWk2NmxoenEifV0
                filters:
                  minMarketCap: 100000
                filtersNote: market cap and liquidity come from GMGN; a token not yet fetched cannot be
                  evaluated and is excluded rather than counted as zero
                orderBy: holders
