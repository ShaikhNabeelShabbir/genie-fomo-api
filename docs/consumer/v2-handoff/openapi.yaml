      - lastBigWinAt
      - closes4w
      - green4w
      - last20
      - entryMcapMedianUsd
      - holdHoursMedian
      - tradesPerDay
      properties:
        lastBigWinAt:
          type: string
          format: date-time
          nullable: true
          description: Last close of a coin at >= 5x.
        closes4w:
          type: integer
          minimum: 0
        green4w:
          type: integer
          minimum: 0
        last20:
          type: object
          required:
          - avgRealizedUsd
          - redShare
          properties:
            avgRealizedUsd:
              type: number
              nullable: true
            redShare:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
        entryMcapMedianUsd:
          type: number
          nullable: true
        holdHoursMedian:
          type: number
          nullable: true
        tradesPerDay:
          type: number
          nullable: true
        basis:
          type: string
    ScorecardCareer:
      type: object
      required:
      - avgRealizedUsd
      - entryMcapMedianUsd
      - holdHoursMedian
      - tradesPerDay
      properties:
        avgRealizedUsd:
          type: number
          nullable: true
        entryMcapMedianUsd:
          type: number
          nullable: true
        holdHoursMedian:
          type: number
          nullable: true
        tradesPerDay:
          type: number
          nullable: true
