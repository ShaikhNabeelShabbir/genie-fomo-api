            24h:
              type: number
              nullable: true
            7d:
              type: number
              nullable: true
            30d:
              type: number
              nullable: true
            all:
              type: number
              nullable: true
        paidNative:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardFeeNative'
        transactions:
          type: integer
          minimum: 0
        coverage:
          allOf:
          - $ref: '#/components/schemas/MoneyCoverage'
          description: Chains priced over chains with fees.
        source:
          type: string
          nullable: true
        perTradeUsd:
          type: number
          nullable: true
          enum:
          - null
          description: Always null here; see `perTradeWhy`.
        usdBasis:
          type: string
        why:
          type: string
          nullable: true
        perTradeWhy:
          type: string
    ScorecardVolume:
      type: object
      required:
      - reportedLifetimeUsd
      - reportedSource
      - measuredBasis
      - perWindow
      properties:
        reportedLifetimeUsd:
          type: number
          nullable: true
        reportedSource:
          type: string
        measuredBasis:
          type: string
        perWindow:
          type: string
    ScorecardPerExit:
      type: object
