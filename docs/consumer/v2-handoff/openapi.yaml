                  state: pending_first_read
                  readsOn: /v1/traders/397397/aum
                  note: the next balance read prices it; ask for his aum to force one now
                tier: reported
                plain: Accepted as a claim, not a verified fact — stored with source 'submitted' and confidence
                  'reported', so every figure derived from it says so.
        '400':
          description: '`bad_request` when the body is not JSON or neither address was sent; `invalid_address`
            when one fails its shape check (`parameter` names it).'
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notJson:
                  value:
                    error:
                      code: bad_request
                      detail: body must be JSON
                      requestId: req_3f9c2a1b7d4e8f01
                missing:
                  value:
                    error:
                      code: bad_request
                      detail: send `evmAddress`, `solanaAddress`, or both
                      requestId: req_3f9c2a1b7d4e8f01
                      parameter: evmAddress
                invalidAddress:
                  value:
                    error:
                      code: invalid_address
                      detail: '''0x1234'' is not a 20-byte hex address'
                      requestId: req_3f9c2a1b7d4e8f01
                      parameter: evmAddress
        '401':
          description: '`secret` missing or wrong (checked before the trader is resolved), or the deployment-wide
            X-API-Key gate.'
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unauthorized
                  detail: a valid `secret` is required to submit a wallet
                  requestId: req_3f9c2a1b7d4e8f01
        '404': *id014
        '409':
          description: '`address_in_use` when another trader holds the address (`heldBy`, `family`); `already_on_record`
            when this trader already has an address of that family (`family`, `current`).'
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                addressInUse:
                  value:
                    error:
                      code: address_in_use
                      detail: that address is already on record for 'unipcs'
                      requestId: req_3f9c2a1b7d4e8f01
                      heldBy: unipcs
                      family: solana
                alreadyOnRecord:
                  value:
                    error:
                      code: already_on_record
                      detail: this trader already has a Solana address; it is not overwritten by a submission
                      requestId: req_3f9c2a1b7d4e8f01
                      family: solana
                      current: 2heJbC32Tpfcb3nbUb5ER61K11FGZVfVGtVnDm6LDogF
        '429': *id009
        '500': *id010
        '503':
          description: '`not_configured` when WALLET_SUBMIT_SECRET is unset (checked first, before auth);
            otherwise `timeout` / `unavailable`.'
          headers:
            x-request-id: *id002
            RateLimit-Limit: *id003
            RateLimit-Remaining: *id004
            RateLimit-Reset: *id005
            RateLimit-Scope: *id006
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notConfigured:
                  value:
                    error:
                      code: not_configured
                      detail: wallet submission is not enabled on this deployment
                      requestId: req_3f9c2a1b7d4e8f01
                timeout:
                  value:
                    error:
                      code: timeout
                      detail: this route did not answer within 15s — retry
                      requestId: req_3f9c2a1b7d4e8f01
                      retryAfterSeconds: 5
  /v1/tokens/{address}/prices:
    get:
      operationId: getTokenPrices
      tags:
      - Tokens
      summary: Price history for one token, hourly or as daily / weekly / monthly candles
      description: Served from `token_price_hourly` (one DexScreener sample per held token per UTC hour
        since 17 Sep 2026) and its candle views; nothing is fetched live and nothing before the first
        sample is rebuilt from the daily `token_prices`. `step` defaults from `window` (`1d`,`1w` → `1h`;
        `1m`,`3m` → `1d`; `1y` → `1w`; `all` → `1mo`); `from`/`to` override the window. `1h` points carry
        `usd` and `liquidityUsd`; coarser steps carry the candle with `usd` as the close and `hours` saying
        how full the bucket is. The newest `limit` points are kept and `truncated` says whether older
        ones were dropped. `ath` is the running high since sampling began. An address on several chains
        without `chain` is a 400 naming them. Costs 1 unit.
      parameters:
      - name: address
        in: path
        required: true
        description: Token address (base58 Solana mint or 0x EVM address). Case-insensitive.
        schema:
          type: string
          example: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
      - name: chain
        in: query
        required: false
        description: A `/v1/chains` name; required when the address exists on more than one chain. Unknown
          is 400.
        schema:
          type: string
          example: solana
      - name: step
        in: query
        required: false
        description: 'Bucket size. Defaults from `window`. Any other word answers 400 with `parameter:
          "step"` and `valid`.'
        schema:
          type: string
          enum:
          - 1h
          - 1d
          - 1w
          - 1mo
      - name: window
        in: query
        required: false
        description: 'Span counted back from `to` (or now). Any other word answers 400 with `parameter:
          "window"`.'
        schema:
          type: string
          enum:
          - 1d
          - 1w
          - 1m
          - 3m
          - 1y
          - all
          default: 1w
      - name: from
        in: query
        required: false
        description: 'ISO-8601 lower bound (inclusive); overrides the window. Unparseable is 400 with
          `parameter: "from"`; at or after `to` is 400.'
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: ISO-8601 upper bound (inclusive); default now.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Newest points to keep. Non-integer or below 1 answers 400; above 2000 is clamped.
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 2000
      responses:
        '200':
          description: The series, ascending by `at`.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPricesResponse'
              example:
                address: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
                chain: solana
                symbol: PUMP
                step: 1d
                window: 1m
                from: '2026-08-19T09:12:00.000Z'
                to: '2026-09-18T09:12:00.000Z'
                points:
                - at: '2026-09-17T00:00:00.000Z'
                  usd: 0.0041102
                  openUsd: 0.0043877
                  highUsd: 0.004491
                  lowUsd: 0.0040215
                  hours: 7
                - at: '2026-09-18T00:00:00.000Z'
                  usd: 0.003988
                  openUsd: 0.004105
                  highUsd: 0.004199
                  lowUsd: 0.0039102
                  hours: 9
                count: 2
                limit: 2000
                truncated: false
                latest:
                  at: '2026-09-18T09:00:00.000Z'
                  usd: 0.003988
                ath:
                  usd: 0.004491
                  at: '2026-09-17T14:00:00.000Z'
                asOf: '2026-09-18T09:00:00.000Z'
                links:
                  token: /v1/tokens/Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump?chain=solana
                  activity: /v1/tokens/Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump/activity?chain=solana
        '400':
          description: Bad `step`, `window`, `from`, `to`, `limit` or `chain` (`parameter` names it),
            or an address on several chains with no `chain` (`chains[]` names them).
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: '''step'' must be one of 1h, 1d, 1w, 1mo — got ''5m'''
                  requestId: req_3f9c2a1b7d4e8f01
                  parameter: step
                  valid:
                  - 1h
                  - 1d
                  - 1w
                  - 1mo
        '401': *id008
        '404':
          description: The address is not in `tokens` (on this chain, when `chain` was sent).
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  detail: no token '0x000000000000000000000000000000000000dead' on record on bsc
                  requestId: req_3f9c2a1b7d4e8f01
        '429': *id009
        '500': *id010
        '503': *id011
  /v1/tokens/prices:
    post:
      operationId: batchTokenPrices
      tags:
      - Tokens
      summary: Price history for up to 50 tokens in one call
      description: 'The batch form of `GET /v1/tokens/{address}/prices`, one `tokens[]` entry per requested
        address in the order sent: `ok: true` with that token''s series, or `ok: false` with `error` `not_found`
        (not in `tokens`) or `ambiguous_chain` (on several chains and no `chain`; `chains[]` names them).
        One SQL read serves every token. Over 50 addresses is a 400 refusal, never a silent trim; a duplicate
        is 400 `duplicate_identifier`. Step and window rules are the GET''s; the newest `pointsLimit`
        points are kept per token. The response''s `x-cost-units` header equals `asked`.'
      requestBody:
        required: true
        description: Must be JSON; a body that does not parse answers 400 `bad_request` ("body must be
          JSON").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPricesBatchRequest'
            example:
              addresses:
              - Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
              - '0x000000000000000000000000000000000000dead'
              window: 1w
      responses:
        '200':
          description: One entry per requested address
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
            x-cost-units:
              description: How many rate-limit units this call cost — the number of addresses asked for
                (at most 50).
              schema:
                type: integer
                minimum: 1
                maximum: 50
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPricesBatchResponse'
              example:
                limit: 50
                asked: 2
                step: 1h
                window: 1w
                from: '2026-09-11T09:12:00.000Z'
                to: '2026-09-18T09:12:00.000Z'
                pointsLimit: 2000
                tokens:
                - ok: true
                  requested: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
                  address: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
                  chain: solana
                  symbol: PUMP
                  points:
                  - at: '2026-09-18T08:00:00.000Z'
                    usd: 0.0040211
                    liquidityUsd: 211980.4
                  - at: '2026-09-18T09:00:00.000Z'
                    usd: 0.003988
                    liquidityUsd: 210044.9
                  count: 2
                  latest:
                    at: '2026-09-18T09:00:00.000Z'
                    usd: 0.003988
                - ok: false
                  requested: '0x000000000000000000000000000000000000dead'
                  error: not_found
                  detail: no token '0x000000000000000000000000000000000000dead' on record
                asOf: '2026-09-18T09:00:00.000Z'
        '400':
          description: No `addresses`, more than 50, a duplicate (`duplicate_identifier`), or a bad `step`,
            `window`, `from`, `to` or `chain` (`parameter` names it).
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_request
                  detail: at most 50 addresses per call — got 51; split the list rather than relying on
                    truncation
                  requestId: req_3f9c2a1b7d4e8f01
                  parameter: addresses
        '401': *id008
        '429': *id009
        '500': *id010
        '503': *id011
