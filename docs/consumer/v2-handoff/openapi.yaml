  /v1/tokens/{address}/activity:
    get:
      operationId: getTokenActivity
      tags:
      - Tokens
      summary: What the leaders did with one token — entries, exits, win rate, flow
      description: 'Every tracked trader with a trade record in the token, from one query, against the
        current

        holder set. Two populations are kept apart in `coverage`: `holdersNow` (holdings snapshot) and

        `withTradeRecord` (trades); a trader can be in either without the other.


        Rules: `everSold` is `null`, never `false`, when nobody has a trade record ("no evidence" is not

        "nobody sold"). `winRate` and `crowdAvgEntryPrice.value` are null when nothing qualifies.

        `crowdAvgEntryPrice` is one trader, one vote (an unweighted mean of each holder''s own

        quantity-weighted entry). `flow.verdict` is `accumulating` / `distributing` / `mixed` / `unknown`.

        `perHolder[].exitTimingScore` is that trader''s score across every coin he has closed, null under

        5 priced closed coins. A token on more than one chain needs `chain`, else 400. Costs 1 unit.

        '
      parameters:
      - name: address
        in: path
        required: true
        description: Token address (base58 Solana mint or 0x EVM address). Case-insensitive; not shape-checked.
        schema:
          type: string
          example: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
      - name: chain
        in: query
        required: false
        description: Required when the address exists on more than one chain. Validated against the `chains`
          table.
        schema:
          type: string
          example: solana
