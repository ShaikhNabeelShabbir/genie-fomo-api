      description: 'Everything the service holds about one token address, one `entries[]` block per chain
        the

        address exists on (`chains` counts them). Pass `chain` to pick one. The address is lower-cased

        and matched as a key; it is not shape-checked, so garbage is simply a 404.


        Each entry carries: leader holdings (`holders`, `holderShare`, `totalValueUsd`, `holders_detail`,

        `leaderConcentration`), GMGN fundamentals and security (`tier: third_party`, `null` blocks before

        the first fetch), the hourly DexScreener `price` block with rolling ATH (`null` fields, never
        0,

        when unknown), on-chain `launch` metadata (Solana only; every field null until read),

        the trade-based `cohort`, GMGN `walletTags` (capped at 1000) and the `creator` block with the

        nightly `ledger`. `security.honeypotSince` is the first nightly read that flagged the token and

        is never cleared. `security.canSell: null` means not assessed, never safe. Costs 1 unit.

        '
      parameters:
      - name: address
        in: path
        required: true
        description: Token address (base58 Solana mint or 0x EVM address). Case-insensitive.
        schema:
          type: string
          example: Ai66LHZq2v7dY4Nq3nJ6bVkzDgGXtVdEJHpDsTz5ppump
      - name: chain
        in: query
        required: false
        description: Restrict to one chain; validated against the `chains` table (unknown is 400).
        schema:
          type: string
          example: solana
      responses:
        '200':
          description: The token, one entry per chain.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
