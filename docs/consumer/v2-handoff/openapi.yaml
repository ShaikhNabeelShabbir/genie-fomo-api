  /v1/traders/{handle}/positions:
    get:
      operationId: getTraderPositions
      tags:
      - Positions
      summary: Every position one trader holds, priced where possible, with cost basis and timing
      description: One row per holding from `holdings_live` (the nightly read plus, on Solana, transfers
        rolled forward from the webhook feed since that read). Priced rows come first, descending by value;
        unpriced rows trail rather than being dropped. Each row carries where its price came from and
        when it was true, whether the balance was read from chain or reported, what was paid for it (`cost*`,
        null when nothing stored says it was bought), and on-chain timing (null when no record predates
        ingestion). `valueUsd` is null, never 0, when a holding cannot be priced. `totalValueUsd` is 0
        when the trader holds nothing, null when nothing held could be priced. Paged in memory with `limit`
        and `cursor`; `complete` is false whenever rows remain.
      parameters:
      - name: handle
        in: path
        required: true
        description: Directory handle, display handle (case-insensitive), `@handle`, or the trader's stable
          id as a UUID with or without the `trd_` prefix. Resolved in that order.
        schema:
          type: string
          example: '397397'
      - name: includeQuote
        in: query
        required: false
        description: 'Only the literal `false` has an effect: quote assets (stablecoins, wrapped native)
          are removed from `entries` and from `positions`. Any other value is ignored.'
        schema:
          type: string
          enum:
          - 'false'
      - name: limit
        in: query
        required: false
        description: Rows per page. Must be a whole number >= 1 (else 400). Values above 500 are silently
          clamped to 500; the value actually applied is echoed as `limit`. Absent means every row.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        required: false
        description: Opaque `nextCursor` from a previous page, unmodified. A malformed cursor, or one
          naming a row that no longer exists, is a 400.
