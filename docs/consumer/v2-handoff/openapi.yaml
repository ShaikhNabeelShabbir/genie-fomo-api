      description: 'A read that needs a body: fifty ids do not belong in a query string. Nothing is mutated.
        `ids` may mix handles, display handles and stable ids (`trd_` prefix optional). Over 50 ids is
        a refusal (400), never a trim; a duplicate — including an id and its own handle — is a 400 `duplicate_identifier`.
        The default answer is contract version 2: one row per requested id in request order, successes
        and failures alike (`ok: false` with an embedded `not_found` error for an unknown id). Send `contractVersion:
        1` for the pre-v2 projection, which keys rows by resolved handle and drops nothing but cannot
        say whether an unknown id was missing or merely empty. Rows are never paged: `complete` is always
        true. Cost: the response header `x-cost-units` is `min(asked, 50)`. Per row, `totalValueUsd` is
        0 when the trader holds nothing and null when nothing held could be priced; `valueUsd` per position
        is null, never 0, for an unpriceable coin. Balance snapshot is `holdings_current` (no Solana roll-forward
        here).'
