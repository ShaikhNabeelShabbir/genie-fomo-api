    post:
      operationId: batchTraderFlow
      tags:
      - Flow
      summary: Net token flow for up to 50 traders since a moment (Solana)
      description: 'The batch form of `GET /v1/traders/{handle}/flow`. Takes up to 50 ids (handles, display
        handles or `trd_` ids) and one `since`, and answers one `traders[]` entry per requested id in
        the order sent: `ok: true` with that trader''s rows, or `ok: false` with a `not_found` error object
        for an id the directory does not hold. Over 50 ids is a 400 refusal, never a silent trim, and
        a duplicate id (or an id and its handle naming the same trader) is a 400 `duplicate_identifier`.
        The batch envelope (`limit`, `asked`, `capped`, `asOf`) is stated on every response; `capped`
        is always `false` here because the cap refuses rather than trims, and `asOf` is `null` on this
        route. The response''s `x-cost-units` header equals `asked`.'
      requestBody:
        required: true
        description: Must be JSON; a body that does not parse answers 400 `bad_request` ("body must be
          JSON").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowBatchRequest'
            example:
              ids:
              - '397397'
              - trd_2f6d1c0e-8a7b-4c3d-9e1f-0a1b2c3d4e5f
              since: '2026-09-16T11:00:00Z'
