  /v1/traders/{handle}/transactions:
    get:
      operationId: getTraderTransactions
      tags:
      - Transactions
      summary: Stored transfers for a trader's wallets, newest first
      description: 'The transfer feed (`transactions` table) for every wallet on record for the trader,
        across chains, ordered by block time descending with the full primary key as the tiebreak. This
        is NOT a trade list: an inbound transfer is commonly a self-transfer between the trader''s own
        wallets. Use `?kind=swap` for rows a provider classified as a trade, and `/traders/{handle}/trades`
        for paired swaps. Keyset-paged: follow `nextCursor` until it is `null`; a full page is only a
        hint that more exist, so the page after exactly `limit` remaining rows is empty. The `money` block
        is a whole-wallet total, identical on every page, so it is included on the first page (no cursor)
        and omitted while paging unless `?money=true`. `null` means absent, never zero; `costUsd` is `null`
        on the memecoin leg of a swap. When the trader has no wallet address on record the body carries
        only `handle`, `name`, `wallets`, `count: 0`, `transfers: []` and `plain`.'
      parameters:
      - name: handle
        in: path
        required: true
        description: The trader's handle, display handle (case-insensitive), `@handle`, or stable id with
          or without the `trd_` prefix. Unknown answers 404 `not_found`.
        schema:
          type: string
        example: '397397'
      - name: chain
        in: query
        required: false
        description: Restrict to one chain by its `/v1/chains` name (case-insensitive, e.g. `solana`,
          `ethereum`, `bsc`, `base`, `robinhood`). A name not in the directory answers 400 `bad_request`
          ("unknown chain").
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size. Caps the whole result set, not per chain. A non-integer answers 400; below
          1 answers 400; above 500 is clamped to 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: kind
        in: query
        required: false
        description: Keep only rows whose provider classification (`tx_type`) matches. Case-insensitive.
          Any other word answers 400 `bad_request`.
        schema:
          type: string
          enum:
          - swap
          - transfer
      - name: cursor
        in: query
        required: false
        description: 'Opaque keyset cursor from a previous response''s `nextCursor`, unmodified. A cursor
          that does not decode, or that was issued by another route, answers 400 `bad_request` with `parameter:
          "cursor"`.'
        schema:
          type: string
      - name: money
        in: query
        required: false
        description: '`true` forces the whole-wallet `money` block on a paged request; `false` omits it
          on the first page. Any other value is treated as absent (default behaviour).'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: The page of transfers
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Scope:
              $ref: '#/components/headers/RateLimitScope'
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsPage'
              example:
                handle: '397397'
                name: null
                wallets:
                  evm: '0x7a250d5630b4cf539739df2c5dacb4c659f2488d'
                  solana: 5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1
                source: d1 · transactions
                asOf: '2026-09-16T12:04:11.000Z'
                feed: transfers
                caveats:
                  notTrades: an inbound transfer is commonly a self-transfer between the trader's own
                    wallets, not a purchase. Use ?kind=swap for rows a provider classified as an actual
                    trade, and read `kind` on each row.
                  noUsdValue: providers do not return a USD value or price per transfer, so none is published
                  limitIsTotal: limit caps the whole result set, not per chain
                  forTrades: /traders/397397/scorecard
                stored:
