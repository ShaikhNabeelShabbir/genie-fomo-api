        tokensPriced:
          type: integer
          minimum: 0
        tokensTotal:
          type: integer
          minimum: 0
        pricedShare:
          type: number
          nullable: true
        derivedFromChain:
          type: integer
          minimum: 0
        withMarketCap:
          type: integer
          minimum: 0
        marketCapShare:
          type: number
          nullable: true
