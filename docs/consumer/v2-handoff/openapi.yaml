        No blacklist, sanctions list or external reputation source is consulted, and the response

        says so (`blacklist.checked: false`, `listed: null` = not checked, never "checked and

        clear"). `verdict` describes the numbers, not the trader. A trader with no holdings row is

        treated as zero positions. Ratios are `null` when a denominator is absent or zero.

