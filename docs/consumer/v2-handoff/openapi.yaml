                  requestId: req_3f9c2a71b0e44d1a
                  retryAfterSeconds: 57
        '500':
          description: Unclassified failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: internal_error
