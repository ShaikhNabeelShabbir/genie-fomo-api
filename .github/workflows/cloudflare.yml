name: cloudflare worker

# Verifies the Worker on every push and deploys it when the account is wired up.
# See docs/CLOUDFLARE_MIGRATION.md §8.0 for how to obtain each of these.
#
#   secrets:   CLOUDFLARE_API_TOKEN     "Edit Cloudflare Workers" template + Hyperdrive Edit + Account Settings Read
#              CLOUDFLARE_ACCOUNT_ID    Workers & Pages overview sidebar
#   variables: CLOUDFLARE_DEPLOY        "true" turns the deploy job on (a secret cannot gate a job, see below)
#              WORKER_URL               https://genie-copy-trading-api.<subdomain>.workers.dev, for the post-deploy smoke

on:
  push:
    branches: [main, Junaid-deve-starts]
    paths:
      - 'worker/**'
      - 'supabase/functions/**'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      supabase_base:
        description: 'acceptance-diff: Supabase base URL (…/functions/v1/api); leave both empty to skip'
        required: false
        default: ''
      worker_base:
        description: 'acceptance-diff: Worker base URL'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: npx tsc -p worker/tsconfig.json
      - run: cd worker && npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: verify
    # `secrets.*` is not available in a job-level `if`, so the switch is a repository
    # variable: `gh variable set CLOUDFLARE_DEPLOY --body true`. Until then this job is skipped.
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Smoke the deployed Worker
        run: |
          test -n "$WORKER_URL" || { echo "::error::set the WORKER_URL repository variable"; exit 1; }
          curl -sf "$WORKER_URL/healthz"
      - name: API smoke (fails until /v1/* is ported — migration §5)
        continue-on-error: true
        run: API_VERSION=v2 ./scripts/smoke.sh "$WORKER_URL"

  acceptance-diff:
    # The §12 gate: the same capture against both deployments must diff empty.
    if: github.event_name == 'workflow_dispatch' && inputs.supabase_base != '' && inputs.worker_base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Capture both deployments and diff
        env:
          GENIE_API_KEY: ${{ secrets.GENIE_API_KEY }}
        run: |
          ./scripts/acceptance_capture.sh "${{ inputs.supabase_base }}" captures/supabase
          API_VERSION=v2 ./scripts/acceptance_capture.sh "${{ inputs.worker_base }}" captures/worker
          diff -r captures/supabase captures/worker > captures/diff.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-captures
          path: captures/
      - name: Fail when the diff is non-empty
        run: |
          if [ -s captures/diff.txt ]; then
            echo "::error::acceptance capture differs between Supabase and the Worker"
            head -100 captures/diff.txt
            exit 1
          fi
          echo "captures identical"
