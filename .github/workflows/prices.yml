name: hourly token prices

# Gap 1 (docs/consumer/workflow-coverage-17-sep.md): every held token, every chain, one
# DexScreener sample an hour into token_price_hourly with a rolling ATH in token_price_stats.
#
# Budget: DexScreener allows 300 calls/min, 30 addresses a call. The whole token directory
# (~26k rows) would be ~900 calls; the pass is capped to holdings_current rows with
# human_amount > 0, which is ~1,100 GMGN-indexed held tokens (docs/GMGN_PARITY_PLAN.md) plus
# ~600 Robinhood coins (docs/R4_ROBINHOOD_PRICES.md): ~1,700 tokens, ~60 calls, ~20 s under
# the 260 ms per-host throttle in scripts/lib/chain_reads.mjs.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Its own group: a slow hour must not queue behind or cancel the nightly refresh.
  group: prices-hourly
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 6543, transaction mode, same as the other .mjs loaders in refresh.yml.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same as refresh.yml: a connection string pasted into the secrets UI commonly carries
      # a trailing newline, which Postgres reports as `database "postgres\n" does not exist`.
      - name: Normalise connection strings
        run: |
          for v in DATABASE_URL; do
            clean="${!v}"
            clean="${clean//$'\n'/}"; clean="${clean//$'\r'/}"; clean="${clean//$'\t'/}"
            printf '%s=%s\n' "$v" "$clean" >> "$GITHUB_ENV"
          done
          echo "normalised DATABASE_URL"

      - run: npm ci

      - name: Price held tokens
        run: node scripts/load_token_prices.mjs
