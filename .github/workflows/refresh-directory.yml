name: refresh directory

# Rebuilds data/wallet.full.data.json from fomoapi.io and pushes it, which makes Render
# redeploy. Needs no privy token — fomoapi authenticates with a static key, which is the
# whole reason this can run unattended.
#
# Cost: 201 fomoapi calls per run (1 leaderboard + 2 per trader), so ~6030/month daily
# against a 10,000/month free tier. Switch the cron to '0 6 */2 * *' to halve that.

on:
  schedule:
    - cron: '0 6 * * *'        # 06:00 UTC daily
  workflow_dispatch:            # run by hand from the Actions tab

permissions:
  contents: write               # the job pushes the refreshed directory

concurrency:
  group: refresh-directory      # never let two refreshes race on the same branch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check requests

      # The script exits non-zero on any failure — an empty build, a rejected key, a
      # directory that would shrink by >20% — so this step going red is the signal that
      # something is wrong. It never pushes a partial or stale directory.
      - name: Build directory
        env:
          FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
        run: python3 build_directory_fomoapi.py --top 100

      # generated_at moves on every run, so a plain `git diff` is always dirty and would
      # redeploy Render daily for nothing. Only a real change to the traders array counts.
      - name: Commit if the leaderboard actually moved
        run: |
          set -euo pipefail
          git show HEAD:data/wallet.full.data.json | jq -S '.traders' > /tmp/old.json
          jq -S '.traders' data/wallet.full.data.json > /tmp/new.json
          if cmp -s /tmp/old.json /tmp/new.json; then
            echo "leaderboard unchanged — nothing to push"
            exit 0
          fi
          echo "traders changed: $(jq 'length' /tmp/old.json) -> $(jq 'length' /tmp/new.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "refresh directory"
          git push

      - name: Summary
        if: always()
        run: |
          jq -r '"traders: \(.traders|length)  positions: \([.traders[].holdings[]?]|length)  generated_at: \(.generated_at)"' \
            data/wallet.full.data.json >> "$GITHUB_STEP_SUMMARY" || true
