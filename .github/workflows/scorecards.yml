name: scorecard retry

# T1 (docs/TO-DO-BEFORE-MIGRATION.md §11). The nightly refresh loads trades once at 06:00;
# a trader fomo would not serve that night stayed stale until the next night, and the same
# 16 sat at 7 Sep for nine days. This lighter pass retries only traders past the scorecard's
# own 72 h allowance, four times a day, so a bad night costs hours rather than a day.
#
# Budget: ~16 stale fomo traders a pass against 10k calls a month. `--source fomoapi.io`
# keeps it off the GMGN roster, which fomo answers `available: false` for every time.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Its own group: it must never cancel or queue behind the nightly refresh.
  group: scorecard-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOMOAPI_KEY:     ${{ secrets.FOMOAPI_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      # Same as refresh.yml: a connection string pasted into the secrets UI commonly carries
      # a trailing newline, which Postgres reports as `database "postgres\n" does not exist`.
      - name: Normalise connection strings
        run: |
          for v in SUPABASE_DB_URL; do
            clean="${!v}"
            clean="${clean//$'\n'/}"; clean="${clean//$'\r'/}"; clean="${clean//$'\t'/}"
            printf '%s=%s\n' "$v" "$clean" >> "$GITHUB_ENV"
          done
          echo "normalised SUPABASE_DB_URL"

      - run: pip install --disable-pip-version-check requests 'psycopg[binary]>=3.1'

      - name: Retry stale scorecards
        run: python3 loaders/load_trades.py --converge --stale-hours 72 --source fomoapi.io
