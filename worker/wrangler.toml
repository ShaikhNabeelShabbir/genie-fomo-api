# The one Worker. See docs/CLOUDFLARE_MIGRATION.md §11.
name = "genie-copy-trading-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]


# Every loader runs here as a sliced cron job (src/index.ts JOBS maps each string to a job).
# GitHub Actions is CI/CD only. Balance history is BUILT into aum_history, not sampled;
# /sample stays for a manual read. Each job stops on its own before JOB_BUDGET_MS.
[triggers]
crons = [
  "17 * * * *", "25 * * * *", "40 * * * *", "45 * * * *", "*/30 * * * *",
  "5 */2 * * *", "10 */2 * * *", "15,45 * * * *", "0 */6 * * *",
  "35 3 * * *", "50 4 * * *", "55 5 * * *", "15 2 * * *", "0 1 * * *", "*/5 * * * *",
]

# The database since 17 Sep 2026: Cloudflare D1 (SQLite). Postgres and Hyperdrive are gone.
[[d1_databases]]
binding = "DB"
database_name = "genie-copy-trading"
database_id = "fa5a33dc-ed4d-48a9-8a91-ae76be85456d"
migrations_dir = "d1/migrations"

[limits]
cpu_ms = 300000   # Workers Paid maximum; the fee and swap decoders are CPU-bound

[vars]
AUM_LIVE_AFTER_MINUTES = "5"
AUM_LIVE_WAIT_MS = "3000"
AUM_SAMPLE_BUDGET_MS = "100000"
JOB_BUDGET_MS = "600000"
BALANCE_SLICE = "25"
# Helius pushes go to this Worker; the transfers job registers it on the watch list.
WEBHOOK_URL = "https://genie-copy-trading-api.agent-73b.workers.dev/webhook"
RATE_LIMIT_PER_MINUTE = "240"
ROUTE_TIMEOUT_MS = "15000"

[observability]
enabled = true
