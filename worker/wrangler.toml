# The one Worker. See docs/CLOUDFLARE_MIGRATION.md §11.
name = "genie-copy-trading-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Created 17 Sep 2026 against the direct (IPv6) host with caching disabled, the id that
# `npx wrangler hyperdrive create genie-copy-trading-db --connection-string=… --caching-disabled` prints (§8.0).
# Until then /webhook answers 503 not_configured.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "d63d855a124c463a93318e8d225f1735"
# `wrangler dev` without --remote connects straight to this; no pooling, no caching.
# localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"

# Every loader runs here as a sliced cron job (src/index.ts JOBS maps each string to a job).
# GitHub Actions is CI/CD only. Balance history is BUILT into aum_history, not sampled;
# /sample stays for a manual read. Each job stops on its own before JOB_BUDGET_MS.
# PAUSED 17 Sep 09:3x UTC for the Postgres -> D1 export: the jobs are what saturated the
# source database. Restore from scratchpad/crons.bak once the export is verified.
[triggers]
crons = ["0 5 31 2 *"]

# The database from 18 Sep 2026: Cloudflare D1 (SQLite). Hyperdrive/Postgres stays bound only until
# the D1 copy is verified, then its block goes.
[[d1_databases]]
binding = "DB"
database_name = "genie-copy-trading"
database_id = "fa5a33dc-ed4d-48a9-8a91-ae76be85456d"
migrations_dir = "d1/migrations"

[limits]
cpu_ms = 300000   # Workers Paid maximum; the fee and swap decoders are CPU-bound

[vars]
AUM_LIVE_AFTER_MINUTES = "5"
AUM_LIVE_WAIT_MS = "3000"
AUM_SAMPLE_BUDGET_MS = "100000"
JOB_BUDGET_MS = "600000"
BALANCE_SLICE = "25"
# Helius pushes go to this Worker; the transfers job registers it on the watch list.
WEBHOOK_URL = "https://genie-copy-trading-api.agent-73b.workers.dev/webhook"
RATE_LIMIT_PER_MINUTE = "240"
ROUTE_TIMEOUT_MS = "15000"

[observability]
enabled = true
